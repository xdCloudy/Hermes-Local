name: Feature request
description: Suggest a Windows-native, local-first improvement
title: "[Feature]: "
labels:
  - "type: feature"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Explain the capability rather than prescribing a large implementation.
        Check the live roadmap and existing issues before submitting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the roadmap for this request.
          required: true
        - label: This preserves the Windows-native, local-first direction.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and data impact
      description: Note any network, filesystem, credential, terminal, or update implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: What observable outcome would make this feature complete?
    validations:
      required: true
