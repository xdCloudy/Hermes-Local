name: Append native SSH migration checkpoint

on:
  push:
    branches:
      - refactor/dioxus-rust-client

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dioxus-rust-client
          fetch-depth: 0
      - name: Append checkpoint once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.codex/HERMES-DIOXUS-MIGRATION.md')
          s = p.read_text()
          marker = '## Native SSH lifecycle checkpoint (2026-08-11)'
          if marker not in s:
              s += r'''

## Native SSH lifecycle checkpoint (2026-08-11)

Native Desktop SSH has moved behind the typed Rust `ConnectionService` boundary using the system OpenSSH client; raw SSH process/token authority is not exposed to shared Dioxus UI code.

- Probe/transport preserves normal OpenSSH configuration, ProxyJump, ssh-agent and hardware-key behavior while validating argv components and classifying host-key/auth/network failures.
- Linux/macOS owned lifecycle implements profile-scoped ownership identity, schema-v2/protocol-v1 locks, exact PID/cmdline ownership proof, secure token-file upload, isolated loopback-only remote launch, immediate port=0 ownership recording, readiness parsing, local forwarding, authenticated reuse proof, served-token adoption and provably-owned stale cleanup.
- Windows owned lifecycle uses the canonical `hermes_cli.windows_ssh_runtime` helper through encoded PowerShell and binds process ownership to PID + `creationTimeNs` + Hermes path + spawn nonce. Reuse additionally requires matching profile, token fingerprint, Hermes path/home and nonzero port. Indeterminate or unowned remote processes are never terminated.
- Reuse tokens remain native-only and use the Windows keyring backend; the shared UI receives only typed connection state/results.
- Official Windows Rust validation has proven architecture guard, rustfmt, all-target Cargo check, shared-UI WASM check and the full Rust unit suite for this slice. The first run stopped only on three Clippy-all style findings in the new Windows module; those findings were corrected and official validation was rerun.
- Real SSH-host integration remains required for actual Linux/macOS/Windows targets, reconnect/reuse, stale ownership, network loss, host-key rotation and agent/hardware-key setups. Do not equate compile/unit validation with that live-host validation.

Next after the SSH gate is green: record optimized binary size, update the migration matrix/PR status truthfully, then continue the remaining OG parity slices rather than redesigning the client.
'''
              p.write_text(s)
          PY
      - name: Commit journal update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .codex/HERMES-DIOXUS-MIGRATION.md
          git commit -m 'docs: checkpoint native SSH lifecycle migration'
          git push origin HEAD:refactor/dioxus-rust-client
