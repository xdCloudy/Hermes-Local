name: Apply SSH token fixture correction

on:
  push:
    branches:
      - refactor/dioxus-rust-client

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dioxus-rust-client
          fetch-depth: 0
      - name: Correct fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/desktop/src/ssh_lifecycle.rs')
          s = p.read_text()
          old = r'''let html = r#"<script>window.__HERMES_SESSION_TOKEN__ = \"abc\\\"def\";</script>"#;'''
          new = r'''let html = r#"<script>window.__HERMES_SESSION_TOKEN__ = "abc\"def";</script>"#;'''
          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('fixture not found')
          PY
      - name: Commit if changed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/ssh_lifecycle.rs
          git commit -m 'test(ssh): use valid served-token JavaScript fixture'
          git push origin HEAD:refactor/dioxus-rust-client
