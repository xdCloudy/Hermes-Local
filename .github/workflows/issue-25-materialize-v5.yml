name: Issue 25 credential-redaction materializer

on:
  pull_request:
    paths:
      - '.github/workflows/issue-25-materialize-v5.yml'
      - '.github/issue-25/**'

permissions:
  contents: write

concurrency:
  group: issue-25-materialize-v5
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-25-security-scan-tasks
          fetch-depth: 0

      - name: Decode and correct payload
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $payload = '.\.github\issue-25'
          $parts = @(Get-ChildItem -LiteralPath $payload -Filter 'payload.part*.b64' -File | Sort-Object Name)
          if ($parts.Count -ne 4) { throw "Expected 4 payload chunks, found $($parts.Count)." }
          $archive = Join-Path $payload 'payload.zip'
          $encoded = (($parts | ForEach-Object { (Get-Content -Raw -LiteralPath $_.FullName).Trim() }) -join '')
          [System.IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '6f43a5bce5c9377cd022fa7cccc72963b2f2a4ba4efb44a849befe1ece832a2a') { throw "Payload digest mismatch: $digest" }
          $extracted = Join-Path $payload 'extracted-v5'
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted -Force

          @'
          from pathlib import Path
          import json
          import shutil

          root = Path.cwd()
          extracted = root / '.github' / 'issue-25' / 'extracted-v5'
          progress = extracted / 'Security-Progress.ps1'
          text = progress.read_text(encoding='utf-8')

          for old, new in (
              (".TrimEnd('\\\\', '/')", ".TrimEnd([char[]]@([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar))"),
              ("return $relative.Replace('\\\\', '/')", "return $relative.Replace([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar)"),
          ):
              if old not in text:
                  raise RuntimeError(f'Missing correction point: {old}')
              text = text.replace(old, new, 1)

          credential_anchor = "    $safe = $safe -replace '(?i)\\b(?:https?|wss?)://"
          credential_redaction = (
              "    $safe = $safe -replace '(?i)\\bAuthorization\\s*:\\s*Bearer\\s+[^\\s,;]+', 'Authorization: Bearer [REDACTED]'\n"
              "    $safe = $safe -replace '(?i)\\b(?:token|api[_-]?key|secret|password|credential)\\s*[:=]\\s*[^\\s,;]+', '[REDACTED-CREDENTIAL]'\n"
          )
          if credential_anchor not in text:
              raise RuntimeError('Missing credential-redaction insertion point')
          text = text.replace(credential_anchor, credential_redaction + credential_anchor, 1)

          log_marker = "        $logLine = '{0} [{1}] {2}: {3}' -f $now.ToString('o'), $Status, $Stage, $safeMessage\n"
          if log_marker not in text:
              raise RuntimeError('Missing security task log-line marker')
          log_setup = (
              "        $logDirectory = [System.IO.Path]::GetDirectoryName($script:securityTaskLogPath)\n"
              "        if ($logDirectory) {\n"
              "            [System.IO.Directory]::CreateDirectory($logDirectory) | Out-Null\n"
              "        }\n"
          )
          text = text.replace(log_marker, log_setup + log_marker, 1)
          progress.write_text(text, encoding='utf-8', newline='\n')

          contract = extracted / 'Test-HermesSecurityScanProgress.ps1'
          contract_text = contract.read_text(encoding='utf-8')
          old_assertion = "    Assert-True ($cancelled.completedAt) 'Cancelled scan omitted its completion timestamp.'"
          new_assertion = "    Assert-True (-not [string]::IsNullOrWhiteSpace([string]$cancelled.completedAt)) 'Cancelled scan omitted its completion timestamp.'"
          if old_assertion not in contract_text:
              raise RuntimeError('Missing completion timestamp assertion marker')
          contract.write_text(contract_text.replace(old_assertion, new_assertion, 1), encoding='utf-8', newline='\n')

          targets = {
              extracted / 'Security-Scan-Hermes-Local.ps1': root / 'Security-Scan-Hermes-Local.ps1',
              progress: root / 'scripts' / 'security' / 'Security-Progress.ps1',
              contract: root / 'tests' / 'Test-HermesSecurityScanProgress.ps1',
              extracted / '0036-feat-desktop-instrument-security-scan-task-progress.patch': root / 'source' / 'hermes-launcher' / 'patches' / '0036-feat-desktop-instrument-security-scan-task-progress.patch',
          }
          for source, target in targets.items():
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)

          compatibility = root / 'scripts' / 'ci' / 'compatibility.py'
          value = compatibility.read_text(encoding='utf-8')
          needle = '                    run([vitest, "run", "--project", "electron", "electron/hermes-local-update.test.ts"], cwd=source / "apps/desktop", log=logs / "tests.log")\n'
          if 'hermes-local-security-progress.test.ts' not in value:
              if needle not in value:
                  raise RuntimeError('Compatibility insertion point not found')
              value = value.replace(
                  needle,
                  needle
                  + '                    run([vitest, "run", "--project", "electron", "electron/hermes-local-security-progress.test.ts"], cwd=source / "apps/desktop", log=logs / "tests.log")\n'
                  + '                    run([vitest, "run", "src/app/local-workstation/task-centre.test.tsx", "src/app/local-workstation/security-task-view.test.tsx"], cwd=source / "apps/desktop", log=logs / "tests.log")\n',
                  1,
              )
              value = value.replace(
                  'done.append("desktop:typecheck,lint,focused-electron,project-registry")',
                  'done.append("desktop:typecheck,lint,focused-electron,security-task-ui,project-registry")',
                  1,
              )
          compatibility.write_text(value, encoding='utf-8', newline='\n')

          version_path = root / 'VERSION.json'
          version = json.loads(version_path.read_text(encoding='utf-8'))
          version['product']['version'] = '0.18.18'
          version['sources']['hermesAgent']['integrationCommit'] = '2328d03544cfc4cbbccf1e7a6a2ea0742d6adbaa'
          version['sources']['hermesAgent']['integrationTree'] = 'facb49e58567e5ef9be8ff10bd1e4d208293c09e'
          version['recordedAt'] = '2026-08-03T13:52:00Z'
          version_path.write_text(json.dumps(version, indent=2) + '\n', encoding='utf-8', newline='\n')
          '@ | python -

      - name: Validate security contract and patch identity
        shell: pwsh
        run: |
          $errorsFound = [System.Collections.Generic.List[string]]::new()
          foreach ($file in @(
            '.\Security-Scan-Hermes-Local.ps1',
            '.\scripts\security\Security-Progress.ps1',
            '.\tests\Test-HermesSecurityScanProgress.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            foreach ($error in @($errors)) {
              $errorsFound.Add("${file}:$($error.Extent.StartLineNumber): $($error.Message)")
            }
          }
          if ($errorsFound.Count -gt 0) { throw ($errorsFound -join [Environment]::NewLine) }

          & '.\tests\Test-HermesSecurityScanProgress.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Security contract failed with exit code $LASTEXITCODE." }
          python -m py_compile '.\scripts\ci\compatibility.py'
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility Python syntax failed.' }

          $manifest = Get-Content -Raw -LiteralPath '.\VERSION.json' | ConvertFrom-Json
          $source = Join-Path $env:RUNNER_TEMP 'issue-25-v5-agent'
          $patches = @(Get-ChildItem '.\source\hermes-launcher\patches' -Filter '*.patch' -File | Sort-Object Name | ForEach-Object FullName)
          git clone --no-checkout $manifest.sources.hermesAgent.repository $source
          git -C $source checkout --detach $manifest.sources.hermesAgent.commit
          git -C $source config user.name 'Hermes Local Integration'
          git -C $source config user.email 'hermes-local-ci@localhost'
          git -C $source am --3way --committer-date-is-author-date @patches
          if ($LASTEXITCODE -ne 0) { throw 'The 36-patch integration failed.' }
          $tree = (git -C $source rev-parse 'HEAD^{tree}').Trim()
          if ($tree -ne 'facb49e58567e5ef9be8ff10bd1e4d208293c09e') { throw "Canonical tree mismatch: $tree" }

      - name: Commit permanent implementation
        shell: pwsh
        run: |
          git config user.name 'Hermes Local CI'
          git config user.email 'hermes-local-ci@localhost'
          git add -- 'Security-Scan-Hermes-Local.ps1' 'scripts/security/Security-Progress.ps1' 'tests/Test-HermesSecurityScanProgress.ps1' 'source/hermes-launcher/patches/0036-feat-desktop-instrument-security-scan-task-progress.patch' 'scripts/ci/compatibility.py' 'VERSION.json'
          git rm -r --ignore-unmatch '.github/issue-25'
          Get-ChildItem '.\.github' -Filter 'issue-25-payload.part-*' -File -ErrorAction SilentlyContinue | ForEach-Object { git rm -- $_.FullName }
          git commit -m 'feat: instrument security scans with durable task progress'
          git push origin HEAD:agent/issue-25-security-scan-tasks
