name: GT-05 Review discard staging v3

on:
  push:
    branches:
      - goal-loop/gt05-review-discard
    paths:
      - .github/workflows/gt05-review-discard-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal-loop/gt05-review-discard
          fetch-depth: 0

      - name: Repair marker scan and apply GT-05 slice
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path("scripts/ci/gt05_stage_patch_v2.py")
          text = p.read_text(encoding="utf-8")
          old = '''button_start = refresh_title - 1
          if lines[button_start].strip() != "button {":
              raise SystemExit("review.rs: refresh button start was not adjacent")'''
          new = '''button_start = next(
              (i for i in range(refresh_title - 1, -1, -1) if lines[i].strip() == "button {"),
              None,
          )
          if button_start is None:
              raise SystemExit("review.rs: refresh button owner not found")'''
          if text.count(old) != 1:
              raise SystemExit("GT-05 patch script marker changed unexpectedly")
          p.write_text(text.replace(old, new), encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/gt05_stage_patch_v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate GT-05 architecture runtime and UI contracts
        shell: pwsh
        run: |
          python scripts/ci/check_dioxus_rust_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_discard_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_review --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_discard_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated GT-05 product slice
        shell: pwsh
        run: |
          Remove-Item .github/workflows/gt05-review-discard.yml
          Remove-Item .github/workflows/gt05-review-discard-v2.yml
          Remove-Item .github/workflows/gt05-review-discard-v3.yml
          Remove-Item scripts/ci/gt05_stage_patch_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(review): add confirmed Git discard actions"
          git push origin HEAD:goal-loop/gt05-review-discard
