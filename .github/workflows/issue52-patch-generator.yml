name: Issue 52 patch generator

on:
  push:
    branches:
      - fix/issue-52-stable-session-projects
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hermes Local
        uses: actions/checkout@v4

      - name: Reconstruct pinned Hermes integration tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          git -C /tmp/hermes-agent checkout --quiet 91937a6dc3ffbbe2f3be91a500f0ecf962c4cf53
          git -C /tmp/hermes-agent config user.name 'Hermes Local Patch Generator'
          git -C /tmp/hermes-agent config user.email 'patch-generator@hermes.local'

          for patch in source/hermes-launcher/patches/*.patch; do
            name="$(basename "$patch")"
            if [[ "$name" == "0089-feat-persist-stable-session-project-ids.patch" ]]; then
              continue
            fi
            git -C /tmp/hermes-agent am --3way "$GITHUB_WORKSPACE/$patch"
          done

          actual="$(git -C /tmp/hermes-agent rev-parse 'HEAD^{tree}')"
          expected="aedc223f25a1002350cb9d4ef200f32947a5a8cd"
          echo "Reconstructed integration tree: $actual"
          test "$actual" = "$expected"

      - name: Generate issue 52 patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/issue52_generator_driver.py /tmp/hermes-agent /tmp/0093-feat-associate-chats-with-stable-project-ids.patch
          git -C /tmp/hermes-agent show --check --stat --oneline HEAD
          echo "Generated integration tree: $(git -C /tmp/hermes-agent rev-parse 'HEAD^{tree}')"

      - name: Upload generated patch
        uses: actions/upload-artifact@v4
        with:
          name: issue52-generated-patch
          path: /tmp/0093-feat-associate-chats-with-stable-project-ids.patch
          if-no-files-found: error

      - name: Finalize branch with generated patch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/0093-feat-associate-chats-with-stable-project-ids.patch \
            source/hermes-launcher/patches/0093-feat-associate-chats-with-stable-project-ids.patch
          rm -f source/hermes-launcher/patches/0089-feat-persist-stable-session-project-ids.patch

          git fetch --quiet origin main --depth=1
          git checkout origin/main -- .github/workflows/hermes-agent-patch-smoke.yml

          git rm -f --ignore-unmatch \
            .github/workflows/issue52-patch-generator.yml \
            scripts/ci/issue52_backend_gen.py \
            scripts/ci/issue52_frontend_gen.py \
            scripts/ci/issue52_generator_driver.py

          git config user.name 'xdCloudy'
          git config user.email 'connerabery@gmail.com'
          git add source/hermes-launcher/patches .github/workflows/hermes-agent-patch-smoke.yml
          git commit -m 'feat(projects): associate chats with stable project ids'
          git push origin HEAD:fix/issue-52-stable-session-projects
