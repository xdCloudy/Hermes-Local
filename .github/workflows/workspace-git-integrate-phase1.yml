name: Integrate validated Workspace Git tranche

on:
  push:
    branches:
      - goal-loop/workspace-git-tranche
    paths:
      - .github/workflows/workspace-git-integrate-phase1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal-loop/workspace-git-tranche
          fetch-depth: 0

      - name: Apply validated GT-06 and GT-02/03 product diffs
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin goal-loop/gt06-review-ship-rebased2 goal-loop/gt02-03-source-control
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --binary --output=gt06.patch d161776102c9e7e05ee8ec7828fba4d0020882a2..a2f72300aabaf5e207419a7e9818ca6834b51339 --
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --3way --index gt06.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item gt06.patch
          git commit -m "feat(review): add commit push and PR ship actions"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --binary --output=gt0203.patch a84247a14e7e89c9ae9088dbe0611691341df882..4a8aec63c40cab5607141284cf14a8ce5b9b57bd --
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --3way --index gt0203.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item gt0203.patch
          git commit -m "feat(git): add branch and worktree management surfaces"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff d161776102c9e7e05ee8ec7828fba4d0020882a2..HEAD --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate combined Workspace Git tree
        shell: pwsh
        run: |
          python scripts/ci/check_dioxus_rust_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo test -p hermes-desktop --test git_status_parity --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_ship_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_review --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_discard_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_ship_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_branch_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_worktree_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_source_control_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo clippy --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish clean combined branch
        shell: pwsh
        run: |
          Remove-Item .github/workflows/workspace-git-integrate-phase1.yml
          git add .github/workflows/workspace-git-integrate-phase1.yml
          git commit -m "chore(ci): remove Workspace Git integration helper"
          git push origin HEAD:goal-loop/workspace-git-tranche
