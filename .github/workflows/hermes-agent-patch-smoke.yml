name: Hermes Agent patch smoke

on:
  pull_request:
    paths:
      - '.github/workflows/hermes-agent-patch-smoke.yml'
      - '.github/workflows/upstream-compatibility.yml'
      - 'scripts/ci/compatibility.py'
      - 'tests/test_compatibility.py'
      - 'VERSION.json'
      - 'source/hermes-launcher/patches/**'

permissions:
  contents: read

concurrency:
  group: hermes-agent-patch-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-series:
    name: Apply complete Hermes Agent patch series
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Apply patches to current upstream candidate
        shell: pwsh
        run: |
          python '.\scripts\ci\compatibility.py' hermes-agent `
            --repository-root '.' `
            --work-dir '.\temp\compatibility\hermes-agent-patch-smoke' `
            --log-dir '.\artifacts\compatibility\hermes-agent-patch-smoke\logs' `
            --report '.\artifacts\compatibility\hermes-agent-patch-smoke\hermes-agent-report.json'

      - name: Upload patch application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-hermes-agent-patch-smoke
          path: artifacts/compatibility/hermes-agent-patch-smoke
          if-no-files-found: error
          retention-days: 14
