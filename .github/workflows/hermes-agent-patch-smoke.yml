name: Hermes Agent harness and native client

on:
  pull_request:
    paths:
      - '.github/workflows/hermes-agent-patch-smoke.yml'
      - 'apps/desktop/**'
      - 'packages/hermes-agent-client/**'
      - 'package.json'
      - 'package-lock.json'
      - 'config/architecture.json'
      - 'scripts/ci/check_native_client_architecture.py'
      - 'scripts/ci/compatibility.py'
      - 'tests/test_native_client_architecture.py'
      - 'VERSION.json'
      - 'source/hermes-launcher/patches/**'
      - 'Build-Hermes-Launcher.ps1'
      - 'Package-Hermes-Launcher.ps1'
      - 'Update-Hermes-Agent.ps1'

permissions:
  contents: read

concurrency:
  group: hermes-agent-harness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  boundary:
    name: Validate native client and harness boundary
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate repository ownership contract
        shell: pwsh
        run: |
          python .\scripts\ci\check_native_client_architecture.py
          python -m unittest tests.test_native_client_architecture tests.test_issue18_trust_centre

      - name: Reconstruct harness and validate both components
        shell: pwsh
        env:
          HERMES_LOCAL_ROOT: ${{ github.workspace }}
        run: |
          $manifest = Get-Content -Raw '.\VERSION.json' | ConvertFrom-Json
          $candidate = [string]$manifest.sources.hermesAgent.commit
          $expectedHarnessTree = ([string]$manifest.sources.hermesAgent.harnessTree).ToLowerInvariant()
          if ($expectedHarnessTree -notmatch '^[0-9a-f]{40}$') {
            throw 'VERSION.json must pin a 40-character Hermes Agent harness tree.'
          }

          $reportPath = '.\artifacts\compatibility\hermes-agent-harness\report.json'
          $arguments = @(
            '.\scripts\ci\compatibility.py', 'hermes-agent',
            '--repository-root', '.',
            '--candidate-ref', $candidate,
            '--work-dir', '.\temp\compatibility\hermes-agent-harness',
            '--log-dir', '.\artifacts\compatibility\hermes-agent-harness\logs',
            '--report', $reportPath,
            '--run-desktop-checks',
            '--run-python-checks',
            '--run-package-checks'
          )
          & python @arguments
          $checkerExit = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw 'Compatibility checker did not produce a report.'
          }

          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          $actualHarnessTree = ([string]$report.stages.patches.harnessTree).ToLowerInvariant()
          $requiredStages = @('patches', 'dependencies', 'tests', 'build', 'package')
          $failedStages = @(
            foreach ($stage in $requiredStages) {
              if ([string]$report.stages.$stage.status -ne 'passed') {
                "$stage=$([string]$report.stages.$stage.status)"
              }
            }
          )

          @(
            '# Hermes Agent harness and native client', '',
            "**Agent base:** ``$candidate``",
            "**Expected harness tree:** ``$expectedHarnessTree``",
            "**Actual harness tree:** ``$actualHarnessTree``",
            "**Checker exit:** ``$checkerExit``",
            "**Stages:** ``$($requiredStages -join ', ')``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          if ($actualHarnessTree -ne $expectedHarnessTree) {
            throw "Harness reconstruction produced $actualHarnessTree; expected $expectedHarnessTree."
          }
          if ($checkerExit -ne 0 -or $failedStages.Count -gt 0) {
            throw "Compatibility validation failed: $($failedStages -join ', '); exit $checkerExit."
          }

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-hermes-agent-harness
          path: artifacts/compatibility/hermes-agent-harness
          if-no-files-found: error
          retention-days: 14
