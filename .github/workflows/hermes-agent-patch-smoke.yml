name: Hermes Agent patch smoke

on:
  pull_request:
    paths:
      - '.github/workflows/hermes-agent-patch-smoke.yml'
      - '.github/workflows/upstream-compatibility.yml'
      - 'scripts/ci/compatibility.py'
      - 'tests/test_compatibility.py'
      - 'tests/test_issue18_trust_centre.py'
      - 'VERSION.json'
      - 'source/hermes-launcher/patches/**'

permissions:
  contents: read

concurrency:
  group: hermes-agent-patch-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-series:
    name: Produce Hermes Agent patch evidence
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Trust Centre repository contract
        shell: pwsh
        run: python -m unittest tests.test_issue18_trust_centre

      - name: Probe Trust Centre integration preimage
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -LiteralPath '.\VERSION.json' | ConvertFrom-Json
          $candidate = [string]$manifest.sources.hermesAgent.commit
          $probe = Join-Path $env:RUNNER_TEMP 'hermes-trust-preimage'
          if (Test-Path -LiteralPath $probe) {
            Remove-Item -LiteralPath $probe -Recurse -Force
          }
          & git clone --quiet --no-checkout https://github.com/NousResearch/hermes-agent.git $probe
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone Hermes Agent for Trust Centre preimage probe.' }
          & git -C $probe checkout --quiet --detach $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out pinned Hermes Agent candidate.' }
          & git -C $probe config user.email 'ci@local.invalid'
          & git -C $probe config user.name 'Hermes Local CI'

          $patches = Get-ChildItem -LiteralPath '.\source\hermes-launcher\patches' -Filter '*.patch' -File |
            Sort-Object Name |
            Where-Object { $_.Name -lt '0085-feat-desktop-wire-native-Trust-Centre-IPC.patch' }
          & git -C $probe am --3way --committer-date-is-author-date @($patches.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Trust Centre preimage probe failed before patch 0085.' }

          $files = @(
            @{ Path = Join-Path $probe 'apps\desktop\electron\hermes-local-control.ts'; Pattern = "ipcMain|hermes:local:path:open|registerHermesLocalControlIpc|from 'electron'" },
            @{ Path = Join-Path $probe 'apps\desktop\electron\preload.ts'; Pattern = 'openRoot|openPath|openDashboard' },
            @{ Path = Join-Path $probe 'apps\desktop\src\global.d.ts'; Pattern = 'LocalWorkstationSnapshot|openRoot|registerModel' }
          )
          foreach ($file in $files) {
            Write-Host "=== exact preimage: $($file.Path) ==="
            Select-String -LiteralPath $file.Path -Pattern $file.Pattern -Context 3,3 |
              ForEach-Object { Write-Host $_.ToString() }
          }

          $patch85 = (Resolve-Path '.\source\hermes-launcher\patches\0085-feat-desktop-wire-native-Trust-Centre-IPC.patch').Path
          Write-Host '=== direct git apply check for patch 0085 ==='
          & git -C $probe apply --check --verbose $patch85
          Write-Host "git apply --check exit: $LASTEXITCODE"
          & git -C $probe hash-object 'apps/desktop/electron/hermes-local-control.ts'
          & git -C $probe hash-object 'apps/desktop/electron/preload.ts'
          & git -C $probe hash-object 'apps/desktop/src/global.d.ts'

      - name: Reconstruct and validate pinned release integration
        shell: pwsh
        env:
          HERMES_LOCAL_ROOT: ${{ github.workspace }}
        run: |
          $manifestPath = Join-Path $env:HERMES_LOCAL_ROOT 'VERSION.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Hermes Local version manifest is missing: $manifestPath"
          }
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $candidate = [string]$manifest.sources.hermesAgent.commit
          $expectedIntegrationTree = [string]$manifest.sources.hermesAgent.integrationTree
          if ($expectedIntegrationTree -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'VERSION.json must pin a 40-character Hermes Agent integration tree whenever the patch series is declared.'
          }
          $expectedIntegrationTree = $expectedIntegrationTree.ToLowerInvariant()

          $reportPath = '.\artifacts\compatibility\hermes-agent-patch-smoke\hermes-agent-report.json'
          $workRoot = '.\temp\compatibility\hermes-agent-patch-smoke'
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'hermes-agent-patch-smoke.stdout.log'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'hermes-agent-patch-smoke.stderr.log'
          $arguments = @(
            '.\scripts\ci\compatibility.py',
            'hermes-agent',
            '--repository-root', '.',
            '--candidate-ref', $candidate,
            '--work-dir', $workRoot,
            '--log-dir', '.\artifacts\compatibility\hermes-agent-patch-smoke\logs',
            '--report', $reportPath,
            '--keep-workspace',
            '--run-desktop-checks',
            '--run-python-checks',
            '--run-package-checks'
          )

          $process = Start-Process `
            -FilePath 'python' `
            -ArgumentList $arguments `
            -NoNewWindow `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath
          $checkerExit = $process.ExitCode

          if (Test-Path -LiteralPath $stdoutPath -PathType Leaf) {
            Get-Content -LiteralPath $stdoutPath
          }
          if (Test-Path -LiteralPath $stderrPath -PathType Leaf) {
            Get-Content -LiteralPath $stderrPath | ForEach-Object { Write-Host $_ }
          }

          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw 'Compatibility checker did not produce a report.'
          }

          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
          if ($report.status -eq 'infrastructure-failure') {
            throw 'Compatibility checker failed because of CI or source infrastructure.'
          }
          if (-not $report.metadata.preimageSeedTree) {
            throw 'Compatibility checker did not reconstruct the pinned integration tree.'
          }
          if (@($report.failures | Where-Object { $_.phase -eq 'preimage-seed' }).Count -gt 0) {
            throw 'Pinned patch reconstruction failed.'
          }

          $preimageTree = ([string]$report.metadata.preimageSeedTree).ToLowerInvariant()
          if ($preimageTree -ne $expectedIntegrationTree) {
            throw "Pinned patch reconstruction produced tree $preimageTree; VERSION.json expects $expectedIntegrationTree."
          }

          $candidateIntegrationTree = ([string]$report.stages.patches.integrationTree).ToLowerInvariant()
          if ($candidateIntegrationTree -ne $expectedIntegrationTree) {
            throw "Candidate patch reconstruction produced tree $candidateIntegrationTree; VERSION.json expects $expectedIntegrationTree."
          }

          $requiredStages = @('patches', 'dependencies', 'tests', 'build', 'package')
          $failedStages = @(
            foreach ($stage in $requiredStages) {
              $status = [string]$report.stages.$stage.status
              if ($status -ne 'passed') {
                "$stage=$status"
              }
            }
          )

          $focusedTestExit = -1
          if ($checkerExit -eq 0 -and $failedStages.Count -eq 0) {
            $source = Resolve-Path (Join-Path $workRoot 'hermes-agent')
            $desktop = Join-Path $source 'apps\desktop'

            Push-Location $source
            try {
              & uv run pytest tests/hermes_cli/test_hermes_local_trust.py -q
              $focusedTestExit = $LASTEXITCODE
            } finally {
              Pop-Location
            }

            if ($focusedTestExit -eq 0) {
              Push-Location $desktop
              try {
                & npm.cmd --prefix $source exec -- vitest run `
                  --project electron `
                  electron/hermes-local-control.test.ts `
                  electron/hermes-local-task-model.test.ts `
                  electron/hermes-local-model-download.test.ts `
                  electron/hermes-local-restore.test.ts `
                  electron/hermes-local-update.test.ts `
                  electron/hermes-local-security-progress.test.ts `
                  electron/hermes-local-benchmark-progress.test.ts `
                  electron/hermes-local-trust-centre.test.ts
                $focusedTestExit = $LASTEXITCODE
                if ($focusedTestExit -eq 0) {
                  & npm.cmd --prefix $source exec -- vitest run `
                    src/app/local-workstation/task-centre.test.tsx `
                    src/app/local-workstation/model-download-card.test.tsx `
                    src/app/local-workstation/security-task-view.test.tsx
                  $focusedTestExit = $LASTEXITCODE
                }
              } finally {
                Pop-Location
              }
            }
          }

          @(
            '# Hermes Agent patch smoke',
            '',
            "**Pinned candidate:** ``$candidate``",
            "**Checker exit:** ``$checkerExit``",
            "**Candidate status:** ``$($report.status)``",
            "**Expected integration tree:** ``$expectedIntegrationTree``",
            "**Pinned preimage tree:** ``$preimageTree``",
            "**Candidate integration tree:** ``$candidateIntegrationTree``",
            "**Required stages:** ``$($requiredStages -join ', ')``",
            "**Focused regression exit:** ``$focusedTestExit``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          foreach ($failure in @($report.failures)) {
            "- **$($failure.stage):** $($failure.message)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

          if ($checkerExit -ne 0 -or $failedStages.Count -gt 0 -or $focusedTestExit -ne 0) {
            throw "Hermes Agent Desktop validation failed: $($failedStages -join ', '); checker exit $checkerExit; focused regression exit $focusedTestExit."
          }

      - name: Upload patch application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-hermes-agent-patch-smoke
          path: artifacts/compatibility/hermes-agent-patch-smoke
          if-no-files-found: error
          retention-days: 14
