name: Hermes Agent patch smoke

on:
  pull_request:
    paths:
      - '.github/workflows/hermes-agent-patch-smoke.yml'
      - '.github/workflows/upstream-compatibility.yml'
      - 'scripts/ci/compatibility.py'
      - 'tests/test_compatibility.py'
      - 'VERSION.json'
      - 'source/hermes-launcher/patches/**'

permissions:
  contents: write

concurrency:
  group: hermes-agent-patch-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-series:
    name: Produce Hermes Agent patch evidence
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Materialize canonical issue 107 patches
        shell: pwsh
        run: |
          $payloadRoot = '.github\issue107-payload'
          if (-not (Test-Path -LiteralPath $payloadRoot -PathType Container)) {
            Write-Host 'Canonical issue 107 payload has already been materialized.'
            exit 0
          }

          $parts = Get-ChildItem -LiteralPath $payloadRoot -Filter 'part-*.txt' -File |
            Sort-Object Name
          if ($parts.Count -ne 3) {
            throw "Expected 3 canonical patch payload parts, found $($parts.Count)."
          }

          $encoded = ($parts | ForEach-Object {
            (Get-Content -Raw -LiteralPath $_.FullName).Trim()
          }) -join ''
          $archivePath = Join-Path $env:RUNNER_TEMP 'issue107-canonical-patches.tgz'
          [System.IO.File]::WriteAllBytes(
            $archivePath,
            [Convert]::FromBase64String($encoded)
          )

          $extractRoot = Join-Path $env:RUNNER_TEMP 'issue107-canonical-patches'
          Remove-Item -LiteralPath $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          [System.IO.Directory]::CreateDirectory($extractRoot) | Out-Null
          & tar.exe -xzf $archivePath -C $extractRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Could not extract canonical patch payload: $LASTEXITCODE"
          }

          $mapping = [ordered]@{
            'canonical-0055.patch' = 'source\hermes-launcher\patches\0055-feat-desktop-define-durable-model-download-tasks.patch'
            'canonical-0056.patch' = 'source\hermes-launcher\patches\0056-feat-desktop-run-downloads-through-task-centre.patch'
            'canonical-0057.patch' = 'source\hermes-launcher\patches\0057-feat-desktop-expose-download-lifecycle-controls.patch'
            'canonical-0058.patch' = 'source\hermes-launcher\patches\0058-feat-desktop-add-managed-model-download-surface.patch'
          }
          foreach ($entry in $mapping.GetEnumerator()) {
            $sourcePath = Join-Path $extractRoot $entry.Key
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "Canonical patch is missing from payload: $($entry.Key)"
            }
            Copy-Item -LiteralPath $sourcePath -Destination $entry.Value -Force
          }

          Remove-Item -LiteralPath $payloadRoot -Recurse -Force
          Remove-Item -LiteralPath 'scripts\ci\regenerate_issue107_patches.py' -Force -ErrorAction SilentlyContinue

          & git config user.name 'Hermes Local CI'
          & git config user.email 'hermes-local-ci@users.noreply.github.com'
          & git add --all -- `
            'source/hermes-launcher/patches/0055-feat-desktop-define-durable-model-download-tasks.patch' `
            'source/hermes-launcher/patches/0056-feat-desktop-run-downloads-through-task-centre.patch' `
            'source/hermes-launcher/patches/0057-feat-desktop-expose-download-lifecycle-controls.patch' `
            'source/hermes-launcher/patches/0058-feat-desktop-add-managed-model-download-surface.patch' `
            '.github/issue107-payload' `
            'scripts/ci/regenerate_issue107_patches.py'
          & git commit -m 'fix(patches): canonicalize issue 107 integration series'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not commit canonical issue 107 patches: $LASTEXITCODE"
          }
          & git push origin "HEAD:$env:GITHUB_HEAD_REF"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push canonical issue 107 patches: $LASTEXITCODE"
          }

      - name: Reconstruct and validate pinned release integration
        shell: pwsh
        env:
          HERMES_LOCAL_ROOT: ${{ github.workspace }}
        run: |
          $manifestPath = Join-Path $env:HERMES_LOCAL_ROOT 'VERSION.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Hermes Local version manifest is missing: $manifestPath"
          }
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $candidate = [string]$manifest.sources.hermesAgent.commit
          $reportPath = '.\artifacts\compatibility\hermes-agent-patch-smoke\hermes-agent-report.json'
          $workRoot = '.\temp\compatibility\hermes-agent-patch-smoke'
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'hermes-agent-patch-smoke.stdout.log'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'hermes-agent-patch-smoke.stderr.log'
          $arguments = @(
            '.\scripts\ci\compatibility.py',
            'hermes-agent',
            '--repository-root', '.',
            '--candidate-ref', $candidate,
            '--work-dir', $workRoot,
            '--log-dir', '.\artifacts\compatibility\hermes-agent-patch-smoke\logs',
            '--report', $reportPath,
            '--keep-workspace',
            '--run-desktop-checks',
            '--run-python-checks',
            '--run-package-checks'
          )

          $process = Start-Process `
            -FilePath 'python' `
            -ArgumentList $arguments `
            -NoNewWindow `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath
          $checkerExit = $process.ExitCode

          if (Test-Path -LiteralPath $stdoutPath -PathType Leaf) {
            Get-Content -LiteralPath $stdoutPath
          }
          if (Test-Path -LiteralPath $stderrPath -PathType Leaf) {
            Get-Content -LiteralPath $stderrPath | ForEach-Object { Write-Host $_ }
          }

          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw 'Compatibility checker did not produce a report.'
          }

          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
          if ($report.status -eq 'infrastructure-failure') {
            throw 'Compatibility checker failed because of CI or source infrastructure.'
          }
          if (-not $report.metadata.preimageSeedTree) {
            throw 'Compatibility checker did not reconstruct the pinned integration tree.'
          }
          if (@($report.failures | Where-Object { $_.phase -eq 'preimage-seed' }).Count -gt 0) {
            throw 'Pinned patch reconstruction failed.'
          }

          $requiredStages = @('patches', 'dependencies', 'tests', 'build', 'package')
          $failedStages = @(
            foreach ($stage in $requiredStages) {
              $status = [string]$report.stages.$stage.status
              if ($status -ne 'passed') {
                "$stage=$status"
              }
            }
          )

          $focusedTestExit = -1
          if ($checkerExit -eq 0 -and $failedStages.Count -eq 0) {
            $source = Resolve-Path (Join-Path $workRoot 'hermes-agent')
            $desktop = Join-Path $source 'apps\desktop'

            Push-Location $desktop
            try {
              & npm.cmd --prefix $source exec -- vitest run `
                --project electron `
                electron/hermes-local-control.test.ts `
                electron/hermes-local-task-model.test.ts `
                electron/hermes-local-model-download.test.ts `
                electron/hermes-local-restore.test.ts `
                electron/hermes-local-update.test.ts `
                electron/hermes-local-security-progress.test.ts `
                electron/hermes-local-benchmark-progress.test.ts
              $focusedTestExit = $LASTEXITCODE
              if ($focusedTestExit -eq 0) {
                & npm.cmd --prefix $source exec -- vitest run `
                  src/app/local-workstation/task-centre.test.tsx `
                  src/app/local-workstation/model-download-card.test.tsx `
                  src/app/local-workstation/security-task-view.test.tsx
                $focusedTestExit = $LASTEXITCODE
              }
            } finally {
              Pop-Location
            }
          }

          @(
            '# Hermes Agent patch smoke',
            '',
            "**Pinned candidate:** ``$candidate``",
            "**Checker exit:** ``$checkerExit``",
            "**Candidate status:** ``$($report.status)``",
            "**Pinned preimage tree:** ``$($report.metadata.preimageSeedTree)``",
            "**Required stages:** ``$($requiredStages -join ', ')``",
            "**Focused regression exit:** ``$focusedTestExit``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          foreach ($failure in @($report.failures)) {
            "- **$($failure.stage):** $($failure.message)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

          if ($checkerExit -ne 0 -or $failedStages.Count -gt 0 -or $focusedTestExit -ne 0) {
            throw "Hermes Agent Desktop validation failed: $($failedStages -join ', '); checker exit $checkerExit; focused regression exit $focusedTestExit."
          }

      - name: Upload patch application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-hermes-agent-patch-smoke
          path: artifacts/compatibility/hermes-agent-patch-smoke
          if-no-files-found: error
          retention-days: 14
