name: Hermes Agent patch smoke

on:
  pull_request:
    paths:
      - '.github/workflows/hermes-agent-patch-smoke.yml'
      - '.github/workflows/upstream-compatibility.yml'
      - 'scripts/ci/compatibility.py'
      - 'tests/test_compatibility.py'
      - 'VERSION.json'
      - 'source/hermes-launcher/patches/**'

permissions:
  contents: read

concurrency:
  group: hermes-agent-patch-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-series:
    name: Produce Hermes Agent patch evidence
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Reconstruct and validate pinned release integration
        shell: pwsh
        env:
          HERMES_LOCAL_ROOT: ${{ github.workspace }}
        run: |
          $manifestPath = Join-Path $env:HERMES_LOCAL_ROOT 'VERSION.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Hermes Local version manifest is missing: $manifestPath"
          }
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $candidate = [string]$manifest.sources.hermesAgent.commit
          $reportPath = '.\artifacts\compatibility\hermes-agent-patch-smoke\hermes-agent-report.json'
          $workRoot = '.\temp\compatibility\hermes-agent-patch-smoke'
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'hermes-agent-patch-smoke.stdout.log'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'hermes-agent-patch-smoke.stderr.log'
          $arguments = @(
            '.\scripts\ci\compatibility.py',
            'hermes-agent',
            '--repository-root', '.',
            '--candidate-ref', $candidate,
            '--work-dir', $workRoot,
            '--log-dir', '.\artifacts\compatibility\hermes-agent-patch-smoke\logs',
            '--report', $reportPath,
            '--keep-workspace',
            '--run-desktop-checks',
            '--run-python-checks',
            '--run-package-checks'
          )

          $process = Start-Process `
            -FilePath 'python' `
            -ArgumentList $arguments `
            -NoNewWindow `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath
          $checkerExit = $process.ExitCode

          if (Test-Path -LiteralPath $stdoutPath -PathType Leaf) {
            Get-Content -LiteralPath $stdoutPath
          }
          if (Test-Path -LiteralPath $stderrPath -PathType Leaf) {
            Get-Content -LiteralPath $stderrPath | ForEach-Object { Write-Host $_ }
          }

          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw 'Compatibility checker did not produce a report.'
          }

          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
          if ($report.status -eq 'infrastructure-failure') {
            throw 'Compatibility checker failed because of CI or source infrastructure.'
          }
          if (-not $report.metadata.preimageSeedTree) {
            throw 'Compatibility checker did not reconstruct the pinned integration tree.'
          }
          if (@($report.failures | Where-Object { $_.phase -eq 'preimage-seed' }).Count -gt 0) {
            throw 'Pinned patch reconstruction failed.'
          }

          $requiredStages = @('patches', 'dependencies', 'tests', 'build', 'package')
          $failedStages = @(
            foreach ($stage in $requiredStages) {
              $status = [string]$report.stages.$stage.status
              if ($status -ne 'passed') {
                "$stage=$status"
              }
            }
          )

          $focusedTestExit = -1
          if ($checkerExit -eq 0 -and $failedStages.Count -eq 0) {
            $source = Resolve-Path (Join-Path $workRoot 'hermes-agent')
            $desktop = Join-Path $source 'apps\desktop'

            Push-Location $desktop
            try {
              & npm.cmd --prefix $source exec -- vitest run `
                --project electron `
                electron/hermes-local-control.test.ts `
                electron/hermes-local-task-model.test.ts `
                electron/hermes-local-restore.test.ts `
                electron/hermes-local-update.test.ts `
                electron/hermes-local-security-progress.test.ts `
                electron/hermes-local-benchmark-progress.test.ts
              $focusedTestExit = $LASTEXITCODE
              if ($focusedTestExit -eq 0) {
                & npm.cmd --prefix $source exec -- vitest run `
                  src/app/local-workstation/task-centre.test.tsx `
                  src/app/local-workstation/security-task-view.test.tsx
                $focusedTestExit = $LASTEXITCODE
              }
            } finally {
              Pop-Location
            }
          }

          @(
            '# Hermes Agent patch smoke',
            '',
            "**Pinned candidate:** ``$candidate``",
            "**Checker exit:** ``$checkerExit``",
            "**Candidate status:** ``$($report.status)``",
            "**Pinned preimage tree:** ``$($report.metadata.preimageSeedTree)``",
            "**Required stages:** ``$($requiredStages -join ', ')``",
            "**Focused regression exit:** ``$focusedTestExit``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          foreach ($failure in @($report.failures)) {
            "- **$($failure.stage):** $($failure.message)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

          if ($checkerExit -ne 0 -or $failedStages.Count -gt 0 -or $focusedTestExit -ne 0) {
            throw "Hermes Agent Desktop validation failed: $($failedStages -join ', '); checker exit $checkerExit; focused regression exit $focusedTestExit."
          }

      - name: Upload patch application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-hermes-agent-patch-smoke
          path: artifacts/compatibility/hermes-agent-patch-smoke
          if-no-files-found: error
          retention-days: 14
