name: Hermes Agent patch smoke

on:
  pull_request:
    paths:
      - '.github/workflows/hermes-agent-patch-smoke.yml'
      - '.github/workflows/upstream-compatibility.yml'
      - 'scripts/ci/compatibility.py'
      - 'tests/test_compatibility.py'
      - 'VERSION.json'
      - 'source/hermes-launcher/patches/**'

permissions:
  contents: read

concurrency:
  group: hermes-agent-patch-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-series:
    name: Produce Hermes Agent patch evidence
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check current upstream candidate
        shell: pwsh
        run: |
          $reportPath = '.\artifacts\compatibility\hermes-agent-patch-smoke\hermes-agent-report.json'
          python '.\scripts\ci\compatibility.py' hermes-agent `
            --repository-root '.' `
            --work-dir '.\temp\compatibility\hermes-agent-patch-smoke' `
            --log-dir '.\artifacts\compatibility\hermes-agent-patch-smoke\logs' `
            --report $reportPath
          $checkerExit = $LASTEXITCODE

          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw 'Compatibility checker did not produce a report.'
          }

          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
          if ($report.status -eq 'infrastructure-failure') {
            throw 'Compatibility checker failed because of CI or source infrastructure.'
          }
          if (-not $report.metadata.preimageSeedTree) {
            throw 'Compatibility checker did not reconstruct the pinned integration tree.'
          }
          if (@($report.failures | Where-Object { $_.phase -eq 'preimage-seed' }).Count -gt 0) {
            throw 'Pinned patch reconstruction failed.'
          }

          @(
            '# Hermes Agent patch smoke',
            '',
            "**Checker exit:** ``$checkerExit``",
            "**Candidate status:** ``$($report.status)``",
            "**Pinned preimage tree:** ``$($report.metadata.preimageSeedTree)``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          foreach ($failure in @($report.failures)) {
            "- **$($failure.stage):** $($failure.message)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload patch application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-hermes-agent-patch-smoke
          path: artifacts/compatibility/hermes-agent-patch-smoke
          if-no-files-found: error
          retention-days: 14
