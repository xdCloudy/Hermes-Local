name: Temporary Cloud Clippy repair

on:
  push:
    branches:
      - agent/cloud-connection
    paths:
      - ".github/workflows/tmp-fix-cloud-clippy.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloud-connection
      - name: Repair Cloud ticket fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/hermes-desktop/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = '''                Err(ServiceError::PermissionDenied(_)) if cloud_session.is_some() => client
                    .post(format!("{base_url}/api/auth/ws-ticket"))
                    .header(
                        COOKIE,
                        cloud_session
                            .as_ref()
                            .expect("checked Cloud session")
                            .header()?,
                    ),
                Err(error) => return Err(error),'''
          new = '''                Err(error @ ServiceError::PermissionDenied(_)) => {
                    match cloud_session.as_ref() {
                        Some(session) => client
                            .post(format!("{base_url}/api/auth/ws-ticket"))
                            .header(COOKIE, session.header()?),
                        None => return Err(error),
                    }
                }
                Err(error) => return Err(error),'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one Cloud fallback anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
      - name: Format
        run: cargo fmt --all
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/hermes-desktop/src/lib.rs
          git diff --cached --check
          git commit -m "fix(cn-06): satisfy Cloud ticket Clippy"
          git push origin HEAD:agent/cloud-connection
