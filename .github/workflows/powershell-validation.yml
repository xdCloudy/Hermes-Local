name: PowerShell validation

on:
  pull_request:
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - 'models/manifests/*.json'
      - 'scripts/gateway_snapshot.py'
      - 'tests/test_gateway_snapshot.py'
      - 'tests/test_hermes_desktop_update_contract.py'
      - 'source/hermes-launcher/overlay-src/**'
      - '.github/workflows/powershell-validation.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - 'models/manifests/*.json'
      - 'scripts/gateway_snapshot.py'
      - 'tests/test_gateway_snapshot.py'
      - 'tests/test_hermes_desktop_update_contract.py'
      - 'source/hermes-launcher/overlay-src/**'
      - '.github/workflows/powershell-validation.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $failures = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem -LiteralPath $PWD -Recurse -File |
            Where-Object Extension -In @('.ps1', '.psm1') |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$errors
              )
              foreach ($parseError in @($errors)) {
                $failures.Add("$($_.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)")
              }
            }
          if ($failures.Count -gt 0) {
            throw ($failures -join [Environment]::NewLine)
          }

      - name: Test gateway, restore, model download, benchmark, security, model and update contracts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest discover -s tests -p 'test_gateway_snapshot.py' -v
          python -m unittest discover -s tests -p 'test_hermes_desktop_update_contract.py' -v
          python -m py_compile `
            '.\scripts\gateway_snapshot.py' `
            '.\tests\test_gateway_snapshot.py' `
            '.\tests\test_hermes_desktop_update_contract.py'
          & '.\tests\Test-HermesGatewayModule.ps1'
          & '.\tests\Test-HermesDesktopUpdate.ps1'
          try {
            & '.\tests\Test-HermesDesktopUpdateReliability.ps1'
          } catch {
            Write-Host $_.Exception.ToString()
            Write-Host $_.ScriptStackTrace
            throw
          }
          & '.\tests\Test-HermesDesktopUpdaterBreakGlass.ps1'
          pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File '.\tests\Test-HermesModuleImportScope.ps1'
          if ($LASTEXITCODE -ne 0) {
            throw "Module import-scope tests failed with exit code $LASTEXITCODE."
          }
          pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File '.\tests\Test-HermesLauncherOverlayImport.ps1'
          if ($LASTEXITCODE -ne 0) {
            throw "Launcher overlay import tests failed with exit code $LASTEXITCODE."
          }
          pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File '.\tests\Test-HermesRestoreTask.ps1'
          if ($LASTEXITCODE -ne 0) {
            throw "Durable restore contract tests failed with exit code $LASTEXITCODE."
          }
          pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File '.\tests\Test-HermesModelDownloadTask.ps1'
          if ($LASTEXITCODE -ne 0) {
            throw "Durable model download contract tests failed with exit code $LASTEXITCODE."
          }
          & '.\tests\Test-DeferredRuntimeActivation.ps1'
          & '.\tests\Test-BenchmarkLifecycleContract.ps1'
          & '.\tests\Test-BenchmarkProgressContract.ps1'
          & '.\tests\Test-HermesSecurityScanProgress.ps1'
          & '.\tests\Test-SecurityToolBootstrap.ps1'
          & '.\tests\Test-PythonRuntimeMigration.ps1'
          & '.\tests\Test-ModelArtifactContract.ps1'
          & '.\tests\Test-HermesUpdateOrchestrator.ps1'
          & '.\tests\Test-HermesUpdateFailurePaths.ps1' `
            -EvidencePath '.\artifacts\test-evidence\issue-44-update-failure-paths.json'

      - name: Upload updater failure-path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-44-update-failure-path-evidence
          path: artifacts/test-evidence/issue-44-update-failure-paths.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify source override merge
        shell: pwsh
        run: |
          Import-Module .\scripts\Common-Hermes.psm1 -Force
          $overridePath = Join-Path $PWD 'config\launcher\source-overrides.json'
          [System.IO.Directory]::CreateDirectory([System.IO.Path]::GetDirectoryName($overridePath)) | Out-Null
          @{
            schemaVersion = 1
            sources = @{
              hermesAgent = @{
                commit = ('1' * 40)
                integrationCommit = ('2' * 40)
                integrationTree = ('3' * 40)
              }
            }
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $overridePath -Encoding utf8

          $manifest = Get-HermesVersionManifest
          if ($manifest.sources.hermesAgent.commit -ne ('1' * 40)) {
            throw 'Hermes Agent base commit override was not applied.'
          }
          if ($manifest.sources.hermesAgent.integrationCommit -ne ('2' * 40)) {
            throw 'Hermes Agent base integration commit override was not applied.'
          }
          if ($manifest.sources.hermesAgent.integrationTree -ne ('3' * 40)) {
            throw 'Hermes Agent integration tree override was not applied.'
          }
