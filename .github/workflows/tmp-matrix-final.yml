name: Temporary final migration matrix reconciliation

on:
  push:
    branches:
      - agent/matrix-final

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile AG-09 and DI-02 final automated stages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/DIOXUS_MIGRATION_MATRIX.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '> **Implementation audit checkpoint:** `2a4a49b338dcd7d723c71f033b730f7e2d529d62` (2026-08-14)':
                  '> **Implementation audit checkpoint:** `d155d65f4da88744c9225543df4a37c40ed8c4ff` (2026-08-14)',
              '| A3 Ported | 4 | User-facing implementation exists; more evidence required. |':
                  '| A3 Ported | 2 | User-facing implementation exists; more evidence required. |',
              '| A4 Auto-verified | 101 | Automated slice is green; human/live acceptance still required. |':
                  '| A4 Auto-verified | 103 | Automated slice is green; human/live acceptance still required. |',
              '| AG-09 | Agents/subagents | Agent services | Agents overlay | A3 Ported | PR #215 reconstructs the unpublished Dioxus lifecycle slice: globally scoped `subagent.*` observation, background-safe ownership, bounded delegation launch, child transcript drilldown and typed cancellation. Exact-head release gates are still running, so A4 is not yet claimed. | Launch/observe/cancel subagents, switching/background states and error/reconnect behavior. | ⬜ |':
                  '| AG-09 | Agents/subagents | Agent services | Agents overlay | A4 Auto-verified | PR #215 exact composed head `20a65e9c` observes globally scoped `subagent.*` events, rejects unscoped/background misattribution, launches bounded delegation, drills into child-session history and interrupts child runtime sessions through the typed session boundary. Rust validation `31807745890`, packaging `31807745867`, install lifecycle `31807745799`, footprint `31807745808` and native-client boundary `31807745916` passed before merge as `aa6a7d09`. | Launch/observe/cancel subagents, switching/background states and error/reconnect behavior. | ⬜ |',
              '| DI-02 | Clipboard text/images and save dialogs | `ClipboardService` | chat/context actions | A3 Ported | PR #214 wires the existing bounded native clipboard text read/write service into a Desktop-owned Dioxus consumer. PNG image consumption and save-dialog parity remain incomplete, so this row stays A3 even if the text slice exact-head gates pass. | Copy/paste text/images, WSL edge cases, save dialogs, unsupported formats and size limits. | ⬜ |':
                  '| DI-02 | Clipboard text/images and save dialogs | `ClipboardService` | chat/context actions | A4 Auto-verified | PR #214 wires bounded native text read/write into the Desktop Dioxus surface; PR #217 exact head `d02c1cf7` completes PNG clipboard-image export through an explicit native save dialog while retaining absolute-path, PNG-signature, existing-parent and 64 MiB guards. Rust validation `31809416374`, packaging `31809416371`, install lifecycle `31809416422`, footprint `31809416378` and native-client boundary `31809416381` passed before merge as `d155d65f`. | Copy/paste text/images, WSL edge cases, save dialogs, unsupported formats and size limits. | ⬜ |',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected matrix fragment: {old[:120]!r}')
              text = text.replace(old, new, 1)

          anchor = '''PR #213 exact head `18a96ff6` adds the typed bounded built-in contribution\nregistry and composes shared navigation/home launchers plus Desktop command\npalette, tool panes and status slots from validated descriptors. Rust validation\n`31768394182`, Windows packaging `31768394254`, install lifecycle `31768394190`,\nfootprint `31768394180` and native-client boundary `31768394214` all passed; SSH\ninteroperability was the expected skip. It merged as `2a4a49b3`, so `PL-01` is\nA4. External runtime JavaScript plugins and broader Agent integration plumbing\nremain tracked separately by `PL-02` and `PL-03`.\n'''

          addition = '''\nPR #214 exact head `21f29beb` wires the existing bounded native clipboard text\nreader/writer into the Desktop Dioxus composition without exposing an OS\nclipboard handle to the shared WebView. Rust validation `31804535373`, Windows\npackaging `31804535366`, install lifecycle `31804535392`, footprint\n`31804535369` and native-client boundary `31804535372` passed before merge as\n`566d8e6b`. The row remained A3 at that point because clipboard-image and native\nsave-dialog parity were still outstanding.\n\nPR #215 exact composed head `20a65e9c` restores the Agents/subagents lifecycle on\ntop of the clipboard integration. The Desktop overlay observes globally scoped\n`subagent.*` events, refuses unscoped background attribution, launches bounded\ndelegations, exposes bounded child-session history and resolves child runtime\nsessions before interruption. Rust validation `31807745890`, Windows packaging\n`31807745867`, install lifecycle `31807745799`, footprint `31807745808` and\nnative-client boundary `31807745916` all passed; SSH interoperability was the\nexpected skip. It merged as `aa6a7d09`, so `AG-09` is A4.\n\nPR #217 exact head `d02c1cf7` completes DI-02 by routing the existing bounded PNG\nclipboard-image exporter through an explicit Desktop `AsyncFileDialog` save\nsurface. The WebView receives neither an OS clipboard handle nor a filesystem\ncapability, and the native service retains absolute `.png` destination, existing\nparent, PNG-signature and 64 MiB size guards. Rust validation `31809416374`,\nWindows packaging `31809416371`, install lifecycle `31809416422`, footprint\n`31809416378` and native-client boundary `31809416381` all passed; SSH\ninteroperability was the expected skip. It merged as `d155d65f`, so `DI-02` is\nA4. Live WSL/format/clipboard-behavior comparison remains A5 evidence.\n'''

          if anchor not in text:
              raise SystemExit('PR #213 narrative anchor not found')
          text = text.replace(anchor, anchor + addition, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DIOXUS_MIGRATION_MATRIX.md
          git commit -m "docs: promote AG-09 and DI-02 to A4"
          git push origin HEAD:agent/matrix-final
