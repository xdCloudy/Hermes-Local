name: Issue 52 integration tree hash

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/issue52-tree-hash.yml'
      - 'source/hermes-launcher/patches/**'

permissions:
  contents: read

jobs:
  tree-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct patched Hermes tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          git -C /tmp/hermes-agent checkout --quiet 91937a6dc3ffbbe2f3be91a500f0ecf962c4cf53
          git -C /tmp/hermes-agent config user.name 'Hermes Local CI'
          git -C /tmp/hermes-agent config user.email 'ci@hermes.local'
          for patch in source/hermes-launcher/patches/*.patch; do
            git -C /tmp/hermes-agent am --3way "$GITHUB_WORKSPACE/$patch"
          done
          echo "ISSUE52_INTEGRATION_TREE=$(git -C /tmp/hermes-agent rev-parse 'HEAD^{tree}')"
          git -C /tmp/hermes-agent show --check --oneline --stat HEAD
