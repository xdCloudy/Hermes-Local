name: Refresh Rust lockfile

on:
  push:
    branches:
      - refactor/dioxus-rust-client
    paths:
      - ".github/workflows/refresh-rust-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dioxus-rust-client

      - name: Generate pinned lockfile
        run: cargo generate-lockfile

      - name: Commit lockfile when changed
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- Cargo.lock)) {
            Write-Host "Cargo.lock is already current."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Rust lockfile"
          git push origin HEAD:refactor/dioxus-rust-client
