name: Gateway compatibility validation

on:
  push:
    branches:
      - agent/manage-messaging-gateway

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out Hermes Local
        uses: actions/checkout@v4
        with:
          ref: agent/manage-messaging-gateway

      - name: Check out pinned Hermes Agent
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/NousResearch/hermes-agent.git "$env:RUNNER_TEMP\hermes-agent"
          git -C "$env:RUNNER_TEMP\hermes-agent" checkout --detach a0222295666558c72cc2b03d69f932801dcf96e6

      - name: Validate pinned gateway contracts
        shell: pwsh
        run: |
          @'
          import ast
          from pathlib import Path

          root = Path(r"${{ runner.temp }}") / "hermes-agent"

          def functions(path: str) -> set[str]:
              tree = ast.parse((root / path).read_text(encoding="utf-8"))
              return {
                  node.name
                  for node in ast.walk(tree)
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              }

          required = {
              "gateway/status.py": {
                  "get_running_pid",
                  "read_runtime_status",
                  "runtime_status_is_stale",
                  "runtime_status_pid_is_live",
              },
              "gateway/config.py": {"load_gateway_config"},
              "hermes_cli/env_loader.py": {"load_hermes_dotenv"},
              "hermes_cli/gateway.py": {"find_gateway_pids"},
          }
          for path, names in required.items():
              missing = names - functions(path)
              if missing:
                  raise SystemExit(f"{path}: missing {sorted(missing)}")

          parser_source = (root / "hermes_cli/subcommands/gateway.py").read_text(encoding="utf-8")
          for flag in ("--external-supervisor", "--force"):
              if flag not in parser_source:
                  raise SystemExit(f"gateway run parser is missing {flag}")
          print("Pinned Hermes Agent gateway contracts are compatible.")
          '@ | python -

      - name: Run focused tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_gateway_snapshot.py' -v
          python -m py_compile '.\scripts\gateway_snapshot.py' '.\tests\test_gateway_snapshot.py'
          & '.\tests\Test-HermesGatewayModule.ps1'

      - name: Parse changed PowerShell
        shell: pwsh
        run: |
          $files = @(
            '.\Start-Hermes-Local.ps1',
            '.\Test-Hermes-Local.ps1',
            '.\scripts\Hermes-Gateway.psm1',
            '.\scripts\supervisor\Hermes-Supervisor.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw (($errors | ForEach-Object ToString) -join [Environment]::NewLine)
            }
          }

      - name: Record successful validation
        shell: pwsh
        run: |
          $marker = '.gateway-compatibility-success'
          if (Test-Path -LiteralPath $marker) {
            Write-Host 'Compatibility marker already exists.'
            exit 0
          }
          @(
            'Pinned Hermes Agent: a0222295666558c72cc2b03d69f932801dcf96e6'
            "Validated commit: $env:GITHUB_SHA"
            "Run: $env:GITHUB_RUN_ID"
          ) | Set-Content -LiteralPath $marker -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $marker
          git commit -m 'test: record gateway compatibility validation'
          git push origin HEAD:agent/manage-messaging-gateway
