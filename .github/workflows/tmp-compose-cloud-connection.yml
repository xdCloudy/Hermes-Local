name: Temporary compose Cloud connection tranche

on:
  push:
    branches:
      - agent/cloud-connection
    paths:
      - ".github/workflows/tmp-compose-cloud-connection.yml"

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloud-connection
      - name: Compose typed Cloud connection slice
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: anchor count {count} for {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          # hermes-core: write-only Cloud gateway session adoption.
          replace_once(
              "crates/hermes-core/src/lib.rs",
              "#[derive(Clone, Debug, Error, Eq, PartialEq)]\npub enum ServiceError {",
              '''#[derive(Clone, Debug, Eq, PartialEq)]
          pub struct CloudGatewayCookie {
              pub name: String,
              pub value: String,
          }

          #[derive(Clone, Debug, Error, Eq, PartialEq)]
          pub enum ServiceError {'''.replace("          ", ""),
          )
          replace_once(
              "crates/hermes-core/src/lib.rs",
              '''    fn oauth_logout(&self, remote_url: &str) -> ServiceFuture<'_, ConnectionOauthLogoutResult>;
              fn list_ssh_hosts(&self) -> ServiceFuture<'_, Vec<String>> {'''.replace("              ", ""),
              '''    fn oauth_logout(&self, remote_url: &str) -> ServiceFuture<'_, ConnectionOauthLogoutResult>;
              fn adopt_cloud_gateway_session(
                  &self,
                  _base_url: String,
                  _cookies: Vec<CloudGatewayCookie>,
              ) -> ServiceFuture<'_, ()> {
                  Box::pin(async move {
                      Err(ServiceError::Unavailable(
                          "Hermes Cloud gateway-session adoption is unavailable on this host".into(),
                      ))
                  })
              }
              fn clear_cloud_gateway_session(&self, _base_url: String) -> ServiceFuture<'_, ()> {
                  Box::pin(async move { Ok(()) })
              }
              fn list_ssh_hosts(&self) -> ServiceFuture<'_, Vec<String>> {'''.replace("              ", ""),
          )

          # hermes-desktop: store Cloud gateway cookies in keyring and mint tickets from them.
          replace_once(
              "crates/hermes-desktop/src/lib.rs",
              "    AgentConfigService, AppServices, ConnectionService, CronService, EventStream, FileService,\n",
              "    AgentConfigService, AppServices, CloudGatewayCookie, ConnectionService, CronService, EventStream, FileService,\n",
          )
          replace_once(
              "crates/hermes-desktop/src/lib.rs",
              "use reqwest::Method;\n",
              "use reqwest::{Method, header::{COOKIE, SET_COOKIE}};\n",
          )
          replace_once(
              "crates/hermes-desktop/src/lib.rs",
              '''#[derive(Clone, Debug, Default, Deserialize, Serialize)]
          #[serde(rename_all = "camelCase")]
          struct StoredConnectionBlock {'''.replace("          ", ""),
              '''const MAX_CLOUD_COOKIE_VALUE_BYTES: usize = 8 * 1024;

          #[derive(Clone, Debug, Default, Deserialize, Serialize)]
          struct StoredCloudGatewaySession {
              cookies: BTreeMap<String, String>,
          }

          fn cloud_cookie_class(name: &str) -> Option<&'static str> {
              match name {
                  "__Host-hermes_session_at" | "__Secure-hermes_session_at" | "hermes_session_at" => Some("access"),
                  "__Host-hermes_session_rt" | "__Secure-hermes_session_rt" | "hermes_session_rt" => Some("refresh"),
                  _ => None,
              }
          }

          fn validate_cloud_cookie_value(value: &str) -> ServiceResult<()> {
              if value.is_empty()
                  || value.len() > MAX_CLOUD_COOKIE_VALUE_BYTES
                  || value.contains(';')
                  || value.chars().any(char::is_control)
              {
                  return Err(ServiceError::InvalidInput(
                      "invalid Hermes Cloud gateway cookie".into(),
                  ));
              }
              Ok(())
          }

          impl StoredCloudGatewaySession {
              fn from_cookies(cookies: &[CloudGatewayCookie]) -> ServiceResult<Self> {
                  if cookies.is_empty() || cookies.len() > 8 {
                      return Err(ServiceError::InvalidInput(
                          "Hermes Cloud gateway session must contain a bounded cookie set".into(),
                      ));
                  }
                  let mut session = Self::default();
                  for cookie in cookies {
                      session.set_cookie(&cookie.name, &cookie.value, false)?;
                  }
                  if session.cookies.is_empty() {
                      return Err(ServiceError::InvalidInput(
                          "Hermes Cloud gateway session did not contain an allowed session cookie".into(),
                      ));
                  }
                  Ok(session)
              }

              fn set_cookie(&mut self, name: &str, value: &str, allow_delete: bool) -> ServiceResult<bool> {
                  let Some(class) = cloud_cookie_class(name) else {
                      return Err(ServiceError::InvalidInput(
                          "unrecognized Hermes Cloud gateway cookie".into(),
                      ));
                  };
                  if value.is_empty() && allow_delete {
                      let before = self.cookies.len();
                      self.cookies.retain(|existing, _| cloud_cookie_class(existing) != Some(class));
                      return Ok(self.cookies.len() != before);
                  }
                  validate_cloud_cookie_value(value)?;
                  let previous = self.cookies.clone();
                  self.cookies.retain(|existing, _| cloud_cookie_class(existing) != Some(class));
                  self.cookies.insert(name.to_owned(), value.to_owned());
                  Ok(self.cookies != previous)
              }

              fn merge_set_cookie(&mut self, header: &str) -> ServiceResult<bool> {
                  let pair = header.split(';').next().unwrap_or_default().trim();
                  let Some((name, value)) = pair.split_once('=') else {
                      return Ok(false);
                  };
                  if cloud_cookie_class(name.trim()).is_none() {
                      return Ok(false);
                  }
                  self.set_cookie(name.trim(), value.trim(), true)
              }

              fn header(&self) -> ServiceResult<String> {
                  if self.cookies.is_empty() {
                      return Err(ServiceError::PermissionDenied(
                          "Hermes Cloud gateway session is unavailable".into(),
                      ));
                  }
                  Ok(self
                      .cookies
                      .iter()
                      .map(|(name, value)| format!("{name}={value}"))
                      .collect::<Vec<_>>()
                      .join("; "))
              }
          }

          #[derive(Clone, Debug, Default, Deserialize, Serialize)]
          #[serde(rename_all = "camelCase")]
          struct StoredConnectionBlock {'''.replace("          ", ""),
          )
          replace_once(
              "crates/hermes-desktop/src/lib.rs",
              '''fn oauth_account(base_url: &str) -> String {
              let digest = Sha256::digest(base_url.as_bytes());
              format!("oauth:{}", URL_SAFE_NO_PAD.encode(digest))
          }
          '''.replace("          ", ""),
              '''fn oauth_account(base_url: &str) -> String {
              let digest = Sha256::digest(base_url.as_bytes());
              format!("oauth:{}", URL_SAFE_NO_PAD.encode(digest))
          }

          fn cloud_cookie_account(base_url: &str) -> String {
              let digest = Sha256::digest(base_url.as_bytes());
              format!("oauth-cookie:{}", URL_SAFE_NO_PAD.encode(digest))
          }
          '''.replace("          ", ""),
          )
          replace_once(
              "crates/hermes-desktop/src/lib.rs",
              '''        let remote_oauth_connected = block.auth_mode == RemoteAuthMode::Oauth
                      && !remote_url.is_empty()
                      && self.oauth_tokens(&remote_url)?.is_some();'''.replace("          ", ""),
              '''        let remote_oauth_connected = block.auth_mode == RemoteAuthMode::Oauth
                      && !remote_url.is_empty()
                      && (self.oauth_tokens(&remote_url)?.is_some()
                          || self.cloud_session(&remote_url)?.is_some());'''.replace("          ", ""),
          )
          replace_once(
              "crates/hermes-desktop/src/lib.rs",
              '''    fn clear_oauth_tokens(&self, base_url: &str) -> ServiceResult<()> {
                  self.secrets.delete(&oauth_account(base_url))
              }
          }'''.replace("          ", ""),
              '''    fn clear_oauth_tokens(&self, base_url: &str) -> ServiceResult<()> {
                  self.secrets.delete(&oauth_account(base_url))
              }

              fn cloud_session(&self, base_url: &str) -> ServiceResult<Option<StoredCloudGatewaySession>> {
                  let Some(encoded) = self.secrets.get(&cloud_cookie_account(base_url))? else {
                      return Ok(None);
                  };
                  let session = serde_json::from_str(&encoded).map_err(|error| {
                      ServiceError::Platform(format!("invalid stored Hermes Cloud session: {error}"))
                  })?;
                  Ok(Some(session))
              }

              fn store_cloud_session(
                  &self,
                  base_url: &str,
                  session: &StoredCloudGatewaySession,
              ) -> ServiceResult<()> {
                  if session.cookies.is_empty() {
                      return Err(ServiceError::InvalidInput(
                          "cannot store an empty Hermes Cloud gateway session".into(),
                      ));
                  }
                  let encoded = serde_json::to_string(session)
                      .map_err(|error| ServiceError::Platform(error.to_string()))?;
                  self.secrets.set(&cloud_cookie_account(base_url), &encoded)
              }

              fn clear_cloud_session(&self, base_url: &str) -> ServiceResult<()> {
                  self.secrets.delete(&cloud_cookie_account(base_url))
              }
          }'''.replace("          ", ""),
          )

          desktop = Path("crates/hermes-desktop/src/lib.rs")
          text = desktop.read_text(encoding="utf-8")
          start = text.index("    async fn mint_gateway_ticket(&self, base_url: &str) -> ServiceResult<String> {")
          end = text.index("\n}\n\npub struct NativeApp", start)
          replacement = '''    async fn mint_gateway_ticket(&self, base_url: &str) -> ServiceResult<String> {
              let base_url = normalize_remote_url(base_url)?;
              let mut cloud_session = self.connection_store.cloud_session(&base_url)?;
              let client = reqwest::Client::builder()
                  .timeout(std::time::Duration::from_secs(8))
                  .redirect(reqwest::redirect::Policy::none())
                  .build()
                  .map_err(platform)?;

              let request = if self.connection_store.oauth_tokens(&base_url)?.is_some() {
                  match self.ensure_native_access_token(&base_url).await {
                      Ok(access_token) => client
                          .post(format!("{base_url}/api/auth/ws-ticket"))
                          .bearer_auth(access_token),
                      Err(ServiceError::PermissionDenied(_)) if cloud_session.is_some() => client
                          .post(format!("{base_url}/api/auth/ws-ticket"))
                          .header(COOKIE, cloud_session.as_ref().expect("checked Cloud session").header()?),
                      Err(error) => return Err(error),
                  }
              } else if let Some(session) = cloud_session.as_ref() {
                  client
                      .post(format!("{base_url}/api/auth/ws-ticket"))
                      .header(COOKIE, session.header()?)
              } else {
                  return Err(ServiceError::PermissionDenied(
                      "Gateway sign-in is required".into(),
                  ));
              };

              let response = request
                  .send()
                  .await
                  .map_err(|error| ServiceError::Transport(error.to_string()))?;
              if matches!(response.status().as_u16(), 401 | 403) {
                  if cloud_session.is_some() {
                      self.connection_store.clear_cloud_session(&base_url)?;
                  }
                  return Err(ServiceError::PermissionDenied(
                      "Gateway rejected the OAuth session; sign in again".into(),
                  ));
              }
              if !response.status().is_success() {
                  return Err(ServiceError::Transport(format!(
                      "Gateway ticket mint returned HTTP {}",
                      response.status()
                  )));
              }

              if let Some(session) = cloud_session.as_mut() {
                  let mut changed = false;
                  for header in response.headers().get_all(SET_COOKIE) {
                      if let Ok(header) = header.to_str() {
                          changed |= session.merge_set_cookie(header)?;
                      }
                  }
                  if changed && !session.cookies.is_empty() {
                      self.connection_store.store_cloud_session(&base_url, session)?;
                  } else if session.cookies.is_empty() {
                      self.connection_store.clear_cloud_session(&base_url)?;
                  }
              }

              let value: Value = response.json().await.map_err(|error| {
                  ServiceError::Transport(format!("invalid Gateway ticket response: {error}"))
              })?;
              value
                  .get("ticket")
                  .and_then(Value::as_str)
                  .filter(|ticket| !ticket.is_empty())
                  .map(str::to_owned)
                  .ok_or_else(|| {
                      ServiceError::Transport("Gateway did not return a WebSocket ticket".into())
                  })
          }'''.replace("          ", "")
          desktop.write_text(text[:start] + replacement + text[end:], encoding="utf-8", newline="\n")

          replace_once(
              "crates/hermes-desktop/src/lib.rs",
              '''                ConnectionMode::Remote if config.remote_auth_mode == RemoteAuthMode::Token => {''',
              '''                ConnectionMode::Remote | ConnectionMode::Cloud
                      if config.remote_auth_mode == RemoteAuthMode::Token => {'''.replace("          ", ""),
          )
          replace_once(
              "crates/hermes-desktop/src/lib.rs",
              '''                ConnectionMode::Remote => {
                      let ticket = self.mint_gateway_ticket(&config.remote_url).await?;
                      self.connect(&websocket_url_with_ticket(&config.remote_url, &ticket)?)
                          .await?;
                  }
                  ConnectionMode::Cloud => {
                      return Err(ServiceError::Unavailable(
                          "Hermes Cloud agent discovery is pending".into(),
                      ));
                  }'''.replace("          ", ""),
              '''                ConnectionMode::Remote | ConnectionMode::Cloud => {
                      let ticket = self.mint_gateway_ticket(&config.remote_url).await?;
                      self.connect(&websocket_url_with_ticket(&config.remote_url, &ticket)?)
                          .await?;
                  }'''.replace("          ", ""),
          )
          replace_once(
              "crates/hermes-desktop/src/lib.rs",
              '''            let base_url = normalize_remote_url(&remote_url)?;
                  self.connection_store.clear_oauth_tokens(&base_url)?;
                  Ok(ConnectionOauthLogoutResult {'''.replace("          ", ""),
              '''            let base_url = normalize_remote_url(&remote_url)?;
                  self.connection_store.clear_oauth_tokens(&base_url)?;
                  self.connection_store.clear_cloud_session(&base_url)?;
                  Ok(ConnectionOauthLogoutResult {'''.replace("          ", ""),
          )
          replace_once(
              "crates/hermes-desktop/src/lib.rs",
              '''    fn oauth_logout(&self, remote_url: &str) -> ServiceFuture<'_, ConnectionOauthLogoutResult> {
                  let remote_url = remote_url.to_owned();
                  Box::pin(async move {
                      let base_url = normalize_remote_url(&remote_url)?;
                      self.connection_store.clear_oauth_tokens(&base_url)?;
                      self.connection_store.clear_cloud_session(&base_url)?;
                      Ok(ConnectionOauthLogoutResult {
                          ok: true,
                          connected: false,
                      })
                  })
              }
          }'''.replace("          ", ""),
              '''    fn oauth_logout(&self, remote_url: &str) -> ServiceFuture<'_, ConnectionOauthLogoutResult> {
                  let remote_url = remote_url.to_owned();
                  Box::pin(async move {
                      let base_url = normalize_remote_url(&remote_url)?;
                      self.connection_store.clear_oauth_tokens(&base_url)?;
                      self.connection_store.clear_cloud_session(&base_url)?;
                      Ok(ConnectionOauthLogoutResult {
                          ok: true,
                          connected: false,
                      })
                  })
              }

              fn adopt_cloud_gateway_session(
                  &self,
                  base_url: String,
                  cookies: Vec<CloudGatewayCookie>,
              ) -> ServiceFuture<'_, ()> {
                  Box::pin(async move {
                      let base_url = normalize_remote_url(&base_url)?;
                      let session = StoredCloudGatewaySession::from_cookies(&cookies)?;
                      self.connection_store.store_cloud_session(&base_url, &session)
                  })
              }

              fn clear_cloud_gateway_session(&self, base_url: String) -> ServiceFuture<'_, ()> {
                  Box::pin(async move {
                      let base_url = normalize_remote_url(&base_url)?;
                      self.connection_store.clear_cloud_session(&base_url)
                  })
              }
          }'''.replace("          ", ""),
          )

          # Wrapper services must delegate the write-only Cloud-session authority.
          for wrapper in ["apps/desktop/src/local_gateway.rs", "apps/desktop/src/ssh_service.rs"]:
              replace_once(
                  wrapper,
                  "AppServices, ConnectionService, ServiceError, ServiceFuture, ServiceResult",
                  "AppServices, CloudGatewayCookie, ConnectionService, ServiceError, ServiceFuture, ServiceResult",
              )
              replace_once(
                  wrapper,
                  '''    fn oauth_logout(&self, remote_url: &str) -> ServiceFuture<'_, ConnectionOauthLogoutResult> {
                      self.inner.oauth_logout(remote_url)
                  }
          '''.replace("          ", ""),
                  '''    fn oauth_logout(&self, remote_url: &str) -> ServiceFuture<'_, ConnectionOauthLogoutResult> {
                      self.inner.oauth_logout(remote_url)
                  }

                  fn adopt_cloud_gateway_session(
                      &self,
                      base_url: String,
                      cookies: Vec<CloudGatewayCookie>,
                  ) -> ServiceFuture<'_, ()> {
                      self.inner.adopt_cloud_gateway_session(base_url, cookies)
                  }

                  fn clear_cloud_gateway_session(&self, base_url: String) -> ServiceFuture<'_, ()> {
                      self.inner.clear_cloud_gateway_session(base_url)
                  }
          '''.replace("          ", ""),
              )

          # hermes-ui: export the presentation contract and replace the Cloud placeholder.
          replace_once(
              "crates/hermes-ui/src/lib.rs",
              "mod about;\n",
              "mod about;\nmod cloud;\npub use cloud::{CloudActions, CloudAgent, CloudConnectRequest, CloudOrg, CloudState};\n",
          )
          replace_once(
              "crates/hermes-ui/src/lib.rs",
              '''fn GatewaySettingsPanel() -> Element {
              let services = use_context::<AppServices>();
              let settings = use_context::<SettingsUiState>();'''.replace("          ", ""),
              '''fn GatewaySettingsPanel() -> Element {
              let services = use_context::<AppServices>();
              let settings = use_context::<SettingsUiState>();
              let cloud = use_context::<CloudActions>();'''.replace("          ", ""),
          )
          replace_once(
              "crates/hermes-ui/src/lib.rs",
              '''    let current_profile = (settings.settings)()''',
              '''    let cloud_state = (cloud.state)();
              let current_profile = (settings.settings)()'''.replace("          ", ""),
          )
          replace_once(
              "crates/hermes-ui/src/lib.rs",
              '''                if config.mode == ConnectionMode::Cloud && !config.env_override {
                      section { class: "gateway-fields",
                          SettingsRow { title: "Hermes Cloud", description: "Sign in to Hermes Cloud to discover the agents on your account.",
                              button { class: "button primary", disabled: true, Codicon { name: "sign-in" } "Sign in to Hermes Cloud" }
                          }
                          p { class: "gateway-pending", "Hermes Cloud sign-in and agent discovery are the next connection-service slice." }
                      }
                  }'''.replace("          ", ""),
              '''                if config.mode == ConnectionMode::Cloud && !config.env_override {
                      section { class: "gateway-fields",
                          SettingsRow { title: "Hermes Cloud", description: "Portal authentication is separate from the selected Agent gateway session.",
                              if !cloud_state.signed_in {
                                  button {
                                      class: "button primary",
                                      disabled: cloud_state.loading,
                                      onclick: move |_| cloud.login.call(()),
                                      Codicon { name: "sign-in" }
                                      if cloud_state.loading { "Opening…" } else { "Sign in to Hermes Cloud" }
                                  }
                              } else {
                                  div { class: "settings-row-action", style: "display:flex;gap:.5rem;flex-wrap:wrap;",
                                      button {
                                          class: "button primary",
                                          disabled: cloud_state.loading,
                                          onclick: move |_| cloud.discover.call(cloud_state.selected_org.clone()),
                                          Codicon { name: "refresh" }
                                          "Discover agents"
                                      }
                                      button {
                                          class: "button",
                                          disabled: cloud_state.loading,
                                          onclick: move |_| cloud.logout.call(()),
                                          "Sign out portal"
                                      }
                                  }
                              }
                          }
                          p { class: "muted", "Portal: {cloud_state.portal_base_url}" }
                          if config.remote_url.len() > 0 {
                              p { class: "muted", "Configured Agent: {config.remote_url}" }
                          }
                          if cloud_state.orgs.len() > 1 {
                              label { class: "field-stack",
                                  span { "Organization" }
                                  select {
                                      class: "settings-input gateway-control",
                                      value: cloud_state.selected_org.clone().unwrap_or_default(),
                                      disabled: cloud_state.loading,
                                      onchange: move |event| cloud.discover.call(Some(event.value())),
                                      option { value: "", disabled: true, "Choose an organization" }
                                      for org in cloud_state.orgs.clone() {
                                          option { value: "{org.selection_key()}", "{org.name}" }
                                      }
                                  }
                              }
                          }
                          if !cloud_state.agents.is_empty() {
                              div { style: "display:grid;gap:.5rem;",
                                  for agent in cloud_state.agents.clone() {
                                      {
                                          let can_connect = agent.dashboard_url.is_some();
                                          let request = CloudConnectRequest {
                                              profile: scope(),
                                              org: cloud_state.selected_org.clone(),
                                              agent: agent.clone(),
                                          };
                                          rsx! {
                                              div { class: "settings-row", style: "align-items:flex-start;gap:.75rem;",
                                                  div { style: "min-width:0;flex:1;",
                                                      strong { "{agent.name}" }
                                                      div { class: "muted", "{agent.status} · gateway {agent.dashboard_gateway_state}" }
                                                      if let Some(url) = agent.dashboard_url.as_deref() {
                                                          div { class: "muted", title: "{url}", "{url}" }
                                                      } else {
                                                          div { class: "inline-error", "No safe dashboard URL was published for this agent." }
                                                      }
                                                  }
                                                  button {
                                                      class: "button primary",
                                                      disabled: cloud_state.loading || !can_connect,
                                                      onclick: move |_| cloud.connect.call(request.clone()),
                                                      "Connect"
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                          if let Some(message) = cloud_state.message.as_deref() {
                              p { class: "gateway-success", "{message}" }
                          }
                          if let Some(problem) = cloud_state.error.as_deref() {
                              p { class: "inline-error", role: "alert", "{problem}" }
                          }
                      }
                  }'''.replace("          ", ""),
          )

          # Desktop composition owns Cloud browser windows/cookies.
          replace_once(
              "apps/desktop/src/main.rs",
              "mod clipboard_service;\n",
              "mod clipboard_service;\nmod cloud_bridge;\n",
          )
          replace_once(
              "apps/desktop/src/main.rs",
              '''            deep_link_bridge::DeepLinkBridge {
                      clipboard_bridge::ClipboardBridge {'''.replace("          ", ""),
              '''            deep_link_bridge::DeepLinkBridge {
                      cloud_bridge::CloudBridge {
                          clipboard_bridge::ClipboardBridge {'''.replace("          ", ""),
          )
          replace_once(
              "apps/desktop/src/main.rs",
              '''                    }
                  }
              }
          }'''.replace("          ", ""),
              '''                    }
                          }
                      }
                  }
              }
          }'''.replace("          ", ""),
          )

          # Focused Desktop secret/session contracts.
          replace_once(
              "crates/hermes-desktop/src/lib.rs",
              '''    #[tokio::test]
              async fn native_oauth_refreshes_then_mints_the_official_ws_ticket() {'''.replace("          ", ""),
              '''    #[test]
              fn cloud_gateway_cookie_secrets_are_bounded_and_kept_out_of_connection_json() {
                  let directory = std::env::temp_dir().join(format!(
                      "hermes-cloud-cookie-test-{}",
                      Uuid::new_v4().simple()
                  ));
                  let path = directory.join("connection.json");
                  let secrets = Arc::new(MemoryGatewaySecrets::default());
                  let store = ConnectionConfigStore::with_secrets(path.clone(), secrets.clone());
                  let base_url = "https://agent.example/hermes";
                  store
                      .save(&ConnectionConfigInput {
                          mode: ConnectionMode::Cloud,
                          remote_auth_mode: Some(RemoteAuthMode::Oauth),
                          remote_url: Some(base_url.into()),
                          cloud_org: Some("team".into()),
                          ..ConnectionConfigInput::default()
                      })
                      .expect("save Cloud Gateway");
                  let session = StoredCloudGatewaySession::from_cookies(&[
                      CloudGatewayCookie { name: "__Host-hermes_session_rt".into(), value: "refresh-secret".into() },
                      CloudGatewayCookie { name: "__Host-hermes_session_at".into(), value: "access-secret".into() },
                  ])
                  .expect("Cloud session");
                  store.store_cloud_session(base_url, &session).expect("store Cloud session");

                  let loaded = store.load(None).expect("load Cloud config");
                  assert!(loaded.remote_oauth_connected);
                  assert_eq!(loaded.mode, ConnectionMode::Cloud);
                  assert_eq!(loaded.cloud_org, "team");
                  let on_disk = fs::read_to_string(&path).expect("connection settings");
