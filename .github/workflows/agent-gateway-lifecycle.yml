name: Implement gateway lifecycle

on:
  push:
    branches:
      - agent/manage-messaging-gateway

permissions:
  contents: write

jobs:
  implement:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/manage-messaging-gateway

      - name: Apply gateway lifecycle changes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8", newline="\n")

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count == 0 and new in content:
                  return
              if count != 1:
                  raise RuntimeError(f"{path}: expected one occurrence, found {count}")
              write(path, content.replace(old, new, 1))

          supervisor = "scripts/supervisor/Hermes-Supervisor.ps1"
          replace_once(
              supervisor,
              "Import-Module (Join-Path $root 'scripts\\Hermes-Configuration.psm1') -Force\n. (Join-Path $PSScriptRoot 'Hermes-Job.ps1')",
              "Import-Module (Join-Path $root 'scripts\\Hermes-Configuration.psm1') -Force\nImport-Module (Join-Path $root 'scripts\\Hermes-Gateway.psm1') -Force\n. (Join-Path $PSScriptRoot 'Hermes-Job.ps1')",
          )
          replace_once(
              supervisor,
              "$modelProcess = $null\n$hermesProcess = $null\n$job = $null",
              "$modelProcess = $null\n$hermesProcess = $null\n$gatewayProcess = $null\n$gatewayRequired = $false\n$gatewayPlatforms = @()\n$gatewayOwnership = 'disabled'\n$gatewayRuntimePid = $null\n$job = $null",
          )
          replace_once(
              supervisor,
              "        [string] $Message = '',\n        [bool] $ModelHealthy = $false,\n        [bool] $HermesHealthy = $false\n",
              "        [string] $Message = '',\n        [bool] $ModelHealthy = $false,\n        [bool] $HermesHealthy = $false,\n        [bool] $GatewayHealthy = $false,\n        [string] $GatewayState = 'disabled',\n        [string] $GatewayMessage = ''\n",
          )
          replace_once(
              supervisor,
              "        dashboard = [ordered]@{\n            pid = if ($hermesProcess -and -not $hermesProcess.HasExited) { $hermesProcess.Id } else { $null }\n            healthy = $HermesHealthy\n            url = $hermesBase\n            sharedWithHermesBackend = $true\n        }\n        startedAt = $startedAt.ToString('o')",
              "        dashboard = [ordered]@{\n            pid = if ($hermesProcess -and -not $hermesProcess.HasExited) { $hermesProcess.Id } else { $null }\n            healthy = $HermesHealthy\n            url = $hermesBase\n            sharedWithHermesBackend = $true\n        }\n        gateway = [ordered]@{\n            required = $gatewayRequired\n            enabledPlatforms = @($gatewayPlatforms)\n            launcherPid = if ($gatewayProcess -and -not $gatewayProcess.HasExited) { $gatewayProcess.Id } else { $null }\n            pid = $gatewayRuntimePid\n            healthy = if ($gatewayRequired) { $GatewayHealthy } else { $true }\n            state = if ($gatewayRequired) { $GatewayState } else { 'disabled' }\n            ownership = $gatewayOwnership\n            message = $GatewayMessage\n        }\n        startedAt = $startedAt.ToString('o')",
          )

          wait_function = r'''
          function Wait-HermesGatewayHealthy {
              param(
                  [AllowNull()]
                  [System.Diagnostics.Process] $Process,
                  [int] $TimeoutSeconds = 90
              )

              $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
              $lastSnapshot = $null
              while ((Get-Date) -lt $deadline) {
                  if ($Process -and $Process.HasExited) {
                      throw "Hermes messaging gateway exited with code $($Process.ExitCode) before becoming healthy."
                  }
                  $lastSnapshot = Get-HermesGatewaySnapshot
                  if ($lastSnapshot.pid) {
                      $script:gatewayRuntimePid = [int]$lastSnapshot.pid
                  }
                  if ($lastSnapshot.healthy) {
                      return $lastSnapshot
                  }
                  Start-Sleep -Milliseconds 500
              }
              $detail = if ($lastSnapshot) {
                  Get-HermesGatewayFailureDetail -Snapshot $lastSnapshot
              } else {
                  'No gateway status was produced.'
              }
              throw "Hermes messaging gateway did not become healthy within $TimeoutSeconds seconds: $detail"
          }

          '''
          replace_once(
              supervisor,
              "function Start-Stack {\n",
              wait_function + "function Start-Stack {\n",
          )

          replace_once(
              supervisor,
              "    Wait-Endpoint -Name 'Hermes backend/dashboard' -Uri \"$hermesBase/api/health\" -Process $hermesProcess -TimeoutSeconds 120\n    Write-SupervisorState -Phase 'running' -Message 'Hermes Local is ready.' -ModelHealthy $true -HermesHealthy $true\n    Write-HermesLog -Component supervisor -Message \"Stack ready. Model PID $($modelProcess.Id); Hermes PID $($hermesProcess.Id).\"",
              r'''    Wait-Endpoint -Name 'Hermes backend/dashboard' -Uri "$hermesBase/api/health" -Process $hermesProcess -TimeoutSeconds 120

              $gatewayConfig = Get-HermesGatewaySnapshot -Discover
              $script:gatewayRequired = [bool]$gatewayConfig.required
              $script:gatewayPlatforms = @($gatewayConfig.enabledPlatforms)
              $script:gatewayRuntimePid = if ($gatewayConfig.pid) { [int]$gatewayConfig.pid } else { $null }
              $script:gatewayProcess = $null

              if (-not $gatewayRequired) {
                  $script:gatewayOwnership = 'disabled'
                  Write-HermesLog -Component supervisor -Message 'No enabled messaging platforms were found; gateway lifecycle is intentionally disabled.'
                  Write-SupervisorState -Phase 'running' -Message 'Hermes Local is ready without a messaging gateway.' `
                      -ModelHealthy $true -HermesHealthy $true -GatewayState 'disabled'
              } else {
                  if ($gatewayConfig.duplicateLogicalRoots) {
                      throw (Get-HermesGatewayFailureDetail -Snapshot $gatewayConfig)
                  }
                  $platformList = $gatewayPlatforms -join ', '
                  if ($gatewayConfig.running) {
                      $script:gatewayOwnership = 'external'
                      Write-HermesLog -Component supervisor -Message (
                          "Existing gateway PID $($gatewayConfig.pid) serves configured platform(s): $platformList. Leaving it externally managed."
                      )
                      $gatewaySnapshot = Wait-HermesGatewayHealthy -TimeoutSeconds 30
                  } else {
                      $script:gatewayOwnership = 'managed'
                      Write-SupervisorState -Phase 'starting-gateway' `
                          -Message "Starting messaging gateway for: $platformList." `
                          -ModelHealthy $true -HermesHealthy $true -GatewayState 'starting'
                      Write-HermesLog -Component supervisor -Message "Starting managed messaging gateway for: $platformList."
                      $script:gatewayProcess = Start-ManagedProcess `
                          -FilePath $hermesExecutable `
                          -ArgumentList @('gateway', 'run', '--external-supervisor', '--force') `
                          -WorkingDirectory (Resolve-HermesPath 'source\hermes-agent') `
                          -Environment $hermesEnvironment
                      $gatewaySnapshot = Wait-HermesGatewayHealthy -Process $gatewayProcess -TimeoutSeconds 90
                  }
                  $script:gatewayRuntimePid = [int]$gatewaySnapshot.pid
                  Write-SupervisorState -Phase 'running' -Message 'Hermes Local is ready.' `
                      -ModelHealthy $true -HermesHealthy $true -GatewayHealthy $true `
                      -GatewayState ([string]$gatewaySnapshot.state)
              }
              $gatewayLog = if ($gatewayRequired) {
                  " Gateway PID $gatewayRuntimePid ($gatewayOwnership)."
              } else {
                  ' Messaging gateway disabled.'
              }
              Write-HermesLog -Component supervisor -Message (
                  "Stack ready. Model PID $($modelProcess.Id); Hermes PID $($hermesProcess.Id).$gatewayLog"
              )''',
          )

          replace_once(
              supervisor,
              "function Stop-Stack {\n    Write-SupervisorState -Phase 'stopping' -Message 'Stopping services in reverse order.'\n    Stop-ManagedProcess -Process $hermesProcess -Name 'Hermes backend/dashboard' -GraceSeconds 8\n    Stop-ManagedProcess -Process $modelProcess -Name 'llama-server' -GraceSeconds 20 -CloseInput\n    $script:hermesProcess = $null\n    $script:modelProcess = $null\n}",
              r'''function Stop-Stack {
              Write-SupervisorState -Phase 'stopping' -Message 'Stopping services in reverse order.' `
                  -GatewayState $(if ($gatewayRequired) { 'stopping' } else { 'disabled' })
              if ($gatewayOwnership -eq 'managed') {
                  Stop-ManagedProcess -Process $gatewayProcess -Name 'Hermes messaging gateway' -GraceSeconds 15
              } elseif ($gatewayOwnership -eq 'external' -and $gatewayRuntimePid) {
                  Write-HermesLog -Component supervisor -Message (
                      "Leaving externally managed gateway PID $gatewayRuntimePid running."
                  )
              }
              Stop-ManagedProcess -Process $hermesProcess -Name 'Hermes backend/dashboard' -GraceSeconds 8
              Stop-ManagedProcess -Process $modelProcess -Name 'llama-server' -GraceSeconds 20 -CloseInput
              $script:gatewayProcess = $null
              $script:gatewayRuntimePid = $null
              $script:gatewayOwnership = $(if ($gatewayRequired) { 'stopped' } else { 'disabled' })
              $script:hermesProcess = $null
              $script:modelProcess = $null
          }''',
          )

          replace_once(
              supervisor,
              "        $modelHealthy = $modelProcess -and -not $modelProcess.HasExited -and\n            (Test-Endpoint -Uri \"$modelBase/health\" -TimeoutSeconds 2)\n        $hermesHealthy = $hermesProcess -and -not $hermesProcess.HasExited -and\n            (Test-Endpoint -Uri \"$hermesBase/api/health\" -TimeoutSeconds 2)\n        if ($modelHealthy -and $hermesHealthy) {\n            $consecutiveHealthFailures = 0\n            Write-SupervisorState -Phase 'running' -Message 'Hermes Local is ready.' -ModelHealthy $true -HermesHealthy $true\n            continue\n        }\n\n        $consecutiveHealthFailures++\n        Write-SupervisorState -Phase 'degraded' -Message \"Health failure $consecutiveHealthFailures of 3.\" -ModelHealthy $modelHealthy -HermesHealthy $hermesHealthy\n        if ($consecutiveHealthFailures -lt 3) {\n            continue\n        }",
              r'''        $modelHealthy = $modelProcess -and -not $modelProcess.HasExited -and
                      (Test-Endpoint -Uri "$modelBase/health" -TimeoutSeconds 2)
                  $hermesHealthy = $hermesProcess -and -not $hermesProcess.HasExited -and
                      (Test-Endpoint -Uri "$hermesBase/api/health" -TimeoutSeconds 2)
                  $gatewaySnapshot = $null
                  $gatewayHealthy = -not $gatewayRequired
                  $gatewayState = if ($gatewayRequired) { 'unknown' } else { 'disabled' }
                  $gatewayMessage = ''
                  if ($gatewayRequired) {
                      try {
                          $gatewaySnapshot = Get-HermesGatewaySnapshot
                          if ($gatewaySnapshot.pid) {
                              $script:gatewayRuntimePid = [int]$gatewaySnapshot.pid
                          }
                          $gatewayHealthy = [bool]$gatewaySnapshot.healthy
                          $gatewayState = [string]$gatewaySnapshot.state
                          if (-not $gatewayHealthy) {
                              $gatewayMessage = Get-HermesGatewayFailureDetail -Snapshot $gatewaySnapshot
                          }
                      } catch {
                          $gatewayMessage = $_.Exception.Message
                      }
                  }
                  if ($modelHealthy -and $hermesHealthy -and $gatewayHealthy) {
                      $consecutiveHealthFailures = 0
                      Write-SupervisorState -Phase 'running' -Message 'Hermes Local is ready.' `
                          -ModelHealthy $true -HermesHealthy $true -GatewayHealthy $gatewayHealthy `
                          -GatewayState $gatewayState
                      continue
                  }

                  $consecutiveHealthFailures++
                  $healthMessage = "Health failure $consecutiveHealthFailures of 3."
                  if ($gatewayMessage) {
                      $healthMessage += " Gateway: $gatewayMessage"
                  }
                  Write-SupervisorState -Phase 'degraded' -Message $healthMessage `
                      -ModelHealthy $modelHealthy -HermesHealthy $hermesHealthy `
                      -GatewayHealthy $gatewayHealthy -GatewayState $gatewayState -GatewayMessage $gatewayMessage
                  if ($gatewayRequired -and $gatewayOwnership -eq 'external' -and $modelHealthy -and $hermesHealthy) {
                      $consecutiveHealthFailures = 0
                      continue
                  }
                  if ($consecutiveHealthFailures -lt 3) {
                      continue
                  }''',
          )
          replace_once(
              supervisor,
              "    Write-SupervisorState -Phase 'stopped' -Message 'Hermes Local stopped.'",
              "    Write-SupervisorState -Phase 'stopped' -Message 'Hermes Local stopped.' -GatewayState 'stopped'",
          )

          start = "Start-Hermes-Local.ps1"
          start_content = read(start)
          old_ready = "            $status.hermes.healthy) {"
          new_ready = "            $status.hermes.healthy -and\n            ($status.PSObject.Properties.Name -notcontains 'gateway' -or\n                -not $status.gateway.required -or $status.gateway.healthy)) {"
          if old_ready in start_content:
              start_content = start_content.replace(old_ready, new_ready, 1)
          if "if ($status.phase -eq 'running' -and $status.model.healthy -and $status.hermes.healthy) {" in start_content:
              start_content = start_content.replace(
                  "if ($status.phase -eq 'running' -and $status.model.healthy -and $status.hermes.healthy) {",
                  "if ($status.phase -eq 'running' -and $status.model.healthy -and $status.hermes.healthy -and `\n                    ($status.PSObject.Properties.Name -notcontains 'gateway' -or -not $status.gateway.required -or $status.gateway.healthy)) {",
                  1,
              )
          start_content = start_content.replace(
              "                    Write-Host \"Hermes Local is ready with profile '$Profile'. Model PID $($status.model.pid); Hermes PID $($status.hermes.pid).\"",
              "                    $gatewayDetail = if ($status.PSObject.Properties.Name -contains 'gateway' -and $status.gateway.required) {\n                        \" Gateway PID $($status.gateway.pid) ($($status.gateway.ownership)).\"\n                    } else {\n                        ' Messaging gateway disabled.'\n                    }\n                    Write-Host \"Hermes Local is ready with profile '$Profile'. Model PID $($status.model.pid); Hermes PID $($status.hermes.pid).$gatewayDetail\"",
              1,
          )
          write(start, start_content)

          diagnostics = "Test-Hermes-Local.ps1"
          replace_once(
              diagnostics,
              "Import-Module (Join-Path $PSScriptRoot 'scripts\\Hermes-Configuration.psm1') -Force",
              "Import-Module (Join-Path $PSScriptRoot 'scripts\\Hermes-Configuration.psm1') -Force\nImport-Module (Join-Path $PSScriptRoot 'scripts\\Hermes-Gateway.psm1') -Force",
          )
          replace_once(
              diagnostics,
              "    $running = if (Test-Path -LiteralPath $statusPath) {\n        (Get-Content -Raw -LiteralPath $statusPath | ConvertFrom-Json).phase -eq 'running'\n    } else {\n        $false\n    }",
              r'''    $running = if (Test-Path -LiteralPath $statusPath) {
              $runtimeStatus = Get-Content -Raw -LiteralPath $statusPath | ConvertFrom-Json
              $gatewayReady = $runtimeStatus.PSObject.Properties.Name -notcontains 'gateway' -or
                  -not $runtimeStatus.gateway.required -or $runtimeStatus.gateway.healthy
              $runtimeStatus.phase -eq 'running' -and $runtimeStatus.model.healthy -and
                  $runtimeStatus.hermes.healthy -and $gatewayReady
          } else {
              $false
          }''',
          )
          replace_once(
              diagnostics,
              "    Add-TestResult -Name 'Web dashboard' -Passed (\n        $dashboard.StatusCode -eq 200 -and $dashboard.Headers.'Content-Type' -match 'text/html'\n    ) -Detail 'Official dashboard HTML is served from loopback.'",
              r'''    Add-TestResult -Name 'Web dashboard' -Passed (
              $dashboard.StatusCode -eq 200 -and $dashboard.Headers.'Content-Type' -match 'text/html'
          ) -Detail 'Official dashboard HTML is served from loopback.'

          $gatewaySnapshot = Get-HermesGatewaySnapshot -Discover
          if ($gatewaySnapshot.required) {
              $gatewayDetail = if ($gatewaySnapshot.healthy -and -not $gatewaySnapshot.duplicateLogicalRoots) {
                  "Healthy gateway PID $($gatewaySnapshot.pid) for $(@($gatewaySnapshot.enabledPlatforms) -join ', ')."
              } else {
                  Get-HermesGatewayFailureDetail -Snapshot $gatewaySnapshot
              }
              Add-TestResult -Name 'Messaging gateway' -Passed (
                  $gatewaySnapshot.healthy -and -not $gatewaySnapshot.duplicateLogicalRoots
              ) -Detail $gatewayDetail
          } else {
              Add-TestResult -Name 'Messaging gateway' -Passed $true `
                  -Detail 'No gateway-backed messaging platform is enabled.'
          }''',
          )

          changelog = "CHANGELOG-LOCAL.md"
          content = read(changelog)
          marker = "## Unreleased\n\n"
          entry = "- Managed enabled Hermes messaging gateways with the local stack, added authoritative gateway readiness and ownership state, and made diagnostics fail when a required gateway is offline.\n"
          if entry not in content:
              if marker not in content:
                  raise RuntimeError("CHANGELOG-LOCAL.md: Unreleased marker missing")
              content = content.replace(marker, marker + entry, 1)
              write(changelog, content)
          '@ | python -

      - name: Validate gateway lifecycle changes
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_gateway_snapshot.py' -v
          & '.\tests\Test-HermesGatewayModule.ps1'
          $files = @(
            '.\Start-Hermes-Local.ps1',
            '.\Test-Hermes-Local.ps1',
            '.\scripts\Hermes-Gateway.psm1',
            '.\scripts\supervisor\Hermes-Supervisor.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parser rejected $file."
            }
          }
          python -m py_compile '.\scripts\gateway_snapshot.py' '.\tests\test_gateway_snapshot.py'

      - name: Commit generated implementation
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'Implementation already applied.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- `
            CHANGELOG-LOCAL.md `
            Start-Hermes-Local.ps1 `
            Test-Hermes-Local.ps1 `
            scripts/supervisor/Hermes-Supervisor.ps1
          git commit -m 'fix(supervisor): manage the messaging gateway with the local stack'
          git push origin HEAD:agent/manage-messaging-gateway
