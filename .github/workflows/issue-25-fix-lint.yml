name: Issue 25 fix Task Centre lint

on:
  pull_request:
    paths:
      - '.github/workflows/issue-25-fix-lint.yml'

permissions:
  contents: write

concurrency:
  group: issue-25-fix-lint
  cancel-in-progress: false

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-25-security-scan-tasks
          fetch-depth: 0

      - name: Correct JSX prop ordering
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('source/hermes-launcher/patches/0036-feat-desktop-instrument-security-scan-task-progress.patch')
          text = path.read_text(encoding='utf-8')
          old = '''+                className="h-1 bg-(--ui-control-background)"
          +                role="progressbar"
          +                aria-valuemax={100}
          +                aria-valuemin={0}
          +                aria-valuenow={selectedProgressPercent ?? undefined}
          '''
          new = '''+                aria-valuemax={100}
          +                aria-valuemin={0}
          +                aria-valuenow={selectedProgressPercent ?? undefined}
          +                className="h-1 bg-(--ui-control-background)"
          +                role="progressbar"
          '''
          if old not in text:
              raise RuntimeError('Expected Task Centre progressbar prop block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          '@ | python -

      - name: Recompute canonical integration identity
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw -LiteralPath '.\VERSION.json' | ConvertFrom-Json
          $source = Join-Path $env:RUNNER_TEMP 'issue-25-lint-fix-agent'
          $patches = @(Get-ChildItem '.\source\hermes-launcher\patches' -Filter '*.patch' -File | Sort-Object Name | ForEach-Object FullName)

          git clone --no-checkout $manifest.sources.hermesAgent.repository $source
          git -C $source checkout --detach $manifest.sources.hermesAgent.commit
          git -C $source config user.name 'Hermes Local Integration'
          git -C $source config user.email 'hermes-local-ci@localhost'
          git -C $source am --3way --committer-date-is-author-date @patches
          if ($LASTEXITCODE -ne 0) { throw 'The corrected 36-patch integration failed to reconstruct.' }

          $env:ISSUE25_INTEGRATION_COMMIT = (git -C $source rev-parse HEAD).Trim()
          $env:ISSUE25_INTEGRATION_TREE = (git -C $source rev-parse 'HEAD^{tree}').Trim()
          @'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path

          path = Path('VERSION.json')
          document = json.loads(path.read_text(encoding='utf-8'))
          document['sources']['hermesAgent']['integrationCommit'] = os.environ['ISSUE25_INTEGRATION_COMMIT']
          document['sources']['hermesAgent']['integrationTree'] = os.environ['ISSUE25_INTEGRATION_TREE']
          document['recordedAt'] = datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          path.write_text(json.dumps(document, indent=2) + '\n', encoding='utf-8', newline='\n')
          '@ | python -

          "Integration commit: $env:ISSUE25_INTEGRATION_COMMIT" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "Integration tree: $env:ISSUE25_INTEGRATION_TREE" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Commit corrected patch metadata
        shell: pwsh
        run: |
          git config user.name 'Hermes Local CI'
          git config user.email 'hermes-local-ci@localhost'
          git add -- 'source/hermes-launcher/patches/0036-feat-desktop-instrument-security-scan-task-progress.patch' 'VERSION.json'
          git commit -m 'style: sort Task Centre progress props'
          git push origin HEAD:agent/issue-25-security-scan-tasks
