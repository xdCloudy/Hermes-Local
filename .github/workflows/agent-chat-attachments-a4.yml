name: Agent CH-11 source export

on:
  push:
    branches:
      - agent/chat-attachments-a4
    paths:
      - .github/workflows/agent-chat-attachments-a4.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ch11-generated-sources
          path: |
            crates/hermes-core/src/lib.rs
            crates/hermes-desktop/src/lib.rs
            crates/hermes-protocol/src/lib.rs
            crates/hermes-ui/src/chat.rs
            crates/hermes-ui/assets/app.css
          if-no-files-found: error
          retention-days: 1
