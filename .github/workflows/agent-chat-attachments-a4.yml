name: Agent CH-11 parity follow-up

on:
  push:
    branches:
      - agent/chat-attachments-a4
    paths:
      - .github/workflows/agent-chat-attachments-a4.yml

permissions:
  contents: write

env:
  PATCH_B64: 

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Apply parity patch
        shell: pwsh
        run: |
          python -c "import base64,gzip,os,pathlib; pathlib.Path('ch11.patch').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_B64'])))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check ch11.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ch11.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format Rust
        run: cargo fmt --all
      - name: Guard Rust/Dioxus architecture
        run: python scripts/ci/check_dioxus_rust_architecture.py
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Check shared UI for WebAssembly
        run: cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
      - name: Run deterministic Rust tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Verify patch whitespace
        shell: pwsh
        run: git diff --check
      - name: Materialize validated source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-chat-attachments-a4.yml
          git add crates/hermes-core/src/lib.rs crates/hermes-desktop/src/lib.rs crates/hermes-ui/src/chat.rs
          git commit -m "feat: complete CH-11 attachment queue and remote parity"
          git push
