name: Agent CH-11 workspace export

on:
  push:
    branches:
      - agent/chat-attachments-a4
    paths:
      - .github/workflows/agent-chat-attachments-a4.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ch11-validation-workspace
          path: |
            .
            !.git/**
            !target/**
            !node_modules/**
          hidden-files: true
          if-no-files-found: error
          retention-days: 1
