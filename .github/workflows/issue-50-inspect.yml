name: Issue 50 source inspection

on:
  pull_request:
    paths:
      - '.github/workflows/issue-50-inspect.yml'

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct integrated Hermes Agent source
        shell: pwsh
        run: |
          python .\scripts\ci\compatibility.py hermes-agent `
            --repository-root . `
            --work-dir .\temp\issue-50-inspect `
            --log-dir .\artifacts\issue-50-inspect\logs `
            --report .\artifacts\issue-50-inspect\report.json `
            --keep-workspace

          $source = Resolve-Path '.\temp\issue-50-inspect\hermes-agent'
          Push-Location $source
          try {
            git ls-files | Where-Object { $_ -match '(project|workspace|session|memory|task|git)' } |
              Set-Content -LiteralPath "$env:GITHUB_WORKSPACE\artifacts\issue-50-inspect\relevant-files.txt" -Encoding utf8
          } finally {
            Pop-Location
          }

      - name: Upload integrated project sources
        uses: actions/upload-artifact@v4
        with:
          name: issue-50-integrated-sources
          path: |
            artifacts/issue-50-inspect
            temp/issue-50-inspect/hermes-agent/apps/desktop/src
            temp/issue-50-inspect/hermes-agent/apps/desktop/electron
            temp/issue-50-inspect/hermes-agent/apps/desktop/e2e
            temp/issue-50-inspect/hermes-agent/hermes_cli
            temp/issue-50-inspect/hermes-agent/hermes_state.py
            temp/issue-50-inspect/hermes-agent/tui_gateway
            temp/issue-50-inspect/hermes-agent/tests
          retention-days: 2
