name: PF-07 Dioxus watcher staging

on:
  push:
    branches:
      - goal-loop/pf07-dioxus-watchers
    paths:
      - .github/workflows/pf07-dioxus-watchers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal-loop/pf07-dioxus-watchers
          fetch-depth: 0

      - name: Apply PF-07 typed watcher slice
        shell: pwsh
        run: |
          python scripts/ci/pf07_stage_patch.py
          cargo fmt --all
          cargo check --workspace --all-targets
          git diff --check

      - name: Validate PF-07 architecture and contracts
        shell: pwsh
        run: |
          python scripts/ci/check_dioxus_rust_architecture.py
          cargo check --workspace --all-targets --locked
          cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
          cargo test -p hermes-local preview_watcher --locked
          cargo test -p hermes-desktop --test files_ui_contract --locked
          cargo clippy --workspace --all-targets --locked

      - name: Commit staged PF-07 slice and remove staging helpers
        shell: pwsh
        run: |
          Remove-Item .github/workflows/pf07-dioxus-watchers.yml
          Remove-Item scripts/ci/pf07_stage_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(files): wire native directory watchers into Dioxus"
          git push origin HEAD:goal-loop/pf07-dioxus-watchers
