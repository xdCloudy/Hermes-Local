name: Integrate validated GT-04

on:
  push:
    branches:
      - goal-loop/integration-review-preview
    paths:
      - .github/workflows/integrate-gt04.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal-loop/integration-review-preview
          fetch-depth: 0

      - name: Replay validated GT-04 commits
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick dffaeb237e97617d0f2a425141583e8c212872da
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git cherry-pick 083f0b45ef744c47759c33030bfa371037dae673
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git cherry-pick b43753aa719db6c91fdb1d7b17b7c17cd5fcf071
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git cherry-pick a67fce22420174dea784d017af830c816f510332
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git cherry-pick cb2726bf19702443f6735430eb2cd2e321fcad49
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate integrated GT-04
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/check_dioxus_rust_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_review --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove temporary integration workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/integrate-gt04.yml
          git add .github/workflows/integrate-gt04.yml
          git commit -m "chore(ci): remove GT-04 integration helper"
          git push origin HEAD:goal-loop/integration-review-preview
