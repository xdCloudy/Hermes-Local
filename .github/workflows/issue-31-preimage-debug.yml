name: Issue 31 preimage debug

on:
  push:
    branches:
      - fix/issue-31-home-stack-controls

permissions:
  contents: read

jobs:
  resolve-preimage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Resolve post-patch-36 blobs
        shell: bash
        run: |
          set -euo pipefail
          base="$(jq -r '.sources.hermesAgent.commit' VERSION.json)"
          repository="$(jq -r '.sources.hermesAgent.repository' VERSION.json)"
          git clone --no-checkout "$repository" "$RUNNER_TEMP/hermes-agent"
          cd "$RUNNER_TEMP/hermes-agent"
          git checkout --detach "$base"
          git config user.name 'Hermes Local Compatibility CI'
          git config user.email 'hermes-local-ci@localhost'
          mapfile -t patches < <(find "$GITHUB_WORKSPACE/source/hermes-launcher/patches" -maxdepth 1 -name '*.patch' -print | sort | head -n 36)
          git am --3way --committer-date-is-author-date "${patches[@]}"
          echo "local_workstation_blob=$(git rev-parse HEAD:apps/desktop/src/app/local-workstation/index.tsx)"
          echo "integration_commit=$(git rev-parse HEAD)"
          echo "integration_tree=$(git rev-parse HEAD^{tree})"
