name: Stage AG-01 Skills and Hub

on:
  push:
    branches:
      - goal-loop/ag01-skills-hub

permissions:
  contents: write

concurrency:
  group: ag01-skills-hub-stage
  cancel-in-progress: true

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Recover and apply staged product patch
        shell: bash
        run: |
          python -c "import pathlib,subprocess; t=subprocess.check_output(['git','show','HEAD^:.github/workflows/ag01-skills-hub-stage.yml'], text=True); s=t.split(\"          python - <<'PY'\\n\",1)[1].split(\"\\n          PY\\n\",1)[0]; s='\\n'.join((line[10:] if line.startswith('          ') else line) for line in s.splitlines())+'\\n'; pathlib.Path('.ag01-stage.py').write_text(s, encoding='utf-8')"
          python .ag01-stage.py

      - name: Format staged Rust
        run: cargo fmt --all

      - name: Guard architecture
        run: python scripts/ci/check_dioxus_rust_architecture.py

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked

      - name: Check shared UI for WebAssembly
        run: cargo check -p hermes-ui --target wasm32-unknown-unknown --locked

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Publish clean AG-01 product slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/hermes-protocol/src/lib.rs crates/hermes-core/src/lib.rs crates/hermes-desktop/src/lib.rs crates/hermes-desktop/tests/skills_ui_contract.rs crates/hermes-ui/src/lib.rs crates/hermes-ui/src/skills.rs docs/DIOXUS_MIGRATION_MATRIX.md
          git commit -m "feat(skills): port local skills and hub"
          git rm .github/workflows/ag01-skills-hub-stage.yml
          git commit -m "chore(ci): remove AG-01 staging helper"
          git push origin HEAD:goal-loop/ag01-skills-hub
