name: Stage AG-01 Skills and Hub

on:
  push:
    branches:
      - goal-loop/ag01-skills-hub

permissions:
  contents: write

concurrency:
  group: ag01-skills-hub-stage
  cancel-in-progress: true

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Apply typed Skills and Hub port
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def replace_once(path, old, new):
              text = read(path)
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          protocol_path = "crates/hermes-protocol/src/lib.rs"
          protocol = read(protocol_path)
          if "pub struct SkillSummary" not in protocol:
