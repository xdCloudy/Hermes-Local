        let source = source.to_owned();
        Box::pin(async move {
            let profile = validated_profile(profile.as_deref())?;
            let query = checked_skill_text(&query, MAX_SKILL_SEARCH_BYTES, "Skills Hub search query", true)?;
            let source = checked_skill_text(&source, MAX_SKILL_SOURCE_BYTES, "Skills Hub source", false)?;
            if limit == 0 || limit > MAX_SKILL_SEARCH_LIMIT {
                return Err(ServiceError::InvalidInput(format!(
                    "Skills Hub search limit must be between 1 and {MAX_SKILL_SEARCH_LIMIT}"
                )));
            }
            let limit_text = limit.to_string();
            let value = self
                .rest()?
                .request_bounded(
                    Method::GET,
                    &skills_query_path(
                        "/api/skills/hub/search",
                        profile.as_deref(),
                        &[("q", &query), ("source", &source), ("limit", &limit_text)],
                    ),
                    None,
                    SKILLS_HUB_TIMEOUT,
                    MAX_SKILLS_RESPONSE_BYTES,
                )
                .await?;
            serde_json::from_value(value).map_err(protocol)
        })
    }

