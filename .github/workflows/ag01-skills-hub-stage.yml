name: Stage AG-01 Skills and Hub

on:
  push:
    branches:
      - goal-loop/ag01-skills-hub

permissions:
  contents: write

concurrency:
  group: ag01-skills-hub-stage
  cancel-in-progress: true

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and apply staged product patch
        shell: bash
        run: |
          python -c "import pathlib,subprocess; t=subprocess.check_output(['git','show','002765c56aae4a5efdb995394c30fa9b1f251ce5:.github/workflows/ag01-skills-hub-stage.yml'], text=True); s=t.split(\"          python - <<'PY'\\n\",1)[1].split(\"\\n          PY\\n\",1)[0]; s='\\n'.join((line[10:] if line.startswith('          ') else line) for line in s.splitlines())+'\\n'; pathlib.Path('.ag01-stage.py').write_text(s, encoding='utf-8')"
          python .ag01-stage.py
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/hermes-ui/src/skills.rs")
          text = path.read_text(encoding="utf-8")

          action_marker = "        let action = actions().get(&key).cloned();\n"
          action_replacement = (
              action_marker
              + "        let log_text = action\n"
              + "            .as_ref()\n"
              + "            .map(|action| strip_ansi(&action.lines.join(\"\\n\")))\n"
              + "            .unwrap_or_default();\n"
          )
          if action_marker not in text:
              raise SystemExit("action log marker missing")
          text = text.replace(action_marker, action_replacement, 1)
          bad_log = '"{strip_ansi(&action.lines.join("\\n"))}"'
          if bad_log not in text:
              raise SystemExit("action log interpolation marker missing")
          text = text.replace(bad_log, '"{log_text}"', 1)

          bad_files = 'p { class: "muted", "Files: {preview_value.files.join(\", \")}" }'
          good_files = 'p { class: "muted", "Files: " {preview_value.files.join(", ")} }'
          if bad_files not in text:
              raise SystemExit("preview files marker missing")
          text = text.replace(bad_files, good_files, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Format staged Rust
        run: cargo fmt --all

      - name: Guard architecture
        run: python scripts/ci/check_dioxus_rust_architecture.py

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked

      - name: Check shared UI for WebAssembly
        run: cargo check -p hermes-ui --target wasm32-unknown-unknown --locked

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Publish clean AG-01 product slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/hermes-protocol/src/lib.rs crates/hermes-core/src/lib.rs crates/hermes-desktop/src/lib.rs crates/hermes-desktop/tests/skills_ui_contract.rs crates/hermes-ui/src/lib.rs crates/hermes-ui/src/skills.rs docs/DIOXUS_MIGRATION_MATRIX.md
          git commit -m "feat(skills): port local skills and hub"
          git rm .github/workflows/ag01-skills-hub-stage.yml
          git commit -m "chore(ci): remove AG-01 staging helper"
          git push origin HEAD:goal-loop/ag01-skills-hub
