name: Rebase validated GT-06 Review ship onto GT-01 head

on:
  push:
    branches:
      - goal-loop/gt06-review-ship-rebased2
    paths:
      - .github/workflows/gt06-rebase2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal-loop/gt06-review-ship-rebased2
          fetch-depth: 0

      - name: Apply validated GT-06 net product diff
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin goal-loop/gt06-review-ship-integrated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --binary --output=gt06.patch 4036f454380135a99241f6461f17eee7f39c5581..716929a27b60e2ada060cdff56a9f36975297dfd --
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --3way --index gt06.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item gt06.patch
          git commit -m "feat(review): add commit push and PR ship actions"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff d161776102c9e7e05ee8ec7828fba4d0020882a2..HEAD --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate integrated GT-06 tree
        shell: pwsh
        run: |
          python scripts/ci/check_dioxus_rust_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_ship_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_review --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_discard_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_ship_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_status_parity --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish clean GT-06 branch
        shell: pwsh
        run: |
          Remove-Item .github/workflows/gt06-rebase2.yml
          git add .github/workflows/gt06-rebase2.yml
          git commit -m "chore(ci): remove GT-06 rebase helper"
          git push origin HEAD:goal-loop/gt06-review-ship-rebased2
