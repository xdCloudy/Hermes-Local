name: Agent chat patch

on:
  push:
    branches:
      - agent/chat-core-a4
    paths:
      - "agent-patches/chat-core.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply bounded source transform
        run: python agent-patches/chat-core.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Verify patch shape
        shell: bash
        run: |
          git diff --check
          test -f crates/hermes-ui/src/chat.rs
          grep -q '^mod chat;$' crates/hermes-ui/src/lib.rs
          grep -q '^use chat::{Chat, Session};$' crates/hermes-ui/src/lib.rs

      - name: Remove one-shot patch authority
        shell: bash
        run: |
          rm -f agent-patches/chat-core.py
          rm -f .github/workflows/agent-chat-patch.yml

      - name: Commit transformed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: isolate Dioxus chat surfaces for A4 work"
          git push origin HEAD:${{ github.ref_name }}
