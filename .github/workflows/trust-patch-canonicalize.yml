name: Trust patch canonicalize

on:
  pull_request:
    paths:
      - '.github/workflows/trust-patch-canonicalize.yml'
      - 'source/hermes-launcher/patches/0085-feat-desktop-wire-native-Trust-Centre-IPC.patch'

permissions:
  contents: read

jobs:
  canonicalize:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generate exact full-index diff
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -LiteralPath '.\VERSION.json' | ConvertFrom-Json
          $candidate = [string]$manifest.sources.hermesAgent.commit
          $probe = Join-Path $env:RUNNER_TEMP 'hermes-trust-canonical'
          & git clone --quiet --no-checkout https://github.com/NousResearch/hermes-agent.git $probe
          if ($LASTEXITCODE -ne 0) { throw 'clone failed' }
          & git -C $probe checkout --quiet --detach $candidate
          if ($LASTEXITCODE -ne 0) { throw 'checkout failed' }
          & git -C $probe config user.email 'ci@local.invalid'
          & git -C $probe config user.name 'Hermes Local CI'

          $patches = Get-ChildItem -LiteralPath '.\source\hermes-launcher\patches' -Filter '*.patch' -File |
            Sort-Object Name |
            Where-Object { $_.Name -lt '0085-feat-desktop-wire-native-Trust-Centre-IPC.patch' }
          & git -C $probe am --3way --committer-date-is-author-date @($patches.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'preimage reconstruction failed' }

          function Edit-File([string]$Path, [scriptblock]$Editor) {
            $text = [IO.File]::ReadAllText($Path)
            $newline = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
            $updated = & $Editor $text $newline
            if ($updated -eq $text) { throw "edit made no change: $Path" }
            [IO.File]::WriteAllText($Path, $updated, [Text.UTF8Encoding]::new($false))
          }

          $control = Join-Path $probe 'apps\desktop\electron\hermes-local-control.ts'
          Edit-File $control {
            param($text, $nl)
            $text = $text.Replace(
              "import { app, ipcMain, shell } from 'electron'${nl}",
              "import { app, ipcMain, shell } from 'electron'${nl}import { registerHermesLocalTrustCentreIpc } from './hermes-local-trust-centre'${nl}"
            )
            $text.Replace(
              "  ipcMain.handle('hermes:local:path:open', (_event, relativePath) => openLocalPath(relativePath))${nl}  ipcMain.handle('hermes:local:root:open', async () => {",
              "  ipcMain.handle('hermes:local:path:open', (_event, relativePath) => openLocalPath(relativePath))${nl}  registerHermesLocalTrustCentreIpc()${nl}  ipcMain.handle('hermes:local:root:open', async () => {"
            )
          }

          $preload = Join-Path $probe 'apps\desktop\electron\preload.ts'
          Edit-File $preload {
            param($text, $nl)
            $text.Replace(
              "    openRoot: () => ipcRenderer.invoke('hermes:local:root:open')${nl}",
              "    openRoot: () => ipcRenderer.invoke('hermes:local:root:open'),${nl}    trustSnapshot: () => ipcRenderer.invoke('hermes:local:trust:snapshot'),${nl}    setTrustPolicy: input => ipcRenderer.invoke('hermes:local:trust:policy', input),${nl}    exportTrustDiagnostics: () => ipcRenderer.invoke('hermes:local:trust:diagnostics')${nl}"
            )
          }

          $global = Join-Path $probe 'apps\desktop\src\global.d.ts'
          Edit-File $global {
            param($text, $nl)
            $text = $text.Replace(
              "} from './app/local-workstation/types'${nl}import type { WakeIndicatorState } from './lib/wake-indicator'",
              "} from './app/local-workstation/types'${nl}import type { TrustCentreSnapshot, TrustIntegrationRecord, TrustPolicyInput } from './app/local-workstation/trust-types'${nl}import type { WakeIndicatorState } from './lib/wake-indicator'"
            )
            $text.Replace(
              "        openRoot: () => Promise<{ error: string; ok: boolean }>${nl}        registerModel:",
              "        openRoot: () => Promise<{ error: string; ok: boolean }>${nl}        trustSnapshot: () => Promise<TrustCentreSnapshot>${nl}        setTrustPolicy: (input: TrustPolicyInput) => Promise<TrustIntegrationRecord>${nl}        exportTrustDiagnostics: () => Promise<{ path: string }>${nl}        registerModel:"
            )
          }

          Write-Host '=== CANONICAL FULL-INDEX DIFF BEGIN ==='
          & git -C $probe diff --full-index --no-ext-diff -- `
            apps/desktop/electron/hermes-local-control.ts `
            apps/desktop/electron/preload.ts `
            apps/desktop/src/global.d.ts
          Write-Host '=== CANONICAL FULL-INDEX DIFF END ==='
