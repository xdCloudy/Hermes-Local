name: Dioxus PF-06 native one-shot

on:
  push:
    branches:
      - refactor/dioxus-rust-client

permissions:
  contents: write

jobs:
  port-native-file-actions:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add typed native rename reveal and open actions
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          core = Path("crates/hermes-core/src/lib.rs")
          text = core.read_text(encoding="utf-8")
          old = '''    fn write_text(&self, root: &Path, relative: &Path, content: &str) -> ServiceFuture<'_, ()>;
              fn trash(&self, root: &Path, relative: &Path) -> ServiceFuture<'_, ()>;'''.replace('              ', '    ')
          new = '''    fn write_text(&self, root: &Path, relative: &Path, content: &str) -> ServiceFuture<'_, ()>;
              fn rename(&self, root: &Path, relative: &Path, new_name: &str) -> ServiceFuture<'_, String>;
              fn reveal(&self, root: &Path, relative: &Path) -> ServiceFuture<'_, ()>;
              fn open(&self, root: &Path, relative: &Path) -> ServiceFuture<'_, ()>;
              fn trash(&self, root: &Path, relative: &Path) -> ServiceFuture<'_, ()>;'''.replace('              ', '    ')
          if old not in text:
              raise SystemExit("FileService trait anchor not found")
          core.write_text(text.replace(old, new, 1), encoding="utf-8")

          desktop = Path("crates/hermes-desktop/src/lib.rs")
          text = desktop.read_text(encoding="utf-8")
          marker = '''    fn trash(&self, root: &Path, relative: &Path) -> ServiceFuture<'_, ()> {'''
          if marker not in text:
              raise SystemExit("DesktopFiles trash anchor not found")
          methods = r'''    fn rename(
              &self,
              root: &Path,
              relative: &Path,
              new_name: &str,
          ) -> ServiceFuture<'_, String> {
              let root = root.to_owned();
              let relative = relative.to_owned();
              let new_name = new_name.trim().to_owned();
              Box::pin(async move {
                  if new_name.is_empty()
                      || new_name == "."
                      || new_name == ".."
                      || new_name.contains('/')
                      || new_name.contains('\\')
                  {
                      return Err(ServiceError::InvalidInput("Invalid rename".into()));
                  }

                  let source = contained_existing(&root, &relative)?;
                  let parent = relative.parent().unwrap_or_else(|| Path::new(""));
                  let destination_relative = parent.join(&new_name);
                  let destination = contained_for_write(&root, &destination_relative)?;
                  if destination.exists() {
                      return Err(ServiceError::InvalidInput(format!(
                          "A file or folder named '{new_name}' already exists"
                      )));
                  }

                  fs::rename(source, destination).map_err(platform)?;
                  Ok(destination_relative.to_string_lossy().replace('\\', "/"))
              })
          }

          fn reveal(&self, root: &Path, relative: &Path) -> ServiceFuture<'_, ()> {
              let root = root.to_owned();
              let relative = relative.to_owned();
              Box::pin(async move {
                  let target = contained_existing(&root, &relative)?;
                  reveal_native_path(&target)
              })
          }

          fn open(&self, root: &Path, relative: &Path) -> ServiceFuture<'_, ()> {
              let root = root.to_owned();
              let relative = relative.to_owned();
              Box::pin(async move {
                  let target = contained_existing(&root, &relative)?;
                  open::that(target).map_err(|error| ServiceError::Platform(error.to_string()))
              })
          }

'''
          text = text.replace(marker, methods + marker, 1)

          helper_anchor = '''struct DesktopFiles;

impl FileService for DesktopFiles {'''
          helper = r'''fn reveal_native_path(target: &Path) -> ServiceResult<()> {
              #[cfg(target_os = "windows")]
              {
                  std::process::Command::new("explorer.exe")
                      .arg(format!("/select,{}", target.display()))
                      .spawn()
                      .map(|_| ())
                      .map_err(platform)
              }

              #[cfg(target_os = "macos")]
              {
                  std::process::Command::new("open")
                      .arg("-R")
                      .arg(target)
                      .spawn()
                      .map(|_| ())
                      .map_err(platform)
              }

              #[cfg(not(any(target_os = "windows", target_os = "macos")))]
              {
                  let parent = target.parent().unwrap_or(target);
                  open::that(parent).map_err(|error| ServiceError::Platform(error.to_string()))
              }
          }

          struct DesktopFiles;

          impl FileService for DesktopFiles {'''
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines())
          if helper_anchor not in text:
              raise SystemExit("DesktopFiles struct anchor not found")
          text = text.replace(helper_anchor, helper, 1)
          desktop.write_text(text, encoding="utf-8")
          '@ | python -

          cargo fmt --all
          git rm -- .github/workflows/dioxus-pf06-native-once.yml
          git add -- crates/hermes-core/src/lib.rs crates/hermes-desktop/src/lib.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(files): add typed native file actions"
          git push origin HEAD:refactor/dioxus-rust-client
