name: Temporary Shell matrix promotion

'on':
  push:
    branches:
      - agent/shell-all-a4

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/shell-all-a4
      - name: Update validated ledger
        run: python .github/promote_shell_matrix.py
      - name: Commit ledger
        run: |
          if git diff --quiet -- docs/DIOXUS_MIGRATION_MATRIX.md; then
            echo "Matrix already promoted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DIOXUS_MIGRATION_MATRIX.md
          git commit -m "promote Shell migration rows to A4"
          git push origin HEAD:agent/shell-all-a4
