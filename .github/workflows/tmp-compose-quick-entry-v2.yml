name: Temporary compose Quick Entry v2

on:
  push:
    branches:
      - agent/quick-entry
    paths:
      - ".github/workflows/tmp-compose-quick-entry-v2.yml"

permissions:
  contents: write

jobs:
  compose:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quick-entry
      - name: Run structural Quick Entry composition
        shell: python
        run: |
          import re
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-compose-quick-entry.yml').read_text(encoding='utf-8')
          start = '      - name: Wire Quick Entry into Dioxus\n        shell: python\n        run: |\n'
          end = '      - name: Format and focused Windows validation\n'
          script = textwrap.dedent(workflow.split(start, 1)[1].split(end, 1)[0])
          override = r'''
          def replace_once(path, old, new):
              import re
              from pathlib import Path
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) == 1:
                  file.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
                  return
              parts = re.split(r'(\s+)', old)
              pattern = ''.join(r'\s+' if part.isspace() else re.escape(part) for part in parts if part)
              matches = list(re.finditer(pattern, text, flags=re.S))
              if len(matches) != 1:
                  raise SystemExit(f'{path}: structural anchor count={len(matches)} for {old[:100]!r}')
              match = matches[0]
              file.write_text(text[:match.start()] + new + text[match.end():], encoding='utf-8', newline='\n')

          '''
          marker = "quick = Path('apps/desktop/src/quick_entry.rs')\n"
          script = script.replace(marker, textwrap.dedent(override) + marker, 1)
          # The explicit main closing-block check in v1 is still whitespace-sensitive; normalize it.
          script = script.replace(
              "if text.count(old) != 1:\n    raise SystemExit(f'main wrapper close anchor count={text.count(old)}')\nPath(main).write_text(text.replace(old, new), encoding='utf-8', newline='\\n')",
              "parts = re.split(r'(\\s+)', old)\npattern = ''.join(r'\\s+' if part.isspace() else re.escape(part) for part in parts if part)\nmatches = list(re.finditer(pattern, text, flags=re.S))\nif len(matches) != 1:\n    raise SystemExit(f'main wrapper close structural count={len(matches)}')\nmatch = matches[0]\nPath(main).write_text(text[:match.start()] + new + text[match.end():], encoding='utf-8', newline='\\n')"
          )
          exec(compile(script, '<quick-entry-compose-v1>', 'exec'), {'__name__': '__main__'})
      - name: Format and focused Windows validation
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "rustfmt failed" }
          cargo test -p hermes-ui --locked quick_entry -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "shared Quick Entry tests failed" }
          cargo test -p hermes-local --bin hermes-local --locked quick_entry -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Desktop Quick Entry tests failed" }
          cargo check -p hermes-local --bin hermes-local --locked
          if ($LASTEXITCODE -ne 0) { throw "Desktop Quick Entry composition failed" }
          cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { throw "shared UI WASM check failed" }
      - name: Commit composed Quick Entry source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/quick_entry.rs apps/desktop/src/quick_entry_bridge.rs apps/desktop/src/main.rs crates/hermes-ui/src/quick_entry.rs crates/hermes-ui/src/lib.rs crates/hermes-ui/src/chat/legacy.rs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "diff check failed" }
          git commit -m "feat(di-07): wire global Quick Entry window"
          if ($LASTEXITCODE -ne 0) { throw "Quick Entry source commit failed" }
          git push origin HEAD:agent/quick-entry
          if ($LASTEXITCODE -ne 0) { throw "Quick Entry source push failed" }
