name: Repair DI-07 compile mismatch

on:
  push:
    branches: ["refactor/di-07-quick-entry-native"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/di-07-quick-entry-native
          fetch-depth: 0
      - name: Apply compiler-proven API fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/desktop/src/quick_entry_host.rs")
          text = path.read_text(encoding="utf-8")
          old = "window.is_visible().unwrap_or(false)"
          new = "window.is_visible()"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one compile mismatch, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit product-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/di07-compile-repair.yml
          git add apps/desktop/src/quick_entry_host.rs
          git commit -m "fix(desktop): use Dioxus visibility boolean directly"
          git push origin HEAD:refactor/di-07-quick-entry-native
