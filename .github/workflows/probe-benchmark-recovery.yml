name: Probe benchmark recovery integration

on:
  push:
    branches:
      - agent/fix-benchmark-recovery-coordination
  pull_request:

permissions:
  contents: read

jobs:
  reconstruct-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct pinned Hermes Agent integration
        shell: bash
        run: |
          set -euo pipefail
          repository="$(node -p "require('./VERSION.json').sources.hermesAgent.repository")"
          branch="$(node -p "require('./VERSION.json').sources.hermesAgent.branch")"
          commit="$(node -p "require('./VERSION.json').sources.hermesAgent.commit")"

          git clone --filter=blob:none --branch "$branch" "$repository" /tmp/hermes-agent
          git -C /tmp/hermes-agent checkout --detach "$commit"
          git -C /tmp/hermes-agent config user.name xdCloudy
          git -C /tmp/hermes-agent config user.email 52116030+xdCloudy@users.noreply.github.com
          git -C /tmp/hermes-agent am --committer-date-is-author-date "$GITHUB_WORKSPACE"/source/hermes-launcher/patches/*.patch

          echo "INTEGRATION_COMMIT=$(git -C /tmp/hermes-agent rev-parse HEAD)"
          echo "INTEGRATION_TREE=$(git -C /tmp/hermes-agent rev-parse 'HEAD^{tree}')"

      - name: Install Hermes Agent dependencies
        working-directory: /tmp/hermes-agent
        run: npm ci

      - name: Run focused Electron control tests
        working-directory: /tmp/hermes-agent/apps/desktop
        run: npx vitest run electron/hermes-local-control.test.ts -t "returns the active task|waits for an active benchmark"
