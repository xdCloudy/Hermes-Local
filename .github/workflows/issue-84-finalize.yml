name: Issue 84 finalize integration

on:
  pull_request:
    paths:
      - '.github/workflows/issue-84-finalize.yml'
      - 'scripts/ci/issue84-desktop-patch-v3/**'
      - 'Switch-Hermes-Model.ps1'
      - 'scripts/Hermes-Configuration.psm1'
      - 'scripts/verify_model_identity.py'
      - 'tests/test_verify_model_identity.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Validate root sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
          python -m py_compile '.\scripts\verify_model_identity.py' '.\tests\test_verify_model_identity.py'
          python -m unittest '.\tests\test_verify_model_identity.py' -v
          foreach ($path in @('.\Start-Hermes-Local.ps1', '.\Switch-Hermes-Model.ps1', '.\scripts\Hermes-Configuration.psm1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if (@($errors).Count) { throw (@($errors).Message -join [Environment]::NewLine) }
          }

      - name: Reconstruct integrated source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Get-Content -Raw '.\VERSION.json' | ConvertFrom-Json
          $candidate = [string]$manifest.sources.hermesAgent.commit
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git '.\temp\hermes-agent'
          git -C '.\temp\hermes-agent' checkout --detach $candidate
          git -C '.\temp\hermes-agent' config user.name 'Hermes Local CI'
          git -C '.\temp\hermes-agent' config user.email 'hermes-local-ci@localhost'
          $patches = @(
            Get-ChildItem '.\source\hermes-launcher\patches\*.patch' |
              Where-Object Name -ne '0032-fix-desktop-activate-selected-models-through-managed-restart.patch' |
              Sort-Object Name |
              ForEach-Object FullName
          )
          git -C '.\temp\hermes-agent' am --3way --committer-date-is-author-date @patches

          @'
          import base64, gzip, hashlib
          from pathlib import Path
          parts = sorted(Path('scripts/ci/issue84-desktop-patch-v3').glob('part-*.txt'))
          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in parts)
          assert len(parts) == 7
          assert hashlib.sha256((encoded + '\n').encode('ascii')).hexdigest() == '7b81b81956f725986ce669d8e959b689a6c1e9cfc7bb0c46cd8d883ee6d05758'
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '1450e46b805d642be20509783ecc20e787f24a09a8cc1ac38984f3a662885473'
          Path('temp/issue84-desktop.patch').write_bytes(patch)
          '@ | python -
          $desktopPatch = (Resolve-Path '.\temp\issue84-desktop.patch').Path
          git -C '.\temp\hermes-agent' apply --check --directory='apps/desktop' $desktopPatch
          git -C '.\temp\hermes-agent' apply --directory='apps/desktop' $desktopPatch

      - name: Apply compatibility-safe type corrections
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          types_path = Path('temp/hermes-agent/apps/desktop/src/app/local-workstation/types.ts')
          types = types_path.read_text(encoding='utf-8')
          marker = '  stage: null | string\n'
          if marker not in types:
              raise SystemExit('LocalActionTask.stage declaration was not found')
          types_path.write_text(types.replace(marker, '  stage?: null | string\n', 1), encoding='utf-8')

          model_path = Path('temp/hermes-agent/apps/desktop/electron/hermes-local-task-model.ts')
          model = model_path.read_text(encoding='utf-8')
          old = """  const stage = candidate.stage === null || candidate.stage === undefined ? null : candidate.stage

  if (stage !== null && (typeof stage !== 'string' || stage.length > 128)) {
    return null
  }
"""
          new = """  const stageValue = candidate.stage

  if (
    stageValue !== null &&
    stageValue !== undefined &&
    (typeof stageValue !== 'string' || stageValue.length > 128)
  ) {
    return null
  }

  const stage = typeof stageValue === 'string' ? stageValue : null
"""
          if old not in model:
              raise SystemExit('Task stage parser block was not found')
          model_path.write_text(model.replace(old, new, 1), encoding='utf-8')
          '@ | python -

      - name: Run focused Desktop validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location '.\temp\hermes-agent'
          try {
            npx.cmd --yes npm@12.0.0 install --ignore-scripts --no-audit --fund=false
            Push-Location '.\apps\desktop'
            try {
              npx.cmd --no-install vitest run --project electron `
                electron/hermes-local-model-switch.test.ts `
                electron/hermes-local-control.test.ts `
                electron/hermes-local-task-model.test.ts `
                electron/hermes-local-task-store.test.ts `
                electron/hermes-local-settings.test.ts `
                electron/hermes-local-dashboard-view.test.ts
            } finally { Pop-Location }
            npx.cmd --yes npm@12.0.0 run typecheck --workspace hermes-launcher
            npx.cmd --yes npm@12.0.0 run lint --workspace hermes-launcher
          } finally { Pop-Location }

      - name: Generate and verify patch series
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $source = Resolve-Path '.\temp\hermes-agent'
          git -C $source add apps/desktop package-lock.json
          git -C $source commit -m 'fix(desktop): activate selected models through managed restart'

          $output = Resolve-Path '.\source\hermes-launcher\patches'
          $generated = (git -C $source format-patch -1 --zero-commit --output-directory $output).Trim()
          $destination = Join-Path $output '0032-fix-desktop-activate-selected-models-through-managed-restart.patch'
          if (Test-Path $destination) { Remove-Item $destination -Force }
          Move-Item -LiteralPath $generated -Destination $destination -Force

          $integrationCommit = (git -C $source rev-parse HEAD).Trim()
          $integrationTree = (git -C $source rev-parse 'HEAD^{tree}').Trim()
          @'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('VERSION.json')
          doc = json.loads(path.read_text(encoding='utf-8-sig'))
          doc['sources']['hermesAgent']['integrationCommit'] = '__COMMIT__'
          doc['sources']['hermesAgent']['integrationTree'] = '__TREE__'
          doc['recordedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          path.write_text(json.dumps(doc, indent=2) + '\n', encoding='utf-8')
          '@.Replace('__COMMIT__', $integrationCommit).Replace('__TREE__', $integrationTree) | python -

          $manifest = Get-Content -Raw '.\VERSION.json' | ConvertFrom-Json
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git '.\temp\verify'
          git -C '.\temp\verify' checkout --detach ([string]$manifest.sources.hermesAgent.commit)
          git -C '.\temp\verify' config user.name 'Hermes Local CI'
          git -C '.\temp\verify' config user.email 'hermes-local-ci@localhost'
          $allPatches = @(Get-ChildItem '.\source\hermes-launcher\patches\*.patch' | Sort-Object Name | ForEach-Object FullName)
          git -C '.\temp\verify' am --3way --committer-date-is-author-date @allPatches
          $verifiedTree = (git -C '.\temp\verify' rev-parse 'HEAD^{tree}').Trim()
          if ($verifiedTree -ne [string]$manifest.sources.hermesAgent.integrationTree) { throw "Integration tree mismatch: $verifiedTree" }

      - name: Publish permanent files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'Hermes Local CI'
          git config user.email 'hermes-local-ci@localhost'
          git add VERSION.json source/hermes-launcher/patches/0032-fix-desktop-activate-selected-models-through-managed-restart.patch
          git commit -m 'fix: activate selected models through managed stack restart'
          git push origin HEAD:${{ github.head_ref }}
