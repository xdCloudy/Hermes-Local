name: Agent chat composer mutability fix

on:
  push:
    branches:
      - agent/chat-composer-a4
    paths:
      - "agent-patches/chat-composer-mut.txt"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Make chat runtime bindings mutable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/hermes-ui/src/chat.rs')
          text = path.read_text(encoding='utf-8')
          old = 'let chat_runtime = use_context::<ChatRuntimeState>();'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 chat runtime bindings, found {count}')
          path.write_text(text.replace(old, 'let mut chat_runtime = use_context::<ChatRuntimeState>();'), encoding='utf-8')
          PY
      - run: cargo fmt --all
      - run: git diff --check
      - name: Remove one-shot authority and commit
        shell: bash
        run: |
          rm -f agent-patches/chat-composer-mut.txt .github/workflows/agent-chat-composer-mut-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make composer runtime signals mutable"
          git push origin HEAD:${{ github.ref_name }}
