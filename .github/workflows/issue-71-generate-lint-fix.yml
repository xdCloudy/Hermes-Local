name: Issue 71 generate lint fix

on:
  pull_request:
    paths:
      - '.github/workflows/issue-71-generate-lint-fix.yml'

permissions:
  contents: read

jobs:
  generate:
    name: Generate patch 31 and integration state
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Apply current integration and create lint patch
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path
          $work = Join-Path $root 'temp\issue-71-lint-fix'
          $source = Join-Path $work 'hermes-agent'
          $output = Join-Path $root 'artifacts\issue-71-lint-fix'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $work, $output
          New-Item -ItemType Directory -Force -Path $work, $output | Out-Null

          git clone --no-checkout 'https://github.com/NousResearch/hermes-agent.git' $source
          git -C $source checkout --detach '582606f176f5467deb96bb949e0879a8e18f31dd'
          git -C $source config user.name 'Hermes Local Compatibility CI'
          git -C $source config user.email 'hermes-local-ci@localhost'
          git -C $source switch -c 'hermes-local-integration'

          $patches = Get-ChildItem '.\source\hermes-launcher\patches' -Filter '*.patch' -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName }
          if ($patches.Count -ne 30) {
            throw "Expected 30 current patches, found $($patches.Count)."
          }
          git -C $source am --3way --committer-date-is-author-date @patches
          if ($LASTEXITCODE -ne 0) {
            throw 'Current patch series did not apply to the recorded candidate.'
          }

          @'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          path = source / 'apps/desktop/src/global.d.ts'
          text = path.read_text(encoding='utf-8')
          wake = "import type { WakeIndicatorState } from './lib/wake-indicator'\n"
          marker = "} from './app/local-workstation/types'\n"
          if text.count(wake) != 1 or text.count(marker) != 1:
              raise RuntimeError('expected global type imports were not uniquely present')
          if text.index(marker) < text.index(wake):
              raise RuntimeError('global type imports are already sorted')
          text = text.replace(wake, '', 1)
          text = text.replace(marker, marker + wake, 1)
          path.write_text(text, encoding='utf-8')
          '@ | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'sort-global-imports.py')
          python (Join-Path $env:RUNNER_TEMP 'sort-global-imports.py') $source

          git -C $source add -- 'apps/desktop/src/global.d.ts'
          git -C $source commit -m 'style(desktop): sort global type imports'
          git -C $source format-patch -1 --zero-commit --no-signature --stdout |
            Set-Content -Encoding utf8 (Join-Path $output '0031-style-desktop-sort-global-type-imports.patch')

          $integrationCommit = (git -C $source rev-parse HEAD).Trim()
          $integrationTree = (git -C $source rev-parse 'HEAD^{tree}').Trim()
          @"
          {
            "candidate": "582606f176f5467deb96bb949e0879a8e18f31dd",
            "integrationCommit": "$integrationCommit",
            "integrationTree": "$integrationTree",
            "patchCount": 31
          }
          "@ | Set-Content -Encoding utf8 (Join-Path $output 'result.json')

          @'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          source, result_path, destination = map(Path, sys.argv[1:])
          version = json.loads(source.read_text(encoding='utf-8-sig'))
          result = json.loads(result_path.read_text(encoding='utf-8-sig'))
          agent = version['sources']['hermesAgent']
          agent['commit'] = result['candidate']
          agent['integrationCommit'] = result['integrationCommit']
          agent['integrationTree'] = result['integrationTree']
          version['recordedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          destination.write_text(json.dumps(version, indent=2) + '\n', encoding='utf-8')
          '@ | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'update-version.py')
          python (Join-Path $env:RUNNER_TEMP 'update-version.py') `
            (Join-Path $root 'VERSION.json') `
            (Join-Path $output 'result.json') `
            (Join-Path $output 'VERSION.json')

      - name: Upload lint-fix patch and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-71-lint-fix
          path: artifacts/issue-71-lint-fix
          if-no-files-found: error
          retention-days: 14
