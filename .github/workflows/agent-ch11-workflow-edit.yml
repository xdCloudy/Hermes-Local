name: Agent CH-11 wire Clippy repair

on:
  push:
    branches:
      - agent/chat-attachments-a4
    paths:
      - .github/workflows/agent-ch11-workflow-edit.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert fail-closed Clippy repair step
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/agent-chat-attachments-a4.yml')
          text = path.read_text(encoding='utf-8')
          anchor = "          git apply ch11.patch\n          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n      - name: Format Rust\n"
          replacement = "          git apply ch11.patch\n          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n      - name: Apply Clippy repair\n        shell: pwsh\n        run: |\n          python agent-patches/ch11-clippy-fix.py\n          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n      - name: Format Rust\n"
          if anchor not in text:
              raise SystemExit('parity workflow anchor not found')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Commit validation workflow update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-chat-attachments-a4.yml
          git rm .github/workflows/agent-ch11-workflow-edit.yml
          git commit -m "fix: apply CH-11 Clippy repair before validation"
          git push
