name: Dioxus Rust validation

# Branch gate for the native Rust/Dioxus client migration.
on:
  workflow_dispatch:
  push:
    branches:
      - refactor/dioxus-rust-client
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "apps/desktop/**"
      - "crates/**"
      - "scripts/ci/check_dioxus_rust_architecture.py"
      - ".github/workflows/dioxus-rust.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "apps/desktop/**"
      - "crates/**"
      - "scripts/ci/check_dioxus_rust_architecture.py"
      - ".github/workflows/dioxus-rust.yml"

permissions:
  contents: read

concurrency:
  group: dioxus-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show pinned toolchain
        shell: pwsh
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Guard Rust/Dioxus architecture
        run: python scripts/ci/check_dioxus_rust_architecture.py

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --workspace --all-targets --locked

      - name: Check shared UI for WebAssembly
        run: cargo check -p hermes-ui --target wasm32-unknown-unknown --locked

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Build optimized Windows client
        run: cargo build -p hermes-local --release --locked --features bundle

      - name: Record optimized client size
        shell: pwsh
        run: |
          $binary = Get-Item "target/release/hermes-local.exe"
          $mib = [math]::Round($binary.Length / 1MB, 2)
          "### Optimized Rust client" >> $env:GITHUB_STEP_SUMMARY
          "- Binary: ``target/release/hermes-local.exe``" >> $env:GITHUB_STEP_SUMMARY
          "- Size: $($binary.Length) bytes ($mib MiB)" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload optimized client
        uses: actions/upload-artifact@v4
        with:
          name: hermes-local-rust-windows-x64
          path: target/release/hermes-local.exe
          if-no-files-found: error
          retention-days: 7
