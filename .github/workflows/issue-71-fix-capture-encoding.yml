name: Issue 71 repair capture encoding

on:
  pull_request:
    paths:
      - '.github/workflows/issue-71-fix-capture-encoding.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch and push
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/rebase_issue71_series.py')
          text = path.read_text(encoding='utf-8')
          needle = 'from typing import Sequence\n\nNPM_VERSION'
          replacement = '''from typing import Sequence

if hasattr(sys.stdout, "reconfigure"):
    sys.stdout.reconfigure(encoding="utf-8", errors="replace")
if hasattr(sys.stderr, "reconfigure"):
    sys.stderr.reconfigure(encoding="utf-8", errors="replace")

NPM_VERSION'''
          if needle not in text:
              raise SystemExit('encoding insertion point not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          rm '.github/workflows/issue-71-fix-capture-encoding.yml'
          python -m py_compile scripts/ci/rebase_issue71_series.py
          git config user.name 'Hermes Local Compatibility CI'
          git config user.email 'hermes-local-ci@localhost'
          git add scripts/ci/rebase_issue71_series.py
          git add -u .github/workflows
          git commit -m 'fix: make conflict capture UTF-8 safe'
          git push origin "HEAD:${{ github.head_ref }}"
