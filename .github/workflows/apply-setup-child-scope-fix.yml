name: Apply setup child-scope fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-setup-child-scope'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-setup-child-scope

      - name: Apply setup isolation fix
        shell: pwsh
        run: |
          $targetCommit = 'fix(setup): isolate nested PowerShell scripts'
          if ((git log -1 --pretty=%s) -eq $targetCommit) {
            Write-Host 'Setup isolation fix already applied.'
            exit 0
          }

          @'
          from pathlib import Path

          path = Path("Setup-Hermes-Local.ps1")
          content = path.read_text(encoding="utf-8")

          import_anchor = "Import-Module (Join-Path $PSScriptRoot 'scripts\\Hermes-Configuration.psm1') -Force\n"
          helper = r'''

          function Invoke-IsolatedPowerShellScript {
              [CmdletBinding()]
              param(
                  [Parameter(Mandatory)]
                  [string] $ScriptPath,
                  [string[]] $ArgumentList = @(),
                  [Parameter(Mandatory)]
                  [string] $Description
              )

              $hostExecutable = (Get-Process -Id $PID -ErrorAction Stop).Path
              if ([string]::IsNullOrWhiteSpace($hostExecutable)) {
                  throw 'Unable to resolve the current PowerShell host executable.'
              }
              $hostArguments = @(
                  '-NoLogo', '-NoProfile', '-NonInteractive',
                  '-ExecutionPolicy', 'Bypass',
                  '-File', $ScriptPath
              ) + @($ArgumentList)
              & $hostExecutable @hostArguments
              if ($LASTEXITCODE -ne 0) {
                  throw "$Description failed with exit code $LASTEXITCODE."
              }
          }
          '''
          if "function Invoke-IsolatedPowerShellScript" not in content:
              if import_anchor not in content:
                  raise SystemExit("Setup import anchor not found")
              content = content.replace(import_anchor, import_anchor + helper, 1)

          old_launcher = r'''        if (Test-Path -LiteralPath $launcherBuild) {
                      & $launcherBuild -NonInteractive:$NonInteractive
                      if ($LASTEXITCODE -ne 0) {
                          throw "Launcher build failed with exit code $LASTEXITCODE."
                      }
                  }'''
          new_launcher = r'''        if (Test-Path -LiteralPath $launcherBuild) {
                      $launcherArguments = @()
                      if ($NonInteractive) {
                          $launcherArguments += '-NonInteractive'
                      }
                      Invoke-IsolatedPowerShellScript `
                          -ScriptPath $launcherBuild `
                          -ArgumentList $launcherArguments `
                          -Description 'Launcher build'
                  }'''
          if old_launcher in content:
              content = content.replace(old_launcher, new_launcher, 1)
          elif "& $launcherBuild" in content:
              raise SystemExit("Unexpected direct launcher invocation shape")

          old_diagnostics = r'''    if (Test-Path -LiteralPath $diagnosticScript) {
                  & $diagnosticScript -BootstrapOnly
                  if ($LASTEXITCODE -ne 0) {
                      throw "Bootstrap diagnostics failed with exit code $LASTEXITCODE."
                  }
              }'''
          new_diagnostics = r'''    if (Test-Path -LiteralPath $diagnosticScript) {
                  Invoke-IsolatedPowerShellScript `
                      -ScriptPath $diagnosticScript `
                      -ArgumentList @('-BootstrapOnly') `
                      -Description 'Bootstrap diagnostics'
              }'''
          if old_diagnostics in content:
              content = content.replace(old_diagnostics, new_diagnostics, 1)
          elif "& $diagnosticScript" in content:
              raise SystemExit("Unexpected direct diagnostics invocation shape")

          path.write_text(content, encoding="utf-8", newline="\n")
          '@ | python -

          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\Setup-Hermes-Local.ps1'), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            throw (($errors | ForEach-Object ToString) -join [Environment]::NewLine)
          }
          & '.\tests\Test-SetupChildProcessIsolation.ps1'

      - name: Commit setup fix
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- Setup-Hermes-Local.ps1)) {
            Write-Host 'Setup fix already present.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Setup-Hermes-Local.ps1
          git commit -m 'fix(setup): isolate nested PowerShell scripts'
          git push origin HEAD:agent/fix-setup-child-scope
