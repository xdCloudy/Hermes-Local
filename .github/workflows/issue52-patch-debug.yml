name: Issue 52 patch debug

on:
  push:
    branches:
      - fix/issue-52-stable-session-projects

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reconstruct through 0096
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $work = Join-Path $env:RUNNER_TEMP 'issue52-hermes-agent'
          git clone https://github.com/NousResearch/hermes-agent.git $work
          if ($LASTEXITCODE -ne 0) { throw 'clone failed' }
          Push-Location $work
          try {
            git checkout 91937a6dc3ffbbe2f3be91a500f0ecf962c4cf53
            git config user.name 'Hermes Local CI'
            git config user.email 'ci@localhost'
            $patches = Get-ChildItem (Join-Path $root 'source/hermes-launcher/patches') -Filter '*.patch' |
              Sort-Object Name |
              Where-Object { $_.Name -ne '0097-fix-projectless-and-pathless-authority.patch' }
            git am --3way --committer-date-is-author-date @($patches.FullName)
            if ($LASTEXITCODE -ne 0) { throw 'patch reconstruction failed' }
            Write-Host "TREE=$(git rev-parse HEAD^{tree})"
            $paths = @(
              'apps/desktop/src/app/chat/composer/index.tsx',
              'apps/desktop/src/app/chat/composer/status-stack/project-row.tsx',
              'tui_gateway/project_tree.py',
              'tui_gateway/server.py',
              'tests/tui_gateway/test_project_tree.py',
              'tests/tui_gateway/test_projects_rpc.py'
            )
            foreach ($path in $paths) {
              Write-Host "BLOB $path"
              git ls-tree HEAD -- $path
            }
            Write-Host '--- composer context ---'
            Get-Content 'apps/desktop/src/app/chat/composer/index.tsx' | Select-Object -Skip 1212 -First 24
            Write-Host '--- project row context ---'
            Get-Content 'apps/desktop/src/app/chat/composer/status-stack/project-row.tsx' | Select-Object -Skip 24 -First 65
            Write-Host '--- project tree context ---'
            Get-Content 'tui_gateway/project_tree.py' | Select-Object -Skip 573 -First 75
            Write-Host '--- server context ---'
            Get-Content 'tui_gateway/server.py' | Select-Object -Skip 2918 -First 50
            Write-Host '--- project tree test tail ---'
            Get-Content 'tests/tui_gateway/test_project_tree.py' | Select-Object -Last 45
            Write-Host '--- projects rpc test tail ---'
            Get-Content 'tests/tui_gateway/test_projects_rpc.py' | Select-Object -Last 90
          } finally {
            Pop-Location
          }
