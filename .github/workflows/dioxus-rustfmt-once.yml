name: Dioxus one-shot rustfmt

on:
  push:
    branches:
      - refactor/dioxus-rust-client

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Format Rust workspace and remove one-shot workflow
        shell: pwsh
        run: |
          cargo fmt --all
          git rm -- .github/workflows/dioxus-rustfmt-once.yml
          git add -- crates/hermes-ui/src/lib.rs crates/hermes-desktop/tests/ssh_host_suggestions_contract.rs
          if (git diff --cached --quiet) {
            Write-Host "Nothing to commit."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(dioxus): apply rustfmt"
          git push origin HEAD:refactor/dioxus-rust-client
