name: Agent CH-11 Clippy diagnostic

on:
  push:
    branches:
      - agent/chat-attachments-a4
    paths:
      - .github/workflows/agent-ch11-clippy-diagnostic.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture failed Clippy output
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh run view 31708295901 --repo "$GITHUB_REPOSITORY" --log-failed > diagnostics/ch11-clippy-full.txt
          grep -E '(^|[[:space:]])(error:|warning:|help:|note:|--> crates/hermes-|= note:|= help:)' diagnostics/ch11-clippy-full.txt > diagnostics/ch11-clippy.txt || true
          if [ ! -s diagnostics/ch11-clippy.txt ]; then
            tail -n 300 diagnostics/ch11-clippy-full.txt > diagnostics/ch11-clippy.txt
          fi
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/ch11-clippy.txt
          git commit -m "chore: record CH-11 Clippy diagnostic"
          git push
