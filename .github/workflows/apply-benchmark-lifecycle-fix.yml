name: Apply benchmark lifecycle fix

on:
  push:
    branches:
      - agent/fix-benchmark-recovery-coordination

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-benchmark-recovery-coordination
          fetch-depth: 0

      - name: Apply exact source transformations
        shell: pwsh
        run: python '.github/tmp/apply_benchmark_lifecycle_fix.py'

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $failures = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem -LiteralPath $PWD -Recurse -File |
            Where-Object Extension -In @('.ps1', '.psm1') |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$errors
              )
              foreach ($error in @($errors)) {
                $failures.Add("$($_.FullName):$($error.Extent.StartLineNumber): $($error.Message)")
              }
            }
          if ($failures.Count -gt 0) {
            throw ($failures -join [Environment]::NewLine)
          }

      - name: Verify benchmark lifecycle contract
        shell: pwsh
        run: '& ''.\tests\Test-BenchmarkLifecycleContract.ps1'''

      - name: Commit generated implementation
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/tmp/apply_benchmark_lifecycle_fix.py' -Force
          Remove-Item -LiteralPath '.github/workflows/apply-benchmark-lifecycle-fix.yml' -Force
          git config user.name 'xdCloudy'
          git config user.email '52116030+xdCloudy@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix(benchmark): keep Desktop services online'
          git push origin HEAD:agent/fix-benchmark-recovery-coordination
