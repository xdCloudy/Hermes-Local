name: Temporary reconcile PR 219 matrix

on:
  push:
    branches:
      - agent/matrix-a4-219-220
    paths:
      - ".github/workflows/tmp-matrix-a4-219.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/matrix-a4-219-220
      - name: Reconcile merged PR 219 evidence
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/DIOXUS_MIGRATION_MATRIX.md")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()

          replacements = {
              "> **Implementation audit checkpoint:**": "> **Implementation audit checkpoint:** `1eda95ae42a5d780b0257722cc5affb170d38ab0` (2026-08-14)",
              "| A2 Service |": "| A2 Service | 4 | Native/core foundations exist; UI/parity work remains. |",
              "| A3 Ported |": "| A3 Ported | 1 | User-facing implementation exists; more evidence required. |",
              "| A4 Auto-verified |": "| A4 Auto-verified | 106 | Automated slice is green; human/live acceptance still required. |",
              "| PW-08 |": "| PW-08 | Notification preferences, sounds and native test notification | `SettingsService` + Desktop notification service | Notifications settings | A4 Auto-verified | PR #219 exact head `f939be0a` completes the machine-verifiable notification path: preferences and completion sounds feed a modern bounded WinRT toast using stable AUMID `xdCloudy.HermesLocal`, with registered `hermes://` protocol actions routed into typed Dioxus activation and the legacy balloon retained only as fallback. Rust validation `31819356884`, packaging `31819356887`, install lifecycle `31819356996`, footprint `31819357019` and native-client boundary `31819356940` all passed before merge as `1eda95ae`. | Toggle each kind, preview every sound, restart, trigger real notifications and verify packaged Windows action/focus/duplicate behavior. | ⬜ |",
              "| DI-01 |": "| DI-01 | Native notifications and action routing | `NotificationPlatform` | session/settings | A4 Auto-verified | PR #219 replaces the legacy-only balloon path with bounded WinRT toasts, stamps the installer Start-menu shortcut with stable AppUserModelID `xdCloudy.HermesLocal`, and routes toast body/button protocol activation through the typed Dioxus router. Exact-head Rust, packaging, install, footprint and native-client gates passed before merge as `1eda95ae`; packaged experiential behavior remains A5 evidence. | Trigger each notification kind in packaged app; click actions, test duplicates/focus/background and Windows notification settings. | ⬜ |",
              "| DI-05 |": "| DI-05 | Deep links and protocol registration | native deep-link service | routed surfaces | A4 Auto-verified | PR #219 completes bounded cold/running `hermes://` delivery: validated links are atomically queued per activation, malformed/oversized/control-character payloads are rejected, route/session destinations are allowlisted, and blueprint links insert a reviewable composer command rather than auto-executing. The per-user protocol registration and installer identity pass the exact-head Rust/distribution/native-client gates before merge as `1eda95ae`. | Register/use protocol from cold/running app, malformed payloads, duplicate instance and route/state handling. | ⬜ |",
          }

          seen = {key: 0 for key in replacements}
          output = []
          for line in lines:
              matched = False
              for prefix, replacement in replacements.items():
                  if line.startswith(prefix):
                      seen[prefix] += 1
                      output.append(replacement)
                      matched = True
                      break
              if not matched:
                  output.append(line)
          bad = {key: count for key, count in seen.items() if count != 1}
          if bad:
              raise SystemExit(f"unexpected matrix anchors: {bad}")
          text = "\n".join(output) + "\n"

          anchor = "PR #189 exact implementation head `cbeb44c4` closes the machine-verifiable"
          if text.count(anchor) != 1:
              raise SystemExit(f"PR #189 narrative anchor count={text.count(anchor)}")
          paragraph = (
              "PR #219 exact head `f939be0a` completes the machine-verifiable notification and\n"
              "deep-link slice. It adds bounded WinRT actionable toasts with stable AUMID\n"
              "`xdCloudy.HermesLocal`, installer shortcut identity, atomic cold/running\n"
              "`hermes://` activation delivery, allowlisted typed Dioxus routing and reviewable\n"
              "blueprint composer prefill. Rust validation `31819356884`, Windows packaging\n"
              "`31819356887`, install lifecycle `31819356996`, footprint `31819357019` and\n"
              "native-client boundary `31819356940` all passed before merge as `1eda95ae`; SSH\n"
              "interoperability was the expected skip. `PW-08`, `DI-01` and `DI-05` are therefore\n"
              "A4. Packaged notification/action/focus comparison remains A5 evidence.\n\n"
          )
          text = text.replace(anchor, paragraph + anchor)
          path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DIOXUS_MIGRATION_MATRIX.md
          git diff --cached --check
          git commit -m "docs: promote PR 219 notification and deep-link rows to A4"
          git push origin HEAD:agent/matrix-a4-219-220
