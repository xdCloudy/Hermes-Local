name: GT-05 Review discard staging

on:
  push:
    branches:
      - goal-loop/gt05-review-discard
    paths:
      - .github/workflows/gt05-review-discard.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal-loop/gt05-review-discard
          fetch-depth: 0

      - name: Apply GT-05 typed discard slice
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          core = "crates/hermes-core/src/lib.rs"
          replace_once(core, '''pub trait GitService: Send + Sync {
              fn status(&self, repository: &Path) -> ServiceFuture<'_, GitStatus>;
              fn diff(&self, repository: &Path, relative: &Path) -> ServiceFuture<'_, String>;
              fn diff_staged(&self, _repository: &Path, _relative: &Path) -> ServiceFuture<'_, String> {
                  Box::pin(async move {
                      Err(ServiceError::Unavailable(
                          "staged Git diff is unavailable on this platform".into(),
                      ))
                  })
              }
              fn stage(&self, repository: &Path, relative: &Path) -> ServiceFuture<'_, ()>;
              fn unstage(&self, repository: &Path, relative: &Path) -> ServiceFuture<'_, ()>;
          }
          ''', '''pub trait GitService: Send + Sync {
              fn status(&self, repository: &Path) -> ServiceFuture<'_, GitStatus>;
              fn diff(&self, repository: &Path, relative: &Path) -> ServiceFuture<'_, String>;
              fn diff_staged(&self, _repository: &Path, _relative: &Path) -> ServiceFuture<'_, String> {
                  Box::pin(async move {
                      Err(ServiceError::Unavailable(
                          "staged Git diff is unavailable on this platform".into(),
                      ))
                  })
              }
              fn stage(&self, repository: &Path, relative: &Path) -> ServiceFuture<'_, ()>;
              fn unstage(&self, repository: &Path, relative: &Path) -> ServiceFuture<'_, ()>;
          }

          pub trait GitDiscardService: Send + Sync {
              fn discard_path(&self, repository: &Path, relative: &Path) -> ServiceFuture<'_, ()>;
              fn discard_all(&self, repository: &Path) -> ServiceFuture<'_, ()>;
          }

          #[derive(Clone, Copy, Debug, Default)]
          pub struct UnavailableGitDiscardService;

          impl GitDiscardService for UnavailableGitDiscardService {
              fn discard_path(&self, _repository: &Path, _relative: &Path) -> ServiceFuture<'_, ()> {
                  Box::pin(async move {
                      Err(ServiceError::Unavailable(
                          "Git discard is unavailable on this platform".into(),
                      ))
                  })
              }

              fn discard_all(&self, _repository: &Path) -> ServiceFuture<'_, ()> {
                  Box::pin(async move {
                      Err(ServiceError::Unavailable(
                          "Git discard is unavailable on this platform".into(),
                      ))
                  })
              }
          }
          ''')
          replace_once(core, '''    pub git: Arc<dyn GitService>,
              pub terminal: Arc<dyn TerminalService>,''', '''    pub git: Arc<dyn GitService>,
              pub git_discard: Arc<dyn GitDiscardService>,
              pub terminal: Arc<dyn TerminalService>,''')

          desktop = "crates/hermes-desktop/src/lib.rs"
          replace_once(desktop, '''    ServiceFuture, ServiceResult, SessionService, SettingsService, TerminalService, TrustService,
              UnavailablePreviewService, UpdateService, validate_identifier, validate_relative_path,
          };''', '''    ServiceFuture, ServiceResult, SessionService, SettingsService, TerminalService, TrustService,
              UnavailableGitDiscardService, UnavailablePreviewService, UpdateService, validate_identifier,
              validate_relative_path,
          };''')
          replace_once(desktop, '''                git: Arc::new(DesktopGit),
                          terminal: Arc::new(DesktopTerminals::default()),''', '''                git: Arc::new(DesktopGit),
                          git_discard: Arc::new(UnavailableGitDiscardService),
                          terminal: Arc::new(DesktopTerminals::default()),''')

          discard = "apps/desktop/src/git_discard_service.rs"
          replace_once(discard, '#![allow(dead_code)] // GT-05 service foundation; review confirmation/UI is a later stage.\n\n', '')
          replace_once(discard, '''use std::{
              path::{Component, Path, PathBuf},
              process::{Command, Output},
          };
          ''', '''use std::{
              path::{Component, Path, PathBuf},
              process::{Command, Output},
              sync::Arc,
          };

          use hermes_core::{
              AppServices, GitDiscardService as GitDiscardServiceContract, ServiceError, ServiceFuture,
          };
          ''')
          replace_once(discard, '''#[derive(Clone, Copy, Debug, Default)]
          pub struct GitDiscardService;

          impl GitDiscardService {''', '''#[derive(Clone, Copy, Debug, Default)]
          pub struct GitDiscardService;

          pub fn install(services: &mut AppServices) {
              services.git_discard = Arc::new(GitDiscardService);
          }

          impl GitDiscardServiceContract for GitDiscardService {
              fn discard_path(&self, repository: &Path, relative: &Path) -> ServiceFuture<'_, ()> {
                  let repository = repository.to_owned();
                  let relative = relative.to_owned();
                  Box::pin(async move {
                      GitDiscardService
                          .discard_path(&repository, &relative)
                          .map_err(service_error)
                  })
              }

              fn discard_all(&self, repository: &Path) -> ServiceFuture<'_, ()> {
                  let repository = repository.to_owned();
                  Box::pin(async move {
                      GitDiscardService
                          .discard_all(&repository)
                          .map_err(service_error)
                  })
              }
          }

          fn service_error(error: String) -> ServiceError {
              if error.contains("cannot escape") || error.contains("metadata cannot") {
                  ServiceError::PermissionDenied(error)
              } else if error.contains("must be")
                  || error.contains("requires a repository")
                  || error.contains("NUL character")
                  || error.starts_with("Use discard_all")
              {
                  ServiceError::InvalidInput(error)
              } else {
                  ServiceError::Platform(error)
              }
          }

          impl GitDiscardService {''')

          main = "apps/desktop/src/main.rs"
          replace_once(main, '''    notification_service::install(&mut native.services);
              preview_service::install(&mut native.services);''', '''    notification_service::install(&mut native.services);
              git_discard_service::install(&mut native.services);
              preview_service::install(&mut native.services);''')

          review = "crates/hermes-ui/src/review.rs"
          replace_once(review, '''fn changes(status: &GitStatus) -> Vec<GitChange> {
              if !status.entries.is_empty() {
                  return status.entries.clone();
              }
              status
                  .changed
                  .iter()
                  .map(|path| GitChange {
                      path: path.clone(),
                      unstaged: true,
                      ..GitChange::default()
                  })
                  .collect()
          }

          #[component]''', '''fn changes(status: &GitStatus) -> Vec<GitChange> {
              if !status.entries.is_empty() {
                  return status.entries.clone();
              }
              status
                  .changed
                  .iter()
                  .map(|path| GitChange {
                      path: path.clone(),
                      unstaged: true,
                      ..GitChange::default()
                  })
                  .collect()
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          enum DiscardTarget {
              Path(String),
              All,
          }

          #[component]''')
          replace_once(review, '''    let mut mutation_busy = use_signal(|| false);
              let mut error = use_signal(|| None::<String>);''', '''    let mut mutation_busy = use_signal(|| false);
              let mut discard_target = use_signal(|| None::<DiscardTarget>);
              let mut error = use_signal(|| None::<String>);''')
          replace_once(review, '''                            button {
                                  class: "icon-button",
                                  title: "Refresh Git status",
                                  aria_label: "Refresh Git status",
                                  disabled: status_loading() || mutation_busy(),
                                  onclick: move |_| refresh.set(refresh() + 1),
                                  "↻"
                              }
                          }''', '''                            if !rows.is_empty() {
                                  button {
                                      class: "button",
                                      disabled: mutation_busy(),
                                      onclick: move |_| discard_target.set(Some(DiscardTarget::All)),
                                      "Discard all"
                                  }
                              }
                              button {
                                  class: "icon-button",
                                  title: "Refresh Git status",
                                  aria_label: "Refresh Git status",
                                  disabled: status_loading() || mutation_busy(),
                                  onclick: move |_| refresh.set(refresh() + 1),
                                  "↻"
                              }
                          }''')
          replace_once(review, '''                                    let selected_change = changes(&status())
                                          .into_iter()
                                          .find(|change| change.path == path);''', '''                                    let discard_path = path.clone();
                                      let selected_change = changes(&status())
                                          .into_iter()
                                          .find(|change| change.path == path);''')
          replace_once(review, '''                                        if selected_change.as_ref().is_some_and(|change| change.staged) {
                                              button {
                                                  class: "button",
                                                  disabled: staged_view(),
                                                  onclick: move |_| staged_view.set(true),
                                                  "Staged"
                                              }
                                          }
                                      }''', '''                                        if selected_change.as_ref().is_some_and(|change| change.staged) {
                                              button {
                                                  class: "button",
                                                  disabled: staged_view(),
                                                  onclick: move |_| staged_view.set(true),
                                                  "Staged"
                                              }
                                          }
                                          button {
                                              class: "button",
                                              disabled: mutation_busy(),
                                              onclick: move |_| discard_target.set(Some(DiscardTarget::Path(discard_path.clone()))),
                                              "Discard file"
                                          }
                                      }''')
          replace_once(review, '''                    }
                  }
              }
          }
          }
          }''', '''                    }
                  }
                  if let Some(target) = discard_target() {
                      {
                          let message = match &target {
                              DiscardTarget::Path(path) => format!(
                                  "Discard every staged and unstaged change for {path}, including a non-ignored untracked file if present?"
                              ),
                              DiscardTarget::All => "Discard every staged and unstaged change in this repository and remove non-ignored untracked files?".to_owned(),
                          };
                          let action_target = target.clone();
                          let discard_root = root.clone().unwrap_or_default();
                          let discard_service = services.git_discard.clone();
                          rsx! {
                              div {
                                  role: "dialog",
                                  "aria-modal": "true",
                                  style: "position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.58);display:grid;place-items:center;padding:1rem;",
                                  div {
                                      class: "settings-card",
                                      style: "width:min(32rem,100%);display:grid;gap:.75rem;box-shadow:0 1.25rem 4rem rgba(0,0,0,.45);",
                                      strong { "Discard changes?" }
                                      p { style: "margin:0;line-height:1.5;", "{message}" }
                                      p { class: "muted", style: "margin:0;", "This cannot be undone. Ignored files are preserved." }
                                      div { style: "display:flex;justify-content:flex-end;gap:.5rem;",
                                          button {
                                              class: "button",
                                              disabled: mutation_busy(),
                                              onclick: move |_| discard_target.set(None),
                                              "Cancel"
                                          }
                                          button {
                                              class: "button",
                                              disabled: mutation_busy(),
                                              onclick: move |_| {
                                                  let service = discard_service.clone();
                                                  let repo = discard_root.clone();
                                                  let target = action_target.clone();
                                                  mutation_busy.set(true);
                                                  error.set(None);
                                                  spawn(async move {
                                                      let result = match target {
                                                          DiscardTarget::Path(path) => service
                                                              .discard_path(Path::new(&repo), Path::new(&path))
                                                              .await,
                                                          DiscardTarget::All => service.discard_all(Path::new(&repo)).await,
                                                      };
                                                      match result {
                                                          Ok(()) => {
                                                              selected_path.set(None);
                                                              staged_view.set(false);
                                                              diff.set(String::new());
                                                              discard_target.set(None);
                                                              refresh.set(refresh() + 1);
                                                          }
                                                          Err(next_error) => {
                                                              error.set(Some(next_error.to_string()));
                                                          }
                                                      }
                                                      mutation_busy.set(false);
                                                  });
                                              },
                                              "Discard changes"
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          }
          }''')

          contract = Path("crates/hermes-desktop/tests/git_discard_ui_contract.rs")
          contract.write_text(r'''#[test]
          fn review_discard_is_typed_confirmed_and_platform_neutral() {
              let review = include_str!(concat!(env!("CARGO_MANIFEST_DIR"), "/../hermes-ui/src/review.rs"));
              let main = include_str!(concat!(env!("CARGO_MANIFEST_DIR"), "/../../apps/desktop/src/main.rs"));
              let native = include_str!(concat!(env!("CARGO_MANIFEST_DIR"), "/../../apps/desktop/src/git_discard_service.rs"));

              assert!(review.contains("services.git_discard.clone()"));
              assert!(review.contains("DiscardTarget::Path"));
              assert!(review.contains("DiscardTarget::All"));
              assert!(review.contains("Discard file"));
              assert!(review.contains("Discard all"));
              assert!(review.contains("Discard changes?"));
              assert!(review.contains("This cannot be undone. Ignored files are preserved."));
              assert!(!review.contains("Command::new"));
              assert!(!review.contains("std::process"));
              assert!(main.contains("git_discard_service::install(&mut native.services)"));
              assert!(native.contains("services.git_discard = Arc::new(GitDiscardService)"));
          }
          ''', encoding="utf-8")
          '@ | Set-Content -Encoding utf8 scripts/ci/gt05_stage_patch.py
          python scripts/ci/gt05_stage_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate GT-05 architecture runtime and UI contracts
        shell: pwsh
        run: |
          python scripts/ci/check_dioxus_rust_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_discard_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_review --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_discard_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated GT-05 product slice
        shell: pwsh
        run: |
          Remove-Item .github/workflows/gt05-review-discard.yml
          Remove-Item scripts/ci/gt05_stage_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(review): add confirmed Git discard actions"
          git push origin HEAD:goal-loop/gt05-review-discard
