name: Integrate validated PF-08

on:
  push:
    branches:
      - goal-loop/integration-review-preview
    paths:
      - .github/workflows/integrate-pf08.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal-loop/integration-review-preview
          fetch-depth: 0

      - name: Merge validated PF-08 with newer PF-07 and GT-04 work
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin goal-loop/pf08-safe-preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout origin/goal-loop/pf08-safe-preview -- apps/desktop/src/preview_normalization.rs apps/desktop/src/preview_service.rs crates/hermes-desktop/tests/preview_ui_contract.rs crates/hermes-ui/src/files.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/integrate_pf08_merge.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add apps/desktop/src/main.rs apps/desktop/src/preview_normalization.rs apps/desktop/src/preview_service.rs crates/hermes-core/src/lib.rs crates/hermes-desktop/src/lib.rs crates/hermes-desktop/tests/preview_ui_contract.rs crates/hermes-ui/src/files.rs
          git commit -m "feat(preview): wire safe native previews into Dioxus"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate combined PF-07 PF-08 GT-04 tree
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/check_dioxus_rust_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local preview_normalization --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local preview_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test preview_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test files_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_review --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove temporary PF-08 integration helpers
        shell: pwsh
        run: |
          Remove-Item .github/workflows/integrate-pf08.yml
          Remove-Item scripts/ci/integrate_pf08_merge.py
          git add .github/workflows/integrate-pf08.yml scripts/ci/integrate_pf08_merge.py
          git commit -m "chore(ci): remove PF-08 integration helpers"
          git push origin HEAD:goal-loop/integration-review-preview
