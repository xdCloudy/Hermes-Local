name: Agent CH-11 transparent parity validation

on:
  push:
    branches:
      - agent/chat-attachments-a4
    paths:
      - .github/workflows/agent-ch11-parity-public-patch.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and apply pinned transparent patch
        shell: pwsh
        env:
          PATCH_BLOB: ab210595ebcefdc90820d018c5bb92bb79e71ba4
        run: |
          @'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          url = f"https://api.github.com/repos/xdCloudy/Hermes-Local/git/blobs/{os.environ['PATCH_BLOB']}"
          request = urllib.request.Request(
              url,
              headers={"Accept": "application/vnd.github+json", "User-Agent": "Hermes-CH11-validator"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          pathlib.Path("ch11.patch").write_bytes(base64.b64decode(payload["content"]))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check ch11.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ch11.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format Rust
        run: cargo fmt --all
      - name: Guard Rust/Dioxus architecture
        run: python scripts/ci/check_dioxus_rust_architecture.py
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Check shared UI for WebAssembly
        run: cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
      - name: Run deterministic Rust tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Verify patch whitespace
        shell: pwsh
        run: git diff --check
      - name: Materialize validated source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/hermes-core/src/lib.rs crates/hermes-desktop/src/lib.rs crates/hermes-ui/src/chat.rs
          git commit -m "feat: complete CH-11 attachment queue and remote parity"
          git push
