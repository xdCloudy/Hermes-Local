name: Issue 50 canonical patch

on:
  pull_request:
    paths:
      - '.github/workflows/issue-50-generate-patch.yml'
      - 'scripts/ci/issue50_apply.py'
      - 'source/hermes-launcher/patches/**'
      - 'VERSION.json'

permissions:
  contents: read

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct pinned integration and apply issue 50 change
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -LiteralPath '.\VERSION.json' | ConvertFrom-Json
          $source = Join-Path $env:RUNNER_TEMP 'issue-50-hermes-agent'
          $patches = Get-ChildItem -LiteralPath '.\source\hermes-launcher\patches' -Filter '*.patch' -File |
            Sort-Object Name |
            ForEach-Object FullName

          git clone --no-checkout $manifest.sources.hermesAgent.repository $source
          git -C $source checkout --detach $manifest.sources.hermesAgent.commit
          git -C $source config user.name 'Hermes Local Integration'
          git -C $source config user.email 'hermes-local-ci@localhost'
          git -C $source am --3way --committer-date-is-author-date @patches

          $tree = (git -C $source rev-parse 'HEAD^{tree}').Trim()
          if ($tree -ne [string]$manifest.sources.hermesAgent.integrationTree) {
            throw "Pinned integration tree mismatch: expected $($manifest.sources.hermesAgent.integrationTree), got $tree"
          }

          $diffPath = Join-Path $env:RUNNER_TEMP 'issue-50.diff'
          python '.\scripts\ci\issue50_apply.py' $diffPath
          git -C $source apply --check --whitespace=error-all $diffPath
          git -C $source apply --whitespace=error-all $diffPath
          git -C $source diff --check

          "ISSUE50_SOURCE=$source" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Install Python dependencies and run project registry tests
        shell: pwsh
        run: |
          $source = $env:ISSUE50_SOURCE
          python -m pip install --disable-pip-version-check uv==0.11.32
          Push-Location $source
          try {
            if (Test-Path -LiteralPath '.\uv.lock') {
              uv sync --extra all --extra dev --frozen
            } else {
              uv sync --extra all --extra dev
            }
            uv run python -m pytest `
              tests/hermes_cli/test_projects_db.py `
              tests/tui_gateway/test_projects_rpc.py `
              -q
          } finally {
            Pop-Location
          }

      - name: Install Desktop dependencies and validate registry client
        shell: pwsh
        run: |
          $source = $env:ISSUE50_SOURCE
          Push-Location $source
          try {
            npx.cmd --yes npm@12.0.0 ci --no-audit --fund=false
            npx.cmd --yes npm@12.0.0 run typecheck --workspace apps/desktop
            npx.cmd --yes npm@12.0.0 run lint --workspace apps/desktop
            $vitest = Join-Path $source 'node_modules\.bin\vitest.cmd'
            Push-Location (Join-Path $source 'apps\desktop')
            try {
              & $vitest run src/store/projects.test.ts
              if ($LASTEXITCODE -ne 0) { throw "Vitest failed with exit code $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
          } finally {
            Pop-Location
          }

      - name: Export canonical patch and integration identity
        shell: pwsh
        run: |
          $source = $env:ISSUE50_SOURCE
          $out = '.\artifacts\issue-50-patch'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Push-Location $source
          try {
            git add --all
            $env:GIT_AUTHOR_DATE = '2026-08-03T07:30:00+01:00'
            $env:GIT_COMMITTER_DATE = $env:GIT_AUTHOR_DATE
            git commit -m 'feat: add stable project identity and path recovery'
            git format-patch -1 --stdout HEAD | Set-Content `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "$out\0034-feat-add-stable-project-identity-and-path-recovery.patch") `
              -Encoding utf8NoBOM
            git rev-parse HEAD | Set-Content `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "$out\integration-commit.txt") `
              -Encoding ascii
            git rev-parse 'HEAD^{tree}' | Set-Content `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "$out\integration-tree.txt") `
              -Encoding ascii
            git show --stat --oneline HEAD | Set-Content `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "$out\summary.txt") `
              -Encoding utf8NoBOM
          } finally {
            Pop-Location
          }

      - name: Upload canonical patch
        uses: actions/upload-artifact@v4
        with:
          name: issue-50-canonical-patch
          path: artifacts/issue-50-patch
          retention-days: 2
