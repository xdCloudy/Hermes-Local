name: Issue 84 normalize payload

on:
  pull_request:
    paths:
      - '.github/workflows/issue-84-normalize-payload.yml'
      - 'scripts/ci/issue84-desktop-patch-v3/**'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          root = Path('scripts/ci/issue84-desktop-patch-v3')
          parts = sorted(root.glob('part-*.txt'))
          encoded = ''.join(''.join(path.read_text(encoding='ascii').split()) for path in parts)
          assert hashlib.sha256((encoded + '\n').encode('ascii')).hexdigest() == '7b81b81956f725986ce669d8e959b689a6c1e9cfc7bb0c46cd8d883ee6d05758'
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '1450e46b805d642be20509783ecc20e787f24a09a8cc1ac38984f3a662885473'
          offset = 0
          for path in parts:
              length = 1800 if path.name != 'part-06.txt' else len(encoded) - offset
              path.write_text(encoded[offset:offset + length], encoding='ascii')
              offset += length
          assert offset == len(encoded)
          PY
          git config user.name 'Hermes Local CI'
          git config user.email 'hermes-local-ci@localhost'
          git add scripts/ci/issue84-desktop-patch-v3
          if ! git diff --cached --quiet; then
            git commit -m 'ci: normalize issue 84 patch payload'
            git push origin HEAD:${{ github.head_ref }}
          fi
