name: Finalize Workspace Git and terminal tranche

on:
  push:
    branches:
      - goal-loop/workspace-git-tranche
    paths:
      - .github/workflows/workspace-terminal-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal-loop/workspace-git-tranche
          fetch-depth: 0

      - name: Layer validated TM-01 terminal slice
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin goal-loop/tm01-terminal-lifecycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --binary --output=tm01-disjoint.patch d161776102c9e7e05ee8ec7828fba4d0020882a2..62e2fb5970e0614596ef15e0c04ced7974172f02 -- `
            crates/hermes-desktop/src/lib.rs `
            crates/hermes-desktop/tests/terminal_lifecycle.rs `
            crates/hermes-ui/src/terminal.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --3way --index tm01-disjoint.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item tm01-disjoint.patch

          python scripts/ci/workspace_terminal_merge_shared.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -A
          git commit -m "feat(terminal): wire project-scoped PTY lifecycle"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff d161776102c9e7e05ee8ec7828fba4d0020882a2..HEAD --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate complete Workspace and terminal tree
        shell: pwsh
        run: |
          python scripts/ci/check_dioxus_rust_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo test -p hermes-desktop --test git_status_parity --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_ship_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_review --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_discard_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_ship_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_branch_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_worktree_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_source_control_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_repo_scan_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_repo_discovery_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test terminal_lifecycle --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo clippy --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish clean final branch
        shell: pwsh
        run: |
          Remove-Item .github/workflows/workspace-terminal-finalize.yml
          Remove-Item scripts/ci/workspace_terminal_merge_shared.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): remove Workspace terminal integration helpers"
          git push origin HEAD:goal-loop/workspace-git-tranche
