name: Temporary reconcile DI-22 A4

on:
  push:
    branches:
      - agent/matrix-di22-a4
    paths:
      - ".github/workflows/tmp-matrix-di22-a4.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/matrix-di22-a4
      - name: Reconcile DI-22 evidence
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/DIOXUS_MIGRATION_MATRIX.md")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()

          replacements = {
              "> **Implementation audit checkpoint:**": "> **Implementation audit checkpoint:** `a0f5de911d2cf485a4291453631f3f4b530dad38` (2026-08-14)",
              "| A2 Service |": "| A2 Service | 3 | Native/core foundations exist; UI/parity work remains. |",
              "| A4 Auto-verified |": "| A4 Auto-verified | 107 | Automated slice is green; human/live acceptance still required. |",
              "| DI-22 |": "| DI-22 | Performance and footprint acceptance | release/QA | whole product | A4 Auto-verified | PR #220 exact head `935d20ef` upgrades the Windows footprint gate from artifact-size-only accounting to a real packaged-style Desktop runtime probe. Exact-head run `31827764097` observed a real top-level window in 1.11 s, 313.38 MiB aggregate process-tree working set, 2.7% normalized idle CPU and 7 processes; the optimized EXE/portable measured 22.95/7.45 MiB. All runtime/size budgets and focused tooling tests passed before merge as `a0f5de91`. Same-host legacy-vs-Rust experiential comparison remains A5 evidence. | Measure packaged cold/warm start, first usable window, idle/active RAM/CPU, process count and disk size on same host; compare against OG baseline and investigate regressions. | ⬜ |",
          }

          seen = {key: 0 for key in replacements}
          output = []
          for line in lines:
              matched = False
              for prefix, replacement in replacements.items():
                  if line.startswith(prefix):
                      seen[prefix] += 1
                      output.append(replacement)
                      matched = True
                      break
              if not matched:
                  output.append(line)
          bad = {key: count for key, count in seen.items() if count != 1}
          if bad:
              raise SystemExit(f"unexpected matrix anchors: {bad}")
          text = "\n".join(output) + "\n"

          anchor = "PR #219 exact head `f939be0a` completes the machine-verifiable notification and"
          if text.count(anchor) != 1:
              raise SystemExit(f"PR #219 narrative anchor count={text.count(anchor)}")
          paragraph = (
              "PR #220 exact head `935d20ef` upgrades the Windows footprint gate from\n"
              "artifact-size-only accounting to a real packaged-style Desktop runtime probe.\n"
              "Exact-head run `31827764097` observed a top-level window in 1.11 seconds,\n"
              "313.38 MiB aggregate process-tree working set, 2.7% normalized idle CPU and\n"
              "7 processes; the optimized EXE and portable ZIP measured 22.95 MiB and\n"
              "7.45 MiB. All configured runtime/size budgets and focused tooling tests\n"
              "passed before merge as `a0f5de91`, so `DI-22` is A4. Same-host\n"
              "legacy-vs-Rust experiential comparison remains A5 evidence.\n\n"
          )
          text = text.replace(anchor, paragraph + anchor)
          path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DIOXUS_MIGRATION_MATRIX.md
          git diff --cached --check
          git commit -m "docs: promote DI-22 runtime footprint to A4"
          git push origin HEAD:agent/matrix-di22-a4
