name: Agent chat core cleanup

on:
  push:
    branches:
      - agent/chat-core-a4
    paths:
      - "agent-patches/chat-core-cleanup.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: python agent-patches/chat-core-cleanup.py
      - run: cargo fmt --all
      - run: git diff --check
      - shell: bash
        run: |
          rm -f agent-patches/chat-core-cleanup.py
          rm -f .github/workflows/agent-chat-core-cleanup.yml
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete chat surface extraction imports"
          git push origin HEAD:${{ github.ref_name }}
