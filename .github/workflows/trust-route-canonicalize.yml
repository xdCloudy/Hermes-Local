name: Trust route canonicalize

on:
  pull_request:
    paths:
      - '.github/workflows/trust-route-canonicalize.yml'
      - 'source/hermes-launcher/patches/0087-feat-desktop-route-Trust-Centre.patch'

permissions:
  contents: read

jobs:
  canonicalize:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect exact route preimage
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -LiteralPath '.\VERSION.json' | ConvertFrom-Json
          $candidate = [string]$manifest.sources.hermesAgent.commit
          $probe = Join-Path $env:RUNNER_TEMP 'hermes-trust-route-preimage'
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          & git -C $probe init --quiet
          & git -C $probe remote add origin https://github.com/NousResearch/hermes-agent.git
          & git -C $probe fetch --quiet --depth=1 origin $candidate
          if ($LASTEXITCODE -ne 0) { throw 'fetch failed' }
          & git -C $probe checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'checkout failed' }
          & git -C $probe config user.email 'ci@local.invalid'
          & git -C $probe config user.name 'Hermes Local CI'

          $patches = Get-ChildItem -LiteralPath '.\source\hermes-launcher\patches' -Filter '*.patch' -File |
            Sort-Object Name |
            Where-Object { $_.Name -lt '0087-feat-desktop-route-Trust-Centre.patch' }
          & git -C $probe am --3way --committer-date-is-author-date @($patches.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'preimage reconstruction failed' }

          $queries = @(
            @{ Path = 'apps\desktop\src\app\routes.ts'; Pattern = 'SECURITY_ROUTE|LOGS_ROUTE|ABOUT_ROUTE|benchmarks|security|logs|about' },
            @{ Path = 'apps\desktop\src\app\chat\sidebar\index.tsx'; Pattern = 'SECURITY_ROUTE|LOGS_ROUTE|TOOLS_ROUTE|TUI_ROUTE|id: .security.|id: .logs.' },
            @{ Path = 'apps\desktop\src\app\contrib\surfaces.tsx'; Pattern = 'path=.security.|path=.logs.|LocalWorkstationView' },
            @{ Path = 'apps\desktop\src\app\local-workstation\index.tsx'; Pattern = 'TaskCentre|AboutHub|security:|sessions:|section === .about.' }
          )
          foreach ($query in $queries) {
            $path = Join-Path $probe $query.Path
            Write-Host "=== $($query.Path) ==="
            & git -C $probe hash-object $query.Path
            Select-String -LiteralPath $path -Pattern $query.Pattern -Context 5,5 |
              ForEach-Object { Write-Host $_.ToString() }
          }
