name: Agent chat queue patch

on:
  push:
    branches:
      - agent/chat-queue-a4
    paths:
      - "agent-patches/chat-queue.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply bounded source transform
        run: python agent-patches/chat-queue.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Verify transformed workspace
        shell: bash
        run: |
          git diff --check
          grep -q 'pub struct PromptQueueCoordinator' crates/hermes-core/src/lib.rs
          grep -q 'ChatRuntimeProvider' crates/hermes-ui/src/lib.rs

      - name: Remove one-shot patch authority
        shell: bash
        run: |
          rm -f agent-patches/chat-queue.py
          rm -f .github/workflows/agent-chat-queue-patch.yml

      - name: Commit transformed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add route-persistent prompt queue state machine"
          git push origin HEAD:${{ github.ref_name }}
