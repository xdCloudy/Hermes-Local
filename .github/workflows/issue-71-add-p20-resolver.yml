def resolve_dashboard_patch(source: Path, conflicts: list[str]) -> bool:
    path = "apps/desktop/electron/main.ts"
    if conflicts != [path]:
        return False
    target = source / path
    text = target.read_text(encoding="utf-8")
    marker = f"""<<<<<<< HEAD
    wakeIndicatorController.close()
=======
    hermesLocalDashboardView.handleWindowClosed(createdMainWindow)
>>>>>>> {DASHBOARD_SUBJECT}
"""
    replacement = """    wakeIndicatorController.close()
    hermesLocalDashboardView.handleWindowClosed(createdMainWindow)
"""
    if marker not in text:
        return False
    text = text.replace(marker, replacement, 1)
    if "<<<<<<<" in text or ">>>>>>>" in text:
        raise RuntimeError("dashboard main-process conflict markers remain")
    target.write_text(text, encoding="utf-8")
    run(["git", "add", "--", path], cwd=source)
    run(["git", "am", "--continue"], cwd=source, timeout=600)
    return True


def capture_conflict'''
          if anchor not in text:
              raise SystemExit('resolver insertion point not found')
          text = text.replace(anchor, resolver, 1)
          call_anchor = '''            elif resolve_projectless_patch(source, conflicts):
                applied.append({"order": order, "patch": patch.name, "application": "three-way-projectless-rebased"})
                recovered = True
            if recovered:'''
          call_replacement = '''            elif resolve_projectless_patch(source, conflicts):
                applied.append({"order": order, "patch": patch.name, "application": "three-way-projectless-rebased"})
                recovered = True
            elif resolve_dashboard_patch(source, conflicts):
                applied.append({"order": order, "patch": patch.name, "application": "three-way-dashboard-rebased"})
                recovered = True
            if recovered:'''
          if call_anchor not in text:
              raise SystemExit('resolver call insertion point not found')
          path.write_text(text.replace(call_anchor, call_replacement, 1), encoding='utf-8')
          PY
