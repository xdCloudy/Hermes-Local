name: PR 189 Cargo lock refresh

on:
  push:
    branches:
      - agent/terminal-ssh-all-a4
    paths:
      - apps/desktop/Cargo.toml
      - .github/workflows/pr189-refresh-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: windows-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/terminal-ssh-all-a4
          fetch-depth: 0

      - name: Resolve workspace lockfile from manifests
        shell: pwsh
        run: cargo metadata --format-version 1 --no-deps | Out-Null

      - name: Commit Cargo.lock only when Cargo changed it
        shell: pwsh
        run: |
          git diff --exit-code -- . ':!Cargo.lock'
          if (git diff --quiet -- Cargo.lock) {
            Write-Host 'Cargo.lock already matches the manifests.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build: sync Cargo lock for SSH terminal'
          git push origin HEAD:agent/terminal-ssh-all-a4
