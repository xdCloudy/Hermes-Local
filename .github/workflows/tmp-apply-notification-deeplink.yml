name: Temporary apply notification and deep-link tranche

on:
  push:
    branches:
      - agent/notifications-deeplink

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notifications-deeplink
      - name: Apply guarded source edits
        run: python scripts/ci/tmp_apply_notification_deeplink.py
      - name: Commit source edits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add apps/desktop/src/main.rs crates/hermes-ui/src/lib.rs crates/hermes-ui/src/chat/legacy.rs scripts/ci/rust_windows_package.py tests/test_rust_windows_package.py
          git diff --cached --exit-code && { echo 'No source edits produced'; exit 1; } || true
          git commit -m "feat(di): compose actionable notifications and deep links"
          git push origin HEAD:agent/notifications-deeplink
