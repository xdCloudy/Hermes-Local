name: Temporary Cloud Clippy repair

on:
  push:
    branches:
      - agent/cloud-connection
    paths:
      - ".github/workflows/tmp-clippy-diagnostics.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloud-connection
      - name: Apply minimal Cloud discovery type repair
        shell: pwsh
        run: |
          $path = "apps/desktop/src/cloud_bridge.rs"
          $content = Get-Content -LiteralPath $path -Raw
          $old = @'
          fn parse_discovery(
              status: u16,
              body: &Value,
          ) -> Result<(Vec<CloudOrg>, Vec<CloudAgent>, Option<String>), String> {
          '@
          $new = @'
          type CloudDiscovery = (Vec<CloudOrg>, Vec<CloudAgent>, Option<String>);

          fn parse_discovery(
              status: u16,
              body: &Value,
          ) -> Result<CloudDiscovery, String> {
          '@
          if (-not $content.Contains($old)) {
            throw "Expected parse_discovery signature was not found"
          }
          $content = $content.Replace($old, $new)
          Set-Content -LiteralPath $path -Value $content -Encoding utf8 -NoNewline
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath ".github/tmp-clippy-diagnostics.txt" -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath ".github/workflows/tmp-clippy-diagnostics.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cn-06): factor Cloud discovery result type"
          git push origin HEAD:agent/cloud-connection
