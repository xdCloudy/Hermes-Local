name: Issue 71 validation

on:
  pull_request:
    paths:
      - '.github/workflows/issue-71-validation.yml'
      - '.github/issue71-fix.patch.b64'
      - 'scripts/ci/compatibility.py'
      - 'tests/test_compatibility.py'
      - 'Update-Hermes-Agent.ps1'

permissions:
  contents: write

jobs:
  apply-fix:
    name: Apply issue 71 fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply tested patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode '.github/issue71-fix.patch.b64' > "$RUNNER_TEMP/issue71.patch"
          git apply --check "$RUNNER_TEMP/issue71.patch"
          git apply "$RUNNER_TEMP/issue71.patch"
          rm '.github/issue71-fix.patch.b64'
          rm '.github/workflows/issue-71-validation.yml'

          python -m py_compile scripts/ci/compatibility.py tests/test_compatibility.py
          python -m unittest tests/test_compatibility.py -v

          git config user.name 'Hermes Local Compatibility CI'
          git config user.email 'hermes-local-ci@localhost'
          git add scripts/ci/compatibility.py tests/test_compatibility.py Update-Hermes-Agent.ps1
          git add -u .github
          git commit -m 'fix: recover npm lockfile patch conflicts'
          git push origin "HEAD:${{ github.head_ref }}"

  exact-candidate:
    name: Exact Hermes Agent candidate
    needs: apply-fix
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out updated pull-request branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Validate PowerShell syntax and compatibility tests
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\Update-Hermes-Agent.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          python -m py_compile '.\scripts\ci\compatibility.py' '.\tests\test_compatibility.py'
          python -m unittest '.\tests\test_compatibility.py' -v

      - name: Run full exact-candidate gate
        shell: pwsh
        run: |
          python '.\scripts\ci\compatibility.py' hermes-agent `
            --repository-root '.' `
            --candidate-ref '582606f176f5467deb96bb949e0879a8e18f31dd' `
            --work-dir '.\temp\issue-71' `
            --log-dir '.\artifacts\issue-71\logs' `
            --report '.\artifacts\issue-71\hermes-agent-report.json' `
            --run-desktop-checks `
            --run-python-checks `
            --run-package-checks

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-71-validation-evidence
          path: artifacts/issue-71
          if-no-files-found: error
          retention-days: 30
