name: Repair Windows SSH Clippy errors

on:
  push:
    branches:
      - refactor/dioxus-rust-client

permissions:
  contents: write

concurrency:
  group: dioxus-fix-clippy
  cancel-in-progress: true

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dioxus-rust-client
          fetch-depth: 0
      - name: Apply Clippy fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path('apps/desktop/src/ssh_windows.rs')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('helper(config, &runtime, "read-lock", &[ownership_id.clone()], None)',
               'helper(config, &runtime, "read-lock", std::slice::from_ref(&ownership_id), None)'),
              ('            &[ownership_id.clone()],\n            None,',
               '            std::slice::from_ref(&ownership_id),\n            None,'),
              ('''        .lines()\n        .map(str::trim)\n        .filter(|line| !line.is_empty())\n        .next_back()\n        .unwrap_or("null");''',
               '''        .lines()\n        .map(str::trim)\n        .rfind(|line| !line.is_empty())\n        .unwrap_or("null");'''),
              ('let mut argv = vec![', 'let mut helper_argv = vec!['),
              ('    argv.extend(args.iter().cloned());\n    let invocation = argv',
               '    helper_argv.extend(args.iter().cloned());\n    let invocation = helper_argv'),
          ]
          for old, new in replacements:
              if old not in s:
                  if new in s:
                      continue
                  raise SystemExit(f'expected Clippy target not found: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          '@ | Set-Content -Encoding utf8 .fix_clippy.py
          python .fix_clippy.py
          Remove-Item .fix_clippy.py
          cargo fmt --all
      - name: Commit Clippy fixes
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/ssh_windows.rs
          git commit -m 'fix(ssh): satisfy native Windows lifecycle Clippy gate'
          git push origin HEAD:refactor/dioxus-rust-client
