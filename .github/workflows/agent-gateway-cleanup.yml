name: Clean gateway implementation

on:
  push:
    branches:
      - agent/manage-messaging-gateway

permissions:
  contents: write

jobs:
  clean:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manage-messaging-gateway

      - name: Remove generated duplication and format diagnostics
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8", newline="\n")

          diagnostics = "Test-Hermes-Local.ps1"
          content = read(diagnostics)
          duplicate_import = (
              "Import-Module (Join-Path $PSScriptRoot 'scripts\\Hermes-Gateway.psm1') -Force\n"
              "Import-Module (Join-Path $PSScriptRoot 'scripts\\Hermes-Gateway.psm1') -Force"
          )
          if duplicate_import in content:
              content = content.replace(
                  duplicate_import,
                  "Import-Module (Join-Path $PSScriptRoot 'scripts\\Hermes-Gateway.psm1') -Force",
                  1,
              )

          malformed_running = '''    $running = if (Test-Path -LiteralPath $statusPath) {
              $runtimeStatus = Get-Content -Raw -LiteralPath $statusPath | ConvertFrom-Json
              $gatewayReady = $runtimeStatus.PSObject.Properties.Name -notcontains 'gateway' -or
                  -not $runtimeStatus.gateway.required -or $runtimeStatus.gateway.healthy
              $runtimeStatus.phase -eq 'running' -and $runtimeStatus.model.healthy -and
                  $runtimeStatus.hermes.healthy -and $gatewayReady
          } else {
              $false
          }'''
          formatted_running = '''    $running = if (Test-Path -LiteralPath $statusPath) {
              $runtimeStatus = Get-Content -Raw -LiteralPath $statusPath | ConvertFrom-Json
              $gatewayReady = $runtimeStatus.PSObject.Properties.Name -notcontains 'gateway' -or
                  -not $runtimeStatus.gateway.required -or $runtimeStatus.gateway.healthy
              $runtimeStatus.phase -eq 'running' -and $runtimeStatus.model.healthy -and
                  $runtimeStatus.hermes.healthy -and $gatewayReady
          } else {
              $false
          }'''
          # Earlier generated content lost indentation relative to the enclosing try.
          raw_running = '''    $running = if (Test-Path -LiteralPath $statusPath) {
          $runtimeStatus = Get-Content -Raw -LiteralPath $statusPath | ConvertFrom-Json
          $gatewayReady = $runtimeStatus.PSObject.Properties.Name -notcontains 'gateway' -or
              -not $runtimeStatus.gateway.required -or $runtimeStatus.gateway.healthy
          $runtimeStatus.phase -eq 'running' -and $runtimeStatus.model.healthy -and
              $runtimeStatus.hermes.healthy -and $gatewayReady
      } else {
          $false
      }'''
          if raw_running in content:
              content = content.replace(raw_running, formatted_running, 1)

          raw_gateway = '''    Add-TestResult -Name 'Web dashboard' -Passed (
          $dashboard.StatusCode -eq 200 -and $dashboard.Headers.'Content-Type' -match 'text/html'
      ) -Detail 'Official dashboard HTML is served from loopback.'

      $gatewaySnapshot = Get-HermesGatewaySnapshot -Discover
      if ($gatewaySnapshot.required) {
          $gatewayDetail = if ($gatewaySnapshot.healthy -and -not $gatewaySnapshot.duplicateLogicalRoots) {
              "Healthy gateway PID $($gatewaySnapshot.pid) for $(@($gatewaySnapshot.enabledPlatforms) -join ', ')."
          } else {
              Get-HermesGatewayFailureDetail -Snapshot $gatewaySnapshot
          }
          Add-TestResult -Name 'Messaging gateway' -Passed (
              $gatewaySnapshot.healthy -and -not $gatewaySnapshot.duplicateLogicalRoots
          ) -Detail $gatewayDetail
      } else {
          Add-TestResult -Name 'Messaging gateway' -Passed $true `
              -Detail 'No gateway-backed messaging platform is enabled.'
      }'''
          formatted_gateway = '''    Add-TestResult -Name 'Web dashboard' -Passed (
              $dashboard.StatusCode -eq 200 -and $dashboard.Headers.'Content-Type' -match 'text/html'
          ) -Detail 'Official dashboard HTML is served from loopback.'

          $gatewaySnapshot = Get-HermesGatewaySnapshot -Discover
          if ($gatewaySnapshot.required) {
              $gatewayDetail = if ($gatewaySnapshot.healthy -and -not $gatewaySnapshot.duplicateLogicalRoots) {
                  "Healthy gateway PID $($gatewaySnapshot.pid) for $(@($gatewaySnapshot.enabledPlatforms) -join ', ')."
              } else {
                  Get-HermesGatewayFailureDetail -Snapshot $gatewaySnapshot
              }
              Add-TestResult -Name 'Messaging gateway' -Passed (
                  $gatewaySnapshot.healthy -and -not $gatewaySnapshot.duplicateLogicalRoots
              ) -Detail $gatewayDetail
          } else {
              Add-TestResult -Name 'Messaging gateway' -Passed $true `
                  -Detail 'No gateway-backed messaging platform is enabled.'
          }'''
          if raw_gateway in content:
              content = content.replace(raw_gateway, formatted_gateway, 1)
          write(diagnostics, content)

          supervisor = "scripts/supervisor/Hermes-Supervisor.ps1"
          content = read(supervisor)
          marker = "function Wait-HermesGatewayHealthy {"
          if content.count(marker) == 2:
              first = content.index(marker)
              second = content.index(marker, first + len(marker))
              start_stack = content.index("function Start-Stack {", second)
              content = content[:second] + content[start_stack:]
          content = content.replace(
              "-GatewayState 'stopped' -GatewayState 'stopped'",
              "-GatewayState 'stopped'",
          )
          write(supervisor, content)

          diagnostics_text = read(diagnostics)
          supervisor_text = read(supervisor)
          if diagnostics_text.count("Import-Module (Join-Path $PSScriptRoot 'scripts\\Hermes-Gateway.psm1') -Force") != 1:
              raise SystemExit("Expected exactly one Hermes-Gateway import in Test-Hermes-Local.ps1")
          if supervisor_text.count(marker) != 1:
              raise SystemExit("Expected exactly one Wait-HermesGatewayHealthy function")
          if "-GatewayState 'stopped' -GatewayState 'stopped'" in supervisor_text:
              raise SystemExit("Duplicate GatewayState argument remains")
          '@ | python -

      - name: Validate cleaned implementation
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_gateway_snapshot.py' -v
          python -m py_compile '.\scripts\gateway_snapshot.py' '.\tests\test_gateway_snapshot.py'
          & '.\tests\Test-HermesGatewayModule.ps1'
          foreach ($file in @(
            '.\Start-Hermes-Local.ps1',
            '.\Test-Hermes-Local.ps1',
            '.\scripts\Hermes-Gateway.psm1',
            '.\scripts\supervisor\Hermes-Supervisor.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw (($errors | ForEach-Object ToString) -join [Environment]::NewLine)
            }
          }

      - name: Commit cleanup
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'Cleanup already applied.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Test-Hermes-Local.ps1 scripts/supervisor/Hermes-Supervisor.ps1
          git commit -m 'fix(supervisor): remove duplicate gateway lifecycle code'
          git push origin HEAD:agent/manage-messaging-gateway
