name: Clean gateway implementation

on:
  push:
    branches:
      - agent/manage-messaging-gateway

permissions:
  contents: write

jobs:
  clean:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manage-messaging-gateway

      - name: Apply deterministic cleanup
        shell: pwsh
        run: |
          $markerCommit = 'fix(supervisor): remove duplicate gateway lifecycle code'
          if ((git log -1 --pretty=%s) -eq $markerCommit) {
            Write-Host 'Cleanup commit already applied.'
            exit 0
          }

          $diagnosticsPath = 'Test-Hermes-Local.ps1'
          $gatewayImport = "Import-Module (Join-Path `$PSScriptRoot 'scripts\Hermes-Gateway.psm1') -Force"
          $diagnosticLines = [System.Collections.Generic.List[string]]::new()
          foreach ($line in [System.IO.File]::ReadAllLines($diagnosticsPath)) {
            if ($line -eq $gatewayImport -and $diagnosticLines.Count -gt 0 -and
                $diagnosticLines[$diagnosticLines.Count - 1] -eq $gatewayImport) {
              continue
            }
            $diagnosticLines.Add($line)
          }
          [System.IO.File]::WriteAllLines(
            $diagnosticsPath,
            $diagnosticLines,
            [System.Text.UTF8Encoding]::new($false)
          )

          $supervisorPath = 'scripts/supervisor/Hermes-Supervisor.ps1'
          $supervisorLines = [System.Collections.Generic.List[string]]::new()
          foreach ($line in [System.IO.File]::ReadAllLines($supervisorPath)) {
            $supervisorLines.Add($line)
          }
          $waitStarts = @()
          for ($index = 0; $index -lt $supervisorLines.Count; $index++) {
            if ($supervisorLines[$index] -eq 'function Wait-HermesGatewayHealthy {') {
              $waitStarts += $index
            }
          }
          if ($waitStarts.Count -eq 2) {
            $secondStart = $waitStarts[1]
            $startStack = -1
            for ($index = $secondStart + 1; $index -lt $supervisorLines.Count; $index++) {
              if ($supervisorLines[$index] -eq 'function Start-Stack {') {
                $startStack = $index
                break
              }
            }
            if ($startStack -lt 0) {
              throw 'Could not locate Start-Stack after duplicate wait helper.'
            }
            $supervisorLines.RemoveRange($secondStart, $startStack - $secondStart)
          }
          for ($index = 0; $index -lt $supervisorLines.Count; $index++) {
            $supervisorLines[$index] = $supervisorLines[$index].Replace(
              "-GatewayState 'stopped' -GatewayState 'stopped'",
              "-GatewayState 'stopped'"
            )
          }
          [System.IO.File]::WriteAllLines(
            $supervisorPath,
            $supervisorLines,
            [System.Text.UTF8Encoding]::new($false)
          )

          $diagnosticsText = [System.IO.File]::ReadAllText($diagnosticsPath)
          $supervisorText = [System.IO.File]::ReadAllText($supervisorPath)
          if ([regex]::Matches($diagnosticsText, [regex]::Escape($gatewayImport)).Count -ne 1) {
            throw 'Expected exactly one gateway module import.'
          }
          if ([regex]::Matches($supervisorText, 'function Wait-HermesGatewayHealthy \{').Count -ne 1) {
            throw 'Expected exactly one gateway wait helper.'
          }
          if ($supervisorText.Contains("-GatewayState 'stopped' -GatewayState 'stopped'")) {
            throw 'Duplicate stopped-state argument remains.'
          }

          @(
            "Cleaned commit: $env:GITHUB_SHA"
            "Run: $env:GITHUB_RUN_ID"
          ) | Set-Content -LiteralPath '.gateway-cleanup-success' -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Test-Hermes-Local.ps1 scripts/supervisor/Hermes-Supervisor.ps1 .gateway-cleanup-success
          git commit -m $markerCommit
          git push origin HEAD:agent/manage-messaging-gateway
