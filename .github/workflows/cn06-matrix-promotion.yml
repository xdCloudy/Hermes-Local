name: Promote CN-06 matrix

on:
  push:
    branches: ["docs/cn-06-a4-promotion"]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/cn-06-a4-promotion
          fetch-depth: 0
      - name: Update migration ledger
        run: python .github/scripts/promote_cn06.py
      - name: Commit docs-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cn06-matrix-promotion.yml .github/scripts/promote_cn06.py
          git add docs/DIOXUS_MIGRATION_MATRIX.md
          git commit -m "docs: promote CN-06 cloud connection to A4"
          git push origin HEAD:docs/cn-06-a4-promotion
