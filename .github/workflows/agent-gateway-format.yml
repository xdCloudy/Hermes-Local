name: Format gateway diagnostics block

on:
  push:
    branches:
      - agent/manage-messaging-gateway

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manage-messaging-gateway

      - name: Format diagnostics block
        shell: pwsh
        run: |
          $commitMessage = 'style(diagnostics): format gateway readiness checks'
          if ((git log -1 --pretty=%s) -eq $commitMessage) {
            Write-Host 'Formatting commit already applied.'
            exit 0
          }

          $path = 'Test-Hermes-Local.ps1'
          $content = [System.IO.File]::ReadAllText($path)
          $newline = "`r`n"

          $oldRunning = @(
            "    `$running = if (Test-Path -LiteralPath `$statusPath) {",
            "    `$runtimeStatus = Get-Content -Raw -LiteralPath `$statusPath | ConvertFrom-Json",
            "    `$gatewayReady = `$runtimeStatus.PSObject.Properties.Name -notcontains 'gateway' -or",
            "        -not `$runtimeStatus.gateway.required -or `$runtimeStatus.gateway.healthy",
            "    `$runtimeStatus.phase -eq 'running' -and `$runtimeStatus.model.healthy -and",
            "        `$runtimeStatus.hermes.healthy -and `$gatewayReady",
            "} else {",
            "    `$false",
            "}"
          ) -join $newline
          $newRunning = @(
            "    `$running = if (Test-Path -LiteralPath `$statusPath) {",
            "        `$runtimeStatus = Get-Content -Raw -LiteralPath `$statusPath | ConvertFrom-Json",
            "        `$gatewayReady = `$runtimeStatus.PSObject.Properties.Name -notcontains 'gateway' -or",
            "            -not `$runtimeStatus.gateway.required -or `$runtimeStatus.gateway.healthy",
            "        `$runtimeStatus.phase -eq 'running' -and `$runtimeStatus.model.healthy -and",
            "            `$runtimeStatus.hermes.healthy -and `$gatewayReady",
            "    } else {",
            "        `$false",
            "    }"
          ) -join $newline
          if (-not $content.Contains($oldRunning)) {
            throw 'Malformed running-state block was not found exactly once.'
          }
          $content = $content.Replace($oldRunning, $newRunning)

          $oldGateway = @(
            "    Add-TestResult -Name 'Web dashboard' -Passed (",
            "    `$dashboard.StatusCode -eq 200 -and `$dashboard.Headers.'Content-Type' -match 'text/html'",
            ") -Detail 'Official dashboard HTML is served from loopback.'",
            "",
            "`$gatewaySnapshot = Get-HermesGatewaySnapshot -Discover",
            "if (`$gatewaySnapshot.required) {",
            "    `$gatewayDetail = if (`$gatewaySnapshot.healthy -and -not `$gatewaySnapshot.duplicateLogicalRoots) {",
            "        `"Healthy gateway PID `$(`$gatewaySnapshot.pid) for `$(@(`$gatewaySnapshot.enabledPlatforms) -join ', ').`"",
            "    } else {",
            "        Get-HermesGatewayFailureDetail -Snapshot `$gatewaySnapshot",
            "    }",
            "    Add-TestResult -Name 'Messaging gateway' -Passed (",
            "        `$gatewaySnapshot.healthy -and -not `$gatewaySnapshot.duplicateLogicalRoots",
            "    ) -Detail `$gatewayDetail",
            "} else {",
            "    Add-TestResult -Name 'Messaging gateway' -Passed `$true ```",
            "        -Detail 'No gateway-backed messaging platform is enabled.'",
            "}"
          ) -join $newline
          $newGateway = @(
            "    Add-TestResult -Name 'Web dashboard' -Passed (",
            "        `$dashboard.StatusCode -eq 200 -and `$dashboard.Headers.'Content-Type' -match 'text/html'",
            "    ) -Detail 'Official dashboard HTML is served from loopback.'",
            "",
            "    `$gatewaySnapshot = Get-HermesGatewaySnapshot -Discover",
            "    if (`$gatewaySnapshot.required) {",
            "        `$gatewayDetail = if (`$gatewaySnapshot.healthy -and -not `$gatewaySnapshot.duplicateLogicalRoots) {",
            "            `"Healthy gateway PID `$(`$gatewaySnapshot.pid) for `$(@(`$gatewaySnapshot.enabledPlatforms) -join ', ').`"",
            "        } else {",
            "            Get-HermesGatewayFailureDetail -Snapshot `$gatewaySnapshot",
            "        }",
            "        Add-TestResult -Name 'Messaging gateway' -Passed (",
            "            `$gatewaySnapshot.healthy -and -not `$gatewaySnapshot.duplicateLogicalRoots",
            "        ) -Detail `$gatewayDetail",
            "    } else {",
            "        Add-TestResult -Name 'Messaging gateway' -Passed `$true ```",
            "            -Detail 'No gateway-backed messaging platform is enabled.'",
            "    }"
          ) -join $newline
          if (-not $content.Contains($oldGateway)) {
            throw 'Malformed gateway diagnostics block was not found exactly once.'
          }
          $content = $content.Replace($oldGateway, $newGateway)
          [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($false))

          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            throw (($errors | ForEach-Object ToString) -join [Environment]::NewLine)
          }

          @(
            "Formatted commit: $env:GITHUB_SHA"
            "Run: $env:GITHUB_RUN_ID"
          ) | Set-Content -LiteralPath '.gateway-format-success' -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Test-Hermes-Local.ps1 .gateway-format-success
          git commit -m $commitMessage
          git push origin HEAD:agent/manage-messaging-gateway
