name: Agent chat composer patch

on:
  push:
    branches:
      - agent/chat-composer-a4
    paths:
      - "agent-patches/chat-composer.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: python agent-patches/chat-composer.py
      - run: cargo fmt --all
      - shell: bash
        run: |
          git diff --check
          grep -q 'pub struct ComposerDraftStore' crates/hermes-core/src/lib.rs
          grep -q 'fn execute_directive' crates/hermes-core/src/lib.rs
          grep -q 'SessionDirectiveResult' crates/hermes-protocol/src/lib.rs
          grep -q '"slash.exec"' crates/hermes-desktop/src/lib.rs
      - shell: bash
        run: |
          rm -f agent-patches/chat-composer.py
          rm -f .github/workflows/agent-chat-composer-patch.yml
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add durable composer and directive contracts"
          git push origin HEAD:${{ github.ref_name }}
