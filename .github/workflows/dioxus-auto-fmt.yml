name: Dioxus branch auto-format

on:
  push:
    branches:
      - refactor/dioxus-rust-client

permissions:
  contents: write

concurrency:
  group: dioxus-auto-fmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dioxus-rust-client
          fetch-depth: 0
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit formatting if needed
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'Rust workspace already formatted.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: format Rust migration workspace'
          git push origin HEAD:refactor/dioxus-rust-client
