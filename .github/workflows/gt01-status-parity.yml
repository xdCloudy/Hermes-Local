name: GT-01 Git status parity

on:
  push:
    branches:
      - goal-loop/gt01-status-parity
    paths:
      - .github/workflows/gt01-status-parity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal-loop/gt01-status-parity
          fetch-depth: 0

      - name: Apply GT-01 status parity fix and tests
        shell: pwsh
        run: |
          python scripts/ci/gt01_status_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate GT-01 status behavior and UI contract
        shell: pwsh
        run: |
          python scripts/ci/check_dioxus_rust_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_status_parity --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop parses_porcelain_status --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop parses_unborn_and_detached_porcelain_headers --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated GT-01 product and evidence slice
        shell: pwsh
        run: |
          Remove-Item .github/workflows/gt01-status-parity.yml
          Remove-Item scripts/ci/gt01_status_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(git): handle unborn and detached status parity"
          git push origin HEAD:goal-loop/gt01-status-parity
