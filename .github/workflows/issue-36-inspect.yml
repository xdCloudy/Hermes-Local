name: Issue 36 transactional updater finalizer

on:
  pull_request:
    paths:
      - '.github/workflows/issue-36-inspect.yml'
      - 'scripts/ci/issue36-payload.part-*'

permissions:
  contents: write

concurrency:
  group: issue-36-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-36-desktop-transactional-updater
          fetch-depth: 0

      - name: Detect staged payload
        id: payload
        shell: pwsh
        run: |
          $parts = @(
            '.\scripts\ci\issue36-payload.part-00',
            '.\scripts\ci\issue36-payload.part-01',
            '.\scripts\ci\issue36-payload.part-02',
            '.\scripts\ci\issue36-payload.part-rest'
          )
          $present = @($parts | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          "ready=$($present.Count -eq $parts.Count)" >> $env:GITHUB_OUTPUT

      - name: Reconstruct, validate and commit permanent implementation
        if: steps.payload.outputs.ready == 'True'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
            '.\scripts\ci\issue36-payload.part-00',
            '.\scripts\ci\issue36-payload.part-01',
            '.\scripts\ci\issue36-payload.part-02',
            '.\scripts\ci\issue36-payload.part-rest'
          )
          $archive = Join-Path $env:RUNNER_TEMP 'issue-36-payload.zip'
          $payloadRoot = Join-Path $env:RUNNER_TEMP 'issue-36-payload'
          $base64 = ($parts | ForEach-Object { Get-Content -Raw -LiteralPath $_ }) -join ''
          $base64 = [regex]::Replace($base64, '\s', '')
          [System.IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($base64))
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '55c9f6b40f0e726c0c3ead7ae9f6e409bc48cdc9903d861fd2c7640e6ecfdfdd') {
            throw "Issue #36 payload digest mismatch: $digest"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $payloadRoot -Force

          $manifest = Get-Content -Raw -LiteralPath '.\VERSION.json' | ConvertFrom-Json
          $source = Join-Path $env:RUNNER_TEMP 'issue-36-hermes-agent'
          $patches = Get-ChildItem -LiteralPath '.\source\hermes-launcher\patches' -Filter '*.patch' -File |
            Sort-Object Name |
            ForEach-Object FullName

          git clone --no-checkout $manifest.sources.hermesAgent.repository $source
          git -C $source checkout --detach $manifest.sources.hermesAgent.commit
          git -C $source config user.name 'Hermes Local Integration'
          git -C $source config user.email 'hermes-local-ci@localhost'
          git -C $source am --3way --committer-date-is-author-date @patches

          $oldTree = (git -C $source rev-parse 'HEAD^{tree}').Trim()
          if ($oldTree -ne [string]$manifest.sources.hermesAgent.integrationTree) {
            throw "Pinned integration tree mismatch: expected $($manifest.sources.hermesAgent.integrationTree), got $oldTree"
          }

          $patchName = '0035-fix-desktop-route-agent-updates-through-transactional-updater.patch'
          $newPatch = Join-Path $payloadRoot "source\$patchName"
          $patchText = [System.IO.File]::ReadAllText($newPatch).Replace("`r`n", "`n")
          [System.IO.File]::WriteAllText($newPatch, $patchText, [System.Text.UTF8Encoding]::new($false))
          git -C $source am --3way --committer-date-is-author-date $newPatch

          $integrationCommit = (git -C $source rev-parse HEAD).Trim()
          $integrationTree = (git -C $source rev-parse 'HEAD^{tree}').Trim()
          $patchCount = $patches.Count + 1
          if ($patchCount -ne 35) {
            throw "Expected 35 integration patches, got $patchCount."
          }

          Copy-Item -LiteralPath (Join-Path $payloadRoot 'repository\Update-Hermes-Agent.ps1') -Destination '.\Update-Hermes-Agent.ps1' -Force
          Copy-Item -LiteralPath (Join-Path $payloadRoot 'repository\Update-Hermes-Local.ps1') -Destination '.\Update-Hermes-Local.ps1' -Force
          Copy-Item -LiteralPath (Join-Path $payloadRoot 'repository\scripts\Hermes-UpdateOrchestrator.psm1') -Destination '.\scripts\Hermes-UpdateOrchestrator.psm1' -Force
          Copy-Item -LiteralPath (Join-Path $payloadRoot 'repository\tests\Test-HermesUpdateOrchestrator.ps1') -Destination '.\tests\Test-HermesUpdateOrchestrator.ps1' -Force
          Copy-Item -LiteralPath $newPatch -Destination (Join-Path '.\source\hermes-launcher\patches' $patchName) -Force

          $editor = Join-Path $env:RUNNER_TEMP 'finalize-issue-36.py'
          @'
          from __future__ import annotations

          import datetime as dt
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          integration_commit = sys.argv[2]
          integration_tree = sys.argv[3]

          version_path = root / 'VERSION.json'
          version = json.loads(version_path.read_text(encoding='utf-8'))
          version['product']['version'] = '0.18.17'
          version['sources']['hermesAgent']['integrationCommit'] = integration_commit
          version['sources']['hermesAgent']['integrationTree'] = integration_tree
          version['recordedAt'] = dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          version_path.write_text(json.dumps(version, indent=2) + '\n', encoding='utf-8')

          compatibility_path = root / 'scripts/ci/compatibility.py'
          compatibility = compatibility_path.read_text(encoding='utf-8')
          update_test = 'electron/hermes-local-update.test.ts'
          if update_test not in compatibility:
              anchor = (
                  '                    run([vitest, "run", "--project", "electron", '
                  '"electron/hermes-local-control.test.ts"], cwd=source / "apps/desktop", log=logs / "tests.log")\n'
              )
              replacement = anchor + (
                  '                    run([vitest, "run", "--project", "electron", '
                  '"electron/hermes-local-update.test.ts"], cwd=source / "apps/desktop", log=logs / "tests.log")\n'
              )
              if anchor not in compatibility:
                  raise RuntimeError('Desktop compatibility-test anchor is missing')
              compatibility = compatibility.replace(anchor, replacement, 1)
              compatibility_path.write_text(compatibility, encoding='utf-8')
          '@ | Set-Content -LiteralPath $editor -Encoding utf8NoBOM
          python $editor $PWD $integrationCommit $integrationTree

          $parseErrors = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem -LiteralPath . -Recurse -File -Include '*.ps1','*.psm1' |
            Where-Object { $_.FullName -notmatch '[\\/](temp|artifacts|node_modules|source[\\/]hermes-agent)[\\/]' } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              foreach ($error in @($errors)) {
                $parseErrors.Add("$($_.FullName): $($error.Message)")
              }
            }
          if ($parseErrors.Count -gt 0) {
            throw "PowerShell parsing failed:`n$($parseErrors -join "`n")"
          }

          pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File '.\tests\Test-HermesUpdateOrchestrator.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Update orchestrator contract failed with exit code $LASTEXITCODE" }
          pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File '.\tests\Test-HermesUpdateFailurePaths.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Update failure-path matrix failed with exit code $LASTEXITCODE" }

          npx.cmd --yes npm@12.0.0 ci --prefix $source --no-audit --fund=false
          if ($LASTEXITCODE -ne 0) { throw "Desktop dependency installation failed with exit code $LASTEXITCODE" }
          npx.cmd --yes npm@12.0.0 run typecheck --prefix $source --workspace apps/desktop
          if ($LASTEXITCODE -ne 0) { throw "Desktop typecheck failed with exit code $LASTEXITCODE" }
          npx.cmd --yes npm@12.0.0 run lint --prefix $source --workspace apps/desktop
          if ($LASTEXITCODE -ne 0) { throw "Desktop lint failed with exit code $LASTEXITCODE" }

          $vitest = Join-Path $source 'node_modules\.bin\vitest.cmd'
          Push-Location (Join-Path $source 'apps\desktop')
          try {
            & $vitest run --project electron `
              electron/hermes-local-control.test.ts `
              electron/hermes-local-update.test.ts `
              electron/hermes-local-benchmark-progress.test.ts
            if ($LASTEXITCODE -ne 0) { throw "Focused Electron tests failed with exit code $LASTEXITCODE" }
            & $vitest run src/store/projects.test.ts
            if ($LASTEXITCODE -ne 0) { throw "Project-store tests failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          npx.cmd --yes npm@12.0.0 run build --prefix $source --workspace apps/desktop
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed with exit code $LASTEXITCODE" }
          npx.cmd --yes npm@12.0.0 run dist:win --prefix $source --workspace apps/desktop
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed with exit code $LASTEXITCODE" }

          $evidenceRoot = '.\artifacts\issue-36-final'
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          [ordered]@{
            schemaVersion = 1
            issue = 36
            patchCount = $patchCount
            previousIntegrationTree = $oldTree
            integrationCommit = $integrationCommit
            integrationTree = $integrationTree
            powershellContracts = @('Test-HermesUpdateOrchestrator.ps1', 'Test-HermesUpdateFailurePaths.ps1')
            desktopChecks = @('typecheck', 'lint', 'focused-electron', 'project-store', 'build', 'dist:win')
            completedAt = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidenceRoot 'evidence.json') -Encoding utf8NoBOM

          Remove-Item -LiteralPath $parts -Force
          git config user.name 'Hermes Local Integration'
          git config user.email 'hermes-local-ci@localhost'
          git add --all
          git diff --cached --check -- . ':(exclude)source/hermes-launcher/patches/*.patch'
          if ($LASTEXITCODE -ne 0) {
            throw 'Final issue #36 source diff contains whitespace errors.'
          }
          git commit -m 'fix: route Desktop backend updates through transactional updater'
          git push origin HEAD:agent/issue-36-desktop-transactional-updater

      - name: Upload validation evidence
        if: always() && steps.payload.outputs.ready == 'True'
        uses: actions/upload-artifact@v4
        with:
          name: issue-36-transactional-updater-evidence
          path: artifacts/issue-36-final
          if-no-files-found: warn
          retention-days: 14
