name: Issue 84 build integration

on:
  pull_request:
    paths:
      - '.github/workflows/issue-84-build.yml'
      - 'scripts/ci/issue84-desktop-patch-v3/**'
      - 'Switch-Hermes-Model.ps1'
      - 'scripts/Hermes-Configuration.psm1'
      - 'scripts/verify_model_identity.py'
      - 'tests/test_verify_model_identity.py'
      - 'source/hermes-launcher/patches/0032-fix-desktop-activate-selected-models-through-managed-restart.patch'

permissions:
  contents: write

jobs:
  build:
    name: Generate and validate managed model switch
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Validate root lifecycle sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
          python -m py_compile '.\scripts\verify_model_identity.py' '.\tests\test_verify_model_identity.py'
          python -m unittest '.\tests\test_verify_model_identity.py' -v
          $failures = [System.Collections.Generic.List[string]]::new()
          foreach ($path in @(
            '.\Start-Hermes-Local.ps1',
            '.\Switch-Hermes-Model.ps1',
            '.\scripts\Hermes-Configuration.psm1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($error in @($errors)) {
              $failures.Add("$path`:$($error.Extent.StartLineNumber): $($error.Message)")
            }
          }
          if ($failures.Count) { throw ($failures -join [Environment]::NewLine) }

      - name: Reconstruct and modify integrated Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Get-Content -Raw '.\VERSION.json' | ConvertFrom-Json
          $candidate = [string]$manifest.sources.hermesAgent.commit
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git '.\temp\hermes-agent'
          git -C '.\temp\hermes-agent' checkout --detach $candidate
          git -C '.\temp\hermes-agent' config user.name 'Hermes Local CI'
          git -C '.\temp\hermes-agent' config user.email 'hermes-local-ci@localhost'
          $patches = @(
            Get-ChildItem '.\source\hermes-launcher\patches\*.patch' |
              Where-Object Name -ne '0032-fix-desktop-activate-selected-models-through-managed-restart.patch' |
              Sort-Object Name |
              ForEach-Object FullName
          )
          git -C '.\temp\hermes-agent' am --3way --committer-date-is-author-date @patches

          @'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          parts = sorted(Path('scripts/ci/issue84-desktop-patch-v3').glob('part-*.txt'))
          if len(parts) != 7:
              raise SystemExit(f'Expected 7 patch chunks, found {len(parts)}')
          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in parts)
          if hashlib.sha256((encoded + '\n').encode('ascii')).hexdigest() != '7b81b81956f725986ce669d8e959b689a6c1e9cfc7bb0c46cd8d883ee6d05758':
              raise SystemExit('Issue 84 encoded patch checksum mismatch')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != '1450e46b805d642be20509783ecc20e787f24a09a8cc1ac38984f3a662885473':
              raise SystemExit('Issue 84 decoded patch checksum mismatch')
          Path('temp/issue84-desktop.patch').write_bytes(patch)
          '@ | python -
          $desktopPatch = (Resolve-Path '.\temp\issue84-desktop.patch').Path
          git -C '.\temp\hermes-agent' apply --check --directory='apps/desktop' $desktopPatch
          git -C '.\temp\hermes-agent' apply --directory='apps/desktop' $desktopPatch

          @'
          from pathlib import Path
          path = Path('temp/hermes-agent/apps/desktop/src/app/local-workstation/types.ts')
          content = path.read_text(encoding='utf-8')
          original = '  stage: null | string\n'
          replacement = '  stage?: null | string\n'
          if original not in content:
              raise SystemExit('LocalActionTask.stage declaration was not found')
          path.write_text(content.replace(original, replacement, 1), encoding='utf-8')
          '@ | python -

      - name: Validate focused Desktop changes without broad rewrites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location '.\temp\hermes-agent'
          try {
            npx.cmd --yes npm@12.0.0 install --ignore-scripts --no-audit --fund=false
            Push-Location '.\apps\desktop'
            try {
              npx.cmd --no-install vitest run --project electron `
                electron/hermes-local-model-switch.test.ts `
                electron/hermes-local-control.test.ts `
                electron/hermes-local-task-model.test.ts `
                electron/hermes-local-task-store.test.ts `
                electron/hermes-local-settings.test.ts `
                electron/hermes-local-dashboard-view.test.ts
            } finally {
              Pop-Location
            }
            npx.cmd --yes npm@12.0.0 run typecheck --workspace hermes-launcher
            npx.cmd --yes npm@12.0.0 run lint --workspace hermes-launcher
          } finally {
            Pop-Location
          }

      - name: Generate minimal patch and recorded integration state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $source = Resolve-Path '.\temp\hermes-agent'
          git -C $source add apps/desktop package-lock.json
          git -C $source commit -m 'fix(desktop): activate selected models through managed restart'

          $destination = Resolve-Path '.\source\hermes-launcher\patches'
          $generated = (git -C $source format-patch -1 --zero-commit --output-directory $destination).Trim()
          $finalPatch = Join-Path $destination '0032-fix-desktop-activate-selected-models-through-managed-restart.patch'
          if (Test-Path -LiteralPath $finalPatch) { Remove-Item -LiteralPath $finalPatch -Force }
          Move-Item -LiteralPath $generated -Destination $finalPatch -Force

          $integrationCommit = (git -C $source rev-parse HEAD).Trim()
          $integrationTree = (git -C $source rev-parse 'HEAD^{tree}').Trim()
          @'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('VERSION.json')
          document = json.loads(path.read_text(encoding='utf-8-sig'))
          document['sources']['hermesAgent']['integrationCommit'] = r'__COMMIT__'
          document['sources']['hermesAgent']['integrationTree'] = r'__TREE__'
          document['recordedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          path.write_text(json.dumps(document, indent=2) + '\n', encoding='utf-8')
          '@.Replace('__COMMIT__', $integrationCommit).Replace('__TREE__', $integrationTree) | python -

      - name: Verify generated series and publish branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Get-Content -Raw '.\VERSION.json' | ConvertFrom-Json
          $candidate = [string]$manifest.sources.hermesAgent.commit
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git '.\temp\verify'
          git -C '.\temp\verify' checkout --detach $candidate
          git -C '.\temp\verify' config user.name 'Hermes Local CI'
          git -C '.\temp\verify' config user.email 'hermes-local-ci@localhost'
          $patches = @(Get-ChildItem '.\source\hermes-launcher\patches\*.patch' | Sort-Object Name | ForEach-Object FullName)
          git -C '.\temp\verify' am --3way --committer-date-is-author-date @patches
          $tree = (git -C '.\temp\verify' rev-parse 'HEAD^{tree}').Trim()
          if ($tree -ne [string]$manifest.sources.hermesAgent.integrationTree) {
            throw "Generated integration tree mismatch: $tree"
          }

          git config user.name 'Hermes Local CI'
          git config user.email 'hermes-local-ci@localhost'
          git add VERSION.json source/hermes-launcher/patches/0032-fix-desktop-activate-selected-models-through-managed-restart.patch
          if (-not (git diff --cached --quiet)) {
            git commit -m 'refactor: keep issue 84 integration patch focused'
            git push origin HEAD:${{ github.head_ref }}
          }
