name: Format Dioxus migration branch now

on:
  push:
    branches:
      - refactor/dioxus-rust-client

permissions:
  contents: write

jobs:
  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dioxus-rust-client
          fetch-depth: 0
      - run: cargo fmt --all
      - name: Commit formatting
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: format native SSH migration slice'
          git push origin HEAD:refactor/dioxus-rust-client
