name: Dioxus lockfile repair

on:
  push:
    branches:
      - refactor/dioxus-rust-client

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and check Rust workspace
        shell: pwsh
        run: cargo check --workspace --all-targets
      - name: Upload regenerated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-cargo-lock
          path: Cargo.lock
          retention-days: 1
