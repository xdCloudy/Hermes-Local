name: Temporary rustfmt DI-02 recovery

on:
  push:
    branches:
      - agent/clipboard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply pinned rustfmt
        shell: bash
        run: cargo fmt --all
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "rustfmt already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply pinned rustfmt"
          git push origin HEAD:agent/clipboard
