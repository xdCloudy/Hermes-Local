name: Restore source snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/restore-source-snapshot.yml'
      - 'source/hermes-launcher/patches/**'
      - 'VERSION.json'

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reconstruct pinned Desktop integration
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -LiteralPath '.\VERSION.json' | ConvertFrom-Json
          $candidate = [string]$manifest.sources.hermesAgent.commit
          python '.\scripts\ci\compatibility.py' hermes-agent `
            --repository-root '.' `
            --candidate-ref $candidate `
            --work-dir '.\temp\restore-source-snapshot' `
            --log-dir '.\artifacts\restore-source-snapshot\logs' `
            --report '.\artifacts\restore-source-snapshot\report.json' `
            --keep-workspace
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Desktop reconstruction failed with exit code $LASTEXITCODE."
          }

      - name: Collect restore integration source
        shell: pwsh
        run: |
          $source = Resolve-Path '.\temp\restore-source-snapshot\hermes-agent'
          $destination = '.\artifacts\restore-source-snapshot\source'
          $files = @(
            'apps\desktop\electron\hermes-local-control.ts',
            'apps\desktop\electron\hermes-local-task-model.ts',
            'apps\desktop\electron\hermes-local-task-model.test.ts',
            'apps\desktop\electron\preload.ts',
            'apps\desktop\src\app\local-workstation\index.tsx',
            'apps\desktop\src\app\local-workstation\types.ts',
            'apps\desktop\src\app\local-workstation\task-centre.tsx',
            'apps\desktop\src\app\local-workstation\task-centre.test.tsx',
            'apps\desktop\src\app\routes.ts',
            'apps\desktop\src\app\chat\sidebar\index.tsx',
            'apps\desktop\src\global.d.ts',
            'apps\desktop\src\i18n\en.ts',
            'apps\desktop\src\i18n\ar.ts',
            'apps\desktop\src\i18n\ja.ts',
            'apps\desktop\src\i18n\zh.ts',
            'apps\desktop\src\i18n\zh-hant.ts'
          )
          foreach ($relative in $files) {
            $from = Join-Path $source $relative
            if (-not (Test-Path -LiteralPath $from -PathType Leaf)) {
              throw "Expected reconstructed source file is missing: $relative"
            }
            $to = Join-Path $destination $relative
            [System.IO.Directory]::CreateDirectory([System.IO.Path]::GetDirectoryName($to)) | Out-Null
            Copy-Item -LiteralPath $from -Destination $to
          }

      - uses: actions/upload-artifact@v4
        with:
          name: restore-source-snapshot
          path: artifacts/restore-source-snapshot
          if-no-files-found: error
          retention-days: 1
