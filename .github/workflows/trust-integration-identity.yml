name: Trust integration identity

on:
  pull_request:
    paths:
      - '.github/workflows/trust-integration-identity.yml'

permissions:
  contents: read

jobs:
  identity:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reconstruct deterministic integration identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw -LiteralPath '.\VERSION.json' | ConvertFrom-Json
          $candidate = [string]$manifest.sources.hermesAgent.commit
          $work = Join-Path $env:RUNNER_TEMP 'hermes-trust-integration-id'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          & git -C $work init --quiet
          & git -C $work remote add origin https://github.com/NousResearch/hermes-agent.git
          & git -C $work fetch --quiet --depth=1 origin $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Hermes Agent fetch failed.' }
          & git -C $work checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Hermes Agent checkout failed.' }
          & git -C $work config user.name 'Hermes Local Compatibility CI'
          & git -C $work config user.email 'hermes-local-ci@localhost'
          $patches = Get-ChildItem -LiteralPath '.\source\hermes-launcher\patches' -Filter '*.patch' -File | Sort-Object Name
          & git -C $work am --3way --committer-date-is-author-date @($patches.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Trust Centre integration reconstruction failed.' }
          $commit = (& git -C $work rev-parse HEAD).Trim()
          $tree = (& git -C $work rev-parse 'HEAD^{tree}').Trim()
          Write-Host "HERMES_TRUST_INTEGRATION_COMMIT=$commit"
          Write-Host "HERMES_TRUST_INTEGRATION_TREE=$tree"
