name: Issue 84 integrated source inspection

on:
  pull_request:
    paths:
      - '.github/workflows/issue-84-inspect.yml'
      - 'source/hermes-launcher/patches/**'
      - 'VERSION.json'

permissions:
  contents: read

jobs:
  inspect:
    name: Reconstruct integrated Desktop source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Hermes Local
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Reconstruct recorded integration
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(python -c "import json; print(json.load(open('VERSION.json', encoding='utf-8'))['sources']['hermesAgent']['commit'])")"
          expected_tree="$(python -c "import json; print(json.load(open('VERSION.json', encoding='utf-8'))['sources']['hermesAgent']['integrationTree'])")"

          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git temp/hermes-agent
          git -C temp/hermes-agent checkout --detach "$candidate"
          git -C temp/hermes-agent config user.name 'Hermes Local CI'
          git -C temp/hermes-agent config user.email 'hermes-local-ci@localhost'
          git -C temp/hermes-agent am --3way --committer-date-is-author-date "$GITHUB_WORKSPACE"/source/hermes-launcher/patches/*.patch

          actual_tree="$(git -C temp/hermes-agent rev-parse HEAD^{tree})"
          test "$actual_tree" = "$expected_tree"

          mkdir -p artifacts/issue-84-source/apps/desktop
          cp -R temp/hermes-agent/apps/desktop/electron artifacts/issue-84-source/apps/desktop/
          cp -R temp/hermes-agent/apps/desktop/src artifacts/issue-84-source/apps/desktop/
          cp temp/hermes-agent/apps/desktop/package.json artifacts/issue-84-source/apps/desktop/
          cp temp/hermes-agent/package.json temp/hermes-agent/package-lock.json artifacts/issue-84-source/
          git -C temp/hermes-agent log --oneline --decorate -40 > artifacts/issue-84-source/integration-log.txt

      - name: Upload integrated source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-84-integrated-source
          path: artifacts/issue-84-source
          if-no-files-found: error
          retention-days: 7
