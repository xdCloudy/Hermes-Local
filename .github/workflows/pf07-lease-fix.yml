name: PF-07 lease cleanup

on:
  push:
    branches:
      - refactor/dioxus-rust-client
    paths:
      - .github/workflows/pf07-lease-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dioxus-rust-client
          fetch-depth: 0
      - name: Apply and validate deterministic lease cleanup
        shell: pwsh
        run: |
          python scripts/ci/pf07_lease_fix.py
          cargo fmt --all
          git diff --check
          cargo test -p hermes-local dropping_watch_lease_runs_cleanup_without_native_helper_startup --locked
          cargo test -p hermes-desktop --test files_ui_contract --locked
      - name: Commit product fix and remove disposable workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/pf07-lease-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/preview_watcher.rs .github/workflows/pf07-lease-fix.yml
          git commit -m "test(files): make watcher teardown proof deterministic"
          git push origin HEAD:refactor/dioxus-rust-client
