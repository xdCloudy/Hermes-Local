name: Port native Windows SSH lifecycle

on:
  push:
    branches:
      - refactor/dioxus-rust-client

permissions:
  contents: write

jobs:
  port:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dioxus-rust-client
          fetch-depth: 0
      - name: Port Windows SSH lifecycle
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('apps/desktop/src/ssh_lifecycle.rs')
          src = path.read_text(encoding='utf-8')

          import_marker = 'use hermes_core::{ServiceError, ServiceResult};\n'
          if 'use base64::{Engine as _, engine::general_purpose::STANDARD};' not in src:
              src = src.replace(import_marker, 'use base64::{Engine as _, engine::general_purpose::STANDARD};\n' + import_marker)

          old_windows = '''        "Windows" => Err(ServiceError::Unavailable(
              "Windows-host SSH ownership lifecycle is the next migration slice; connection testing is available, but apply is not enabled yet.".into(),
          )),'''
          new_windows = '''        "Windows" => connect_windows(config, &runtime, &ownership_id).await,'''
          if old_windows in src:
              src = src.replace(old_windows, new_windows)
          elif new_windows not in src:
              raise SystemExit('Windows connect arm not found')

          insert_marker = 'async fn read_unix_lock(config: &SshConfig, ownership_id: &str) -> ServiceResult<Option<UnixLock>> {'
          if 'async fn connect_windows(' not in src:
              windows_code = r'''
          #[derive(Clone, Debug, Deserialize, Serialize)]
          #[serde(rename_all = "camelCase")]
          struct WindowsLock {
              schema_version: u32,
              protocol_version: u32,
              ownership_id: String,
              spawn_nonce: String,
              pid: u32,
              creation_time_ns: String,
              port: u16,
              profile: String,
              hermes_path: String,
              hermes_home: String,
              token_fingerprint: String,
              started_at: String,
          }

          #[derive(Clone, Debug)]
          struct WindowsRuntime {
              arch: String,
              hermes_home: String,
              hermes_path: String,
              python: String,
              hermes_version: String,
          }

          async fn connect_windows(
              config: &SshLifecycleConfig,
              runtime: &RuntimeProbe,
              ownership_id: &str,
          ) -> ServiceResult<SshLease> {
              let mut windows = probe_windows_runtime_full(&config.ssh, runtime).await?;
              let inspection = windows_helper(
                  &config.ssh,
                  &windows,
                  "inspect",
                  &[windows.hermes_path.clone()],
                  None,
              )
              .await?;
              if inspection.get("supported").and_then(Value::as_bool) != Some(true) {
                  return Err(ServiceError::Unavailable(
                      "Update Hermes on the remote Windows host before connecting with Desktop SSH.".into(),
                  ));
              }
              let inspected_path = inspection
                  .get("path")
                  .and_then(Value::as_str)
                  .filter(|value| !value.is_empty())
                  .ok_or_else(|| ServiceError::Transport("Windows SSH runtime inspection did not return Hermes path".into()))?;
              windows.hermes_path = inspected_path.to_owned();
              windows.hermes_version = inspection
                  .get("version")
                  .and_then(Value::as_str)
                  .unwrap_or(&runtime.hermes_version)
                  .to_owned();

              let reuse_token = load_reuse_token(ownership_id)?.unwrap_or_default();
              let lock_value = windows_helper(
                  &config.ssh,
                  &windows,
                  "read-lock",
                  &[ownership_id.to_owned()],
                  None,
              )
              .await?;
              let parsed_lock = serde_json::from_value::<WindowsLock>(lock_value.clone()).ok();

              if let Some(lock) = parsed_lock.filter(|lock| valid_windows_lock(lock, ownership_id)) {
                  let state = windows_process_state(&config.ssh, &windows, &lock).await?;
                  if state.2 {
                      return Err(ServiceError::Transport(
                          "Could not determine the state of the existing remote Windows backend.".into(),
                      ));
                  }
                  let reusable = state.0
                      && state.1
                      && lock.port > 0
                      && lock.profile == config.remote_profile
                      && !reuse_token.is_empty()
                      && lock.token_fingerprint == fingerprint_token(&reuse_token)
                      && lock.hermes_path == windows.hermes_path
                      && lock.hermes_home == windows.hermes_home;

                  if reusable {
                      let mut forward = open_forward(&config.ssh, lock.port).await?;
                      let local_port = forward.local_port;
                      let base_url = format!("http://127.0.0.1:{local_port}");
                      match probe_reuse_proof(&base_url, &reuse_token, &lock.spawn_nonce).await {
                          Ok(true) => {
                              return Ok(SshLease {
                                  base_url,
                                  token: reuse_token,
                                  forward: forward.child,
                                  remote_port: lock.port,
                                  local_port,
                                  remote_pid: lock.pid,
                                  reused: true,
                                  remote_platform: format!("Windows/{}", windows.arch),
                                  remote_hermes_path: windows.hermes_path,
                                  remote_hermes_version: windows.hermes_version,
                              });
                          }
                          Ok(false) => {
                              let _ = forward.child.start_kill();
                              cleanup_windows_owned(&config.ssh, &windows, ownership_id, Some(&lock)).await?;
                          }
                          Err(error) => {
                              let _ = forward.child.start_kill();
                              return Err(error);
                          }
                      }
                  } else {
                      cleanup_windows_owned(&config.ssh, &windows, ownership_id, Some(&lock)).await?;
                  }
              } else if !lock_value.is_null() {
                  windows_helper(
                      &config.ssh,
                      &windows,
                      "remove-lock",
                      &[ownership_id.to_owned()],
                      None,
                  )
                  .await?;
              }

              let token = mint_token();
              let spawn_nonce = random_hex(8);
              windows_helper(
                  &config.ssh,
                  &windows,
                  "upload-token",
                  &[ownership_id.to_owned(), spawn_nonce.clone()],
                  Some(token.as_bytes()),
              )
              .await?;

              let spawn_payload = serde_json::json!({
                  "ownershipId": ownership_id,
                  "spawnNonce": spawn_nonce,
                  "profile": config.remote_profile,
                  "hermesPath": windows.hermes_path,
              });
              let spawned = match windows_helper(
                  &config.ssh,
                  &windows,
                  "spawn",
                  &[],
                  Some(serde_json::to_string(&spawn_payload).map_err(platform)?.as_bytes()),
              )
              .await
              {
                  Ok(value) => value,
                  Err(error) => {
                      let _ = windows_helper(
                          &config.ssh,
                          &windows,
                          "remove-token",
                          &[ownership_id.to_owned(), spawn_nonce.clone()],
                          None,
                      )
                      .await;
                      return Err(error);
                  }
              };
              let pid = spawned
                  .get("pid")
                  .and_then(Value::as_u64)
                  .and_then(|value| u32::try_from(value).ok())
                  .filter(|value| *value > 0)
                  .ok_or_else(|| ServiceError::Transport("Windows SSH runtime did not return a valid pid".into()))?;
              let creation_time_ns = spawned
                  .get("creationTimeNs")
                  .and_then(Value::as_str)
                  .filter(|value| valid_creation_time(value))
                  .ok_or_else(|| ServiceError::Transport("Windows SSH runtime did not return a valid creation time".into()))?
                  .to_owned();
              let mut owned = WindowsLock {
                  schema_version: LOCKFILE_SCHEMA_VERSION,
                  protocol_version: PROTOCOL_VERSION,
                  ownership_id: ownership_id.to_owned(),
                  spawn_nonce: spawn_nonce.clone(),
                  pid,
                  creation_time_ns,
                  port: 0,
                  profile: config.remote_profile.clone(),
                  hermes_path: windows.hermes_path.clone(),
                  hermes_home: windows.hermes_home.clone(),
                  token_fingerprint: fingerprint_token(&token),
                  started_at: unix_timestamp_string(),
              };

              if let Err(error) = write_windows_lock(&config.ssh, &windows, ownership_id, &owned).await {
                  let _ = cleanup_windows_owned(&config.ssh, &windows, ownership_id, Some(&owned)).await;
                  return Err(error);
              }
              let remote_port = match wait_windows_ready(&config.ssh, &windows, ownership_id, &owned).await {
                  Ok(port) => port,
                  Err(error) => {
                      let _ = cleanup_windows_owned(&config.ssh, &windows, ownership_id, Some(&owned)).await;
                      return Err(error);
                  }
              };
              let mut forward = match open_forward(&config.ssh, remote_port).await {
                  Ok(forward) => forward,
                  Err(error) => {
                      let _ = cleanup_windows_owned(&config.ssh, &windows, ownership_id, Some(&owned)).await;
                      return Err(error);
                  }
              };
              let local_port = forward.local_port;
              let base_url = format!("http://127.0.0.1:{local_port}");
              if let Err(error) = wait_for_dashboard(&base_url, &token).await {
                  let _ = forward.child.start_kill();
                  let _ = cleanup_windows_owned(&config.ssh, &windows, ownership_id, Some(&owned)).await;
                  return Err(error);
              }
              owned.port = remote_port;
              if let Err(error) = write_windows_lock(&config.ssh, &windows, ownership_id, &owned).await {
                  let _ = forward.child.start_kill();
                  let _ = cleanup_windows_owned(&config.ssh, &windows, ownership_id, Some(&owned)).await;
                  return Err(error);
              }
              if let Err(error) = store_reuse_token(ownership_id, &token) {
                  let _ = forward.child.start_kill();
                  let _ = cleanup_windows_owned(&config.ssh, &windows, ownership_id, Some(&owned)).await;
                  return Err(error);
              }

              Ok(SshLease {
                  base_url,
                  token,
                  forward: forward.child,
                  remote_port,
                  local_port,
                  remote_pid: pid,
                  reused: false,
                  remote_platform: format!("Windows/{}", windows.arch),
                  remote_hermes_path: windows.hermes_path,
                  remote_hermes_version: windows.hermes_version,
              })
          }

          async fn probe_windows_runtime_full(
              config: &SshConfig,
              runtime: &RuntimeProbe,
          ) -> ServiceResult<WindowsRuntime> {
              let script = format!(
                  concat!(
                      "$ErrorActionPreference='Stop';",
                      "$hermes={hermes};",
                      "$hermesHome=$env:HERMES_HOME;",
                      "if(-not $hermesHome){{$hermesHome=Join-Path $env:LOCALAPPDATA 'hermes'}};",
                      "if(-not (Test-Path -LiteralPath $hermes -PathType Leaf)){{throw 'Hermes is not installed on the remote Windows host.'}};",
                      "$python=Join-Path (Split-Path $hermes) 'python.exe';",
                      "if(-not (Test-Path -LiteralPath $python -PathType Leaf)){{throw 'The remote Hermes Python runtime was not found.'}};",
                      "[ordered]@{{arch=$env:PROCESSOR_ARCHITECTURE;hermesHome=$hermesHome;hermesPath=$hermes;python=$python}}|ConvertTo-Json -Compress"
                  ),
                  hermes = ps_literal(&runtime.hermes_path),
              );
              let output = run_ssh(config, &encoded_windows_powershell(&script), None).await?;
              let value: Value = serde_json::from_str(output.trim()).map_err(platform)?;
              let hermes_home = value.get("hermesHome").and_then(Value::as_str).unwrap_or_default().to_owned();
              let hermes_path = value.get("hermesPath").and_then(Value::as_str).unwrap_or_default().to_owned();
              let python = value.get("python").and_then(Value::as_str).unwrap_or_default().to_owned();
              if hermes_home.is_empty() || hermes_path.is_empty() || python.is_empty() {
                  return Err(ServiceError::Transport("Windows SSH runtime probe returned incomplete paths".into()));
              }
              Ok(WindowsRuntime {
                  arch: value
                      .get("arch")
                      .and_then(Value::as_str)
                      .filter(|value| !value.is_empty())
                      .unwrap_or(&runtime.arch)
                      .to_owned(),
                  hermes_home,
                  hermes_path,
                  python,
                  hermes_version: runtime.hermes_version.clone(),
              })
          }

          async fn windows_helper(
              config: &SshConfig,
              runtime: &WindowsRuntime,
              operation: &str,
              args: &[String],
              stdin: Option<&[u8]>,
          ) -> ServiceResult<Value> {
              const OPERATIONS: &[&str] = &[
                  "inspect",
                  "process-state",
                  "read-lock",
                  "write-lock",
                  "remove-lock",
                  "upload-token",
                  "remove-token",
                  "remove-log",
                  "read-log",
                  "spawn",
                  "terminate",
              ];
              if !OPERATIONS.contains(&operation) {
                  return Err(ServiceError::InvalidInput("unsupported Windows SSH helper operation".into()));
              }
              let mut argv = vec![
                  runtime.python.clone(),
                  "-m".into(),
                  "hermes_cli.windows_ssh_runtime".into(),
                  operation.to_owned(),
              ];
              argv.extend(args.iter().cloned());
              let invocation = argv
                  .iter()
                  .map(|value| ps_literal(value))
                  .collect::<Vec<_>>()
                  .join(" ");
              let script = format!(
                  "$ErrorActionPreference='Stop';& {invocation};if($LASTEXITCODE -ne 0){{exit $LASTEXITCODE}}"
              );
              let output = run_ssh(config, &encoded_windows_powershell(&script), stdin).await?;
              let line = output
                  .trim_start_matches('\u{feff}')
                  .lines()
                  .map(str::trim)
                  .filter(|line| !line.is_empty())
                  .next_back()
                  .unwrap_or("null");
              let value: Value = serde_json::from_str(line).map_err(|error| {
                  ServiceError::Transport(format!("Windows SSH helper returned invalid JSON: {error}"))
              })?;
              if let Some(error) = value.get("error").and_then(Value::as_str).filter(|value| !value.is_empty()) {
                  return Err(ServiceError::Transport(sanitize_remote_text(error)));
              }
              Ok(value)
          }

          async fn windows_process_state(
              config: &SshConfig,
              runtime: &WindowsRuntime,
              lock: &WindowsLock,
          ) -> ServiceResult<(bool, bool, bool)> {
              let value = windows_helper(
                  config,
                  runtime,
                  "process-state",
                  &[
                      lock.pid.to_string(),
                      lock.creation_time_ns.clone(),
                      lock.hermes_path.clone(),
                      lock.spawn_nonce.clone(),
                  ],
                  None,
              )
              .await?;
              Ok((
                  value.get("alive").and_then(Value::as_bool).unwrap_or(false),
                  value.get("owned").and_then(Value::as_bool).unwrap_or(false),
                  value.get("indeterminate").and_then(Value::as_bool).unwrap_or(true),
              ))
          }

          async fn cleanup_windows_owned(
              config: &SshConfig,
              runtime: &WindowsRuntime,
              ownership_id: &str,
              lock: Option<&WindowsLock>,
          ) -> ServiceResult<()> {
              if let Some(lock) = lock {
                  let (alive, owned, indeterminate) = windows_process_state(config, runtime, lock).await?;
                  if indeterminate {
                      return Err(ServiceError::Transport(
                          "Refusing to clean up an indeterminate remote Windows backend.".into(),
                      ));
                  }
                  if alive && owned {
                      windows_helper(
                          config,
                          runtime,
                          "terminate",
                          &[
                              lock.pid.to_string(),
                              lock.creation_time_ns.clone(),
                              lock.hermes_path.clone(),
                              lock.spawn_nonce.clone(),
                          ],
                          None,
                      )
                      .await?;
                  }
                  if !lock.spawn_nonce.is_empty() {
                      let _ = windows_helper(
                          config,
                          runtime,
                          "remove-token",
                          &[ownership_id.to_owned(), lock.spawn_nonce.clone()],
                          None,
                      )
                      .await;
                      let _ = windows_helper(
                          config,
                          runtime,
                          "remove-log",
                          &[ownership_id.to_owned(), lock.spawn_nonce.clone()],
                          None,
                      )
                      .await;
                  }
              }
              let _ = windows_helper(
                  config,
                  runtime,
                  "remove-lock",
                  &[ownership_id.to_owned()],
                  None,
              )
              .await;
              Ok(())
          }

          async fn wait_windows_ready(
              config: &SshConfig,
              runtime: &WindowsRuntime,
              ownership_id: &str,
              lock: &WindowsLock,
          ) -> ServiceResult<u16> {
              let deadline = tokio::time::Instant::now() + READY_TIMEOUT;
              while tokio::time::Instant::now() < deadline {
                  match windows_process_state(config, runtime, lock).await {
                      Ok((alive, owned, false)) if !alive || !owned => {
                          let detail = windows_helper(
                              config,
                              runtime,
                              "read-log",
                              &[ownership_id.to_owned(), lock.spawn_nonce.clone()],
                              None,
                          )
                          .await
                          .ok()
                          .and_then(|value| value.get("content").and_then(Value::as_str).map(str::to_owned))
                          .unwrap_or_default();
                          return Err(ServiceError::Transport(format!(
                              "Remote Windows backend exited before announcing its port. {}",
                              sanitize_remote_text(&detail.chars().rev().take(2_000).collect::<String>().chars().rev().collect::<String>())
                          )));
                      }
                      Ok(_) | Err(_) => {}
                  }
                  let content = windows_helper(
                      config,
                      runtime,
                      "read-log",
                      &[ownership_id.to_owned(), lock.spawn_nonce.clone()],
                      None,
                  )
                  .await
                  .ok()
                  .and_then(|value| value.get("content").and_then(Value::as_str).map(str::to_owned))
                  .unwrap_or_default();
                  if let Some(port) = parse_ready_port(&content) {
                      return Ok(port);
                  }
                  sleep(READY_POLL_INTERVAL).await;
              }
              Err(ServiceError::Transport(format!(
                  "Timed out waiting for the remote Windows backend ({}ms).",
                  READY_TIMEOUT.as_millis()
              )))
          }

          async fn write_windows_lock(
              config: &SshConfig,
              runtime: &WindowsRuntime,
              ownership_id: &str,
              lock: &WindowsLock,
          ) -> ServiceResult<()> {
              if !valid_windows_lock(lock, ownership_id) {
                  return Err(ServiceError::InvalidInput("refusing to write an invalid Windows SSH ownership lock".into()));
              }
              let encoded = serde_json::to_vec(lock).map_err(platform)?;
              windows_helper(
                  config,
                  runtime,
                  "write-lock",
                  &[ownership_id.to_owned()],
                  Some(&encoded),
              )
              .await
              .map(|_| ())
          }

          fn valid_windows_lock(lock: &WindowsLock, ownership_id: &str) -> bool {
              lock.schema_version == LOCKFILE_SCHEMA_VERSION
                  && lock.protocol_version == PROTOCOL_VERSION
                  && lock.ownership_id == ownership_id
                  && is_lower_hex(&lock.spawn_nonce, 16)
                  && lock.pid > 0
                  && valid_creation_time(&lock.creation_time_ns)
                  && is_lower_hex(&lock.token_fingerprint, 32)
                  && lock.profile.len() <= 1_024
                  && !lock.hermes_path.is_empty()
                  && lock.hermes_path.len() <= 1_024
                  && !lock.hermes_home.is_empty()
                  && lock.hermes_home.len() <= 1_024
                  && lock.started_at.len() <= 1_024
          }

          fn valid_creation_time(value: &str) -> bool {
              (10..=20).contains(&value.len()) && value.bytes().all(|byte| byte.is_ascii_digit())
          }

          fn ps_literal(value: &str) -> String {
              format!("'{}'", value.replace('\'', "''"))
          }

          fn encoded_windows_powershell(script: &str) -> String {
              let bytes = script
                  .encode_utf16()
                  .flat_map(u16::to_le_bytes)
                  .collect::<Vec<_>>();
              format!(
                  "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand {}",
                  STANDARD.encode(bytes)
              )
          }

          '''
              src = src.replace(insert_marker, windows_code + insert_marker)

          test_marker = '''    #[test]
              fn lock_validation_binds_log_path_and_protocol() {'''
          if 'fn windows_lock_validation_is_scoped_and_exact()' not in src:
              windows_test = r'''    #[test]
              fn windows_lock_validation_is_scoped_and_exact() {
                  let ownership = "0123456789abcdef0123456789abcdef";
                  let lock = WindowsLock {
                      schema_version: LOCKFILE_SCHEMA_VERSION,
                      protocol_version: PROTOCOL_VERSION,
                      ownership_id: ownership.into(),
                      spawn_nonce: "0123456789abcdef".into(),
                      pid: 10,
                      creation_time_ns: "1784219690452757504".into(),
                      port: 1234,
                      profile: "default".into(),
                      hermes_path: r"C:\h\hermes.exe".into(),
                      hermes_home: r"C:\h".into(),
                      token_fingerprint: fingerprint_token("stored-token"),
                      started_at: "1".into(),
                  };
                  assert!(valid_windows_lock(&lock, ownership));
                  let mut wrong = lock.clone();
                  wrong.ownership_id = "b".repeat(32);
                  assert!(!valid_windows_lock(&wrong, ownership));
                  let mut spawn_in_progress = lock;
                  spawn_in_progress.port = 0;
                  assert!(valid_windows_lock(&spawn_in_progress, ownership));
                  assert!(valid_creation_time("1784219690452757504"));
                  assert!(!valid_creation_time("0"));
              }

          '''
              if test_marker not in src:
                  raise SystemExit('test insertion marker not found')
              src = src.replace(test_marker, windows_test + test_marker)

          path.write_text(src, encoding='utf-8')

          main = Path('apps/desktop/src/main.rs')
          main_src = main.read_text(encoding='utf-8').replace('mod ssh_native;\n', '')
          main.write_text(main_src, encoding='utf-8')

          native = Path('apps/desktop/src/ssh_native.rs')
          if native.exists():
              native.unlink()
          '@ | Set-Content -Encoding utf8 .port_windows_ssh.py
          python .port_windows_ssh.py
          Remove-Item .port_windows_ssh.py
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo test -p hermes-local --locked
      - name: Commit Windows SSH lifecycle
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A apps/desktop/src
          git commit -m 'feat(ssh): port Windows remote ownership lifecycle'
          git push origin HEAD:refactor/dioxus-rust-client
