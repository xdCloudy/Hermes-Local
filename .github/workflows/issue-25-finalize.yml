name: Issue 25 security scan finalizer

on:
  pull_request:
    paths:
      - '.github/issue-25/**'
      - '.github/workflows/issue-25-finalize.yml'

permissions:
  contents: write

concurrency:
  group: issue-25-security-scan-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-25-security-scan-tasks
          fetch-depth: 0

      - name: Materialize, validate and commit
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $payload = '.\.github\issue-25'
          $parts = @(Get-ChildItem -LiteralPath $payload -Filter 'payload.part*.b64' -File | Sort-Object Name)
          if ($parts.Count -ne 4) { throw "Expected 4 payload chunks; found $($parts.Count)." }
          $archive = Join-Path $payload 'payload.zip'
          $encoded = (($parts | ForEach-Object { (Get-Content -Raw -LiteralPath $_.FullName).Trim() }) -join '')
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6f43a5bce5c9377cd022fa7cccc72963b2f2a4ba4efb44a849befe1ece832a2a') {
            throw 'Issue #25 payload digest mismatch.'
          }
          $extracted = Join-Path $payload 'extracted'
          Expand-Archive $archive $extracted -Force

          @'
          from pathlib import Path
          import shutil

          root = Path.cwd()
          src = root / '.github' / 'issue-25' / 'extracted'
          progress = src / 'Security-Progress.ps1'
          text = progress.read_text(encoding='utf-8')
          replacements = [
              (".TrimEnd('\\\\', '/')", ".TrimEnd([char[]]@([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar))"),
              ("        return $relative.Replace('\\\\', '/')", "        return $relative.Replace([System.IO.Path]::DirectorySeparatorChar, [char]'/').Replace([System.IO.Path]::AltDirectorySeparatorChar, [char]'/')"),
              (
                  "    $safe = Protect-HermesLogText ([string]$Text)\n",
                  "    $safe = Protect-HermesLogText ([string]$Text)\n    $safe = $safe -replace '(?i)\\b(?:api[_-]?key|password|secret|token|credential)\\s*[:=]\\s*[^\\s,;]+', '[REDACTED-CREDENTIAL]'\n",
              ),
              (
                  "    if ($script:securityTaskLogPath) {\n        $logLine = '{0} [{1}] {2}: {3}' -f $now.ToString('o'), $Status, $Stage, $safeMessage\n        Add-Content -LiteralPath $script:securityTaskLogPath -Value $logLine -Encoding utf8\n    }",
                  "    if ($script:securityTaskLogPath) {\n        $logDirectory = [System.IO.Path]::GetDirectoryName($script:securityTaskLogPath)\n        if ($logDirectory) { [System.IO.Directory]::CreateDirectory($logDirectory) | Out-Null }\n        $logLine = '{0} [{1}] {2}: {3}' -f $now.ToString('o'), $Status, $Stage, $safeMessage\n        Add-Content -LiteralPath $script:securityTaskLogPath -Value $logLine -Encoding utf8\n    }",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise RuntimeError(f'Correction point missing: {old[:60]}')
              text = text.replace(old, new, 1)
          progress.write_text(text, encoding='utf-8', newline='\n')

          contract = src / 'Test-HermesSecurityScanProgress.ps1'
          text = contract.read_text(encoding='utf-8')
          old = "    Assert-True ($cancelled.completedAt) 'Cancelled scan omitted its completion timestamp.'"
          new = "    Assert-True (-not [string]::IsNullOrWhiteSpace([string]$cancelled.completedAt)) 'Cancelled scan omitted its completion timestamp.'"
          if old not in text: raise RuntimeError('Timestamp assertion correction point missing')
          contract.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          targets = {
              src / 'Security-Scan-Hermes-Local.ps1': root / 'Security-Scan-Hermes-Local.ps1',
              progress: root / 'scripts' / 'security' / 'Security-Progress.ps1',
              contract: root / 'tests' / 'Test-HermesSecurityScanProgress.ps1',
              src / '0036-feat-desktop-instrument-security-scan-task-progress.patch': root / 'source' / 'hermes-launcher' / 'patches' / '0036-feat-desktop-instrument-security-scan-task-progress.patch',
          }
          for source, target in targets.items():
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)

          checker = root / 'scripts' / 'ci' / 'compatibility.py'
          text = checker.read_text(encoding='utf-8')
          needle = '                    run([vitest, "run", "--project", "electron", "electron/hermes-local-update.test.ts"], cwd=source / "apps/desktop", log=logs / "tests.log")\n'
          addition = needle + '                    run([vitest, "run", "--project", "electron", "electron/hermes-local-security-progress.test.ts"], cwd=source / "apps/desktop", log=logs / "tests.log")\n                    run([vitest, "run", "src/app/local-workstation/task-centre.test.tsx", "src/app/local-workstation/security-task-view.test.tsx"], cwd=source / "apps/desktop", log=logs / "tests.log")\n'
          if 'hermes-local-security-progress.test.ts' not in text:
              if needle not in text: raise RuntimeError('Compatibility insertion point missing')
              text = text.replace(needle, addition, 1)
              text = text.replace('desktop:typecheck,lint,focused-electron,project-registry', 'desktop:typecheck,lint,focused-electron,security-task-ui,project-registry', 1)
          checker.write_text(text, encoding='utf-8', newline='\n')
          '@ | python -

          $manifest = Get-Content -Raw '.\VERSION.json' | ConvertFrom-Json
          $source = Join-Path $env:RUNNER_TEMP 'issue-25-hermes-agent'
          $patches = @(Get-ChildItem '.\source\hermes-launcher\patches' -Filter '*.patch' -File | Sort-Object Name | ForEach-Object FullName)
          git clone --no-checkout $manifest.sources.hermesAgent.repository $source
          git -C $source checkout --detach $manifest.sources.hermesAgent.commit
          git -C $source config user.name 'Hermes Local Integration'
          git -C $source config user.email 'hermes-local-ci@localhost'
          git -C $source am --3way --committer-date-is-author-date @patches
          if ($LASTEXITCODE -ne 0) { throw 'The 36-patch integration did not reconstruct.' }
          $commit = (git -C $source rev-parse HEAD).Trim()
          $tree = (git -C $source rev-parse 'HEAD^{tree}').Trim()
          if ($tree -ne 'facb49e58567e5ef9be8ff10bd1e4d208293c09e') { throw "Unexpected integration tree: $tree" }
          $env:ISSUE25_COMMIT = $commit
          $env:ISSUE25_TREE = $tree
          @'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          path = Path('VERSION.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          doc['product']['version'] = '0.18.18'
          doc['sources']['hermesAgent']['integrationCommit'] = os.environ['ISSUE25_COMMIT']
          doc['sources']['hermesAgent']['integrationTree'] = os.environ['ISSUE25_TREE']
          doc['recordedAt'] = datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          path.write_text(json.dumps(doc, indent=2) + '\n', encoding='utf-8', newline='\n')
          '@ | python -

          foreach ($file in @('.\Security-Scan-Hermes-Local.ps1', '.\scripts\security\Security-Progress.ps1', '.\tests\Test-HermesSecurityScanProgress.ps1')) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if (@($errors).Count) { throw ($errors | ForEach-Object Message) -join [Environment]::NewLine }
          }
          & '.\tests\Test-HermesSecurityScanProgress.ps1'
          python -m py_compile '.\scripts\ci\compatibility.py'
          if ($LASTEXITCODE -ne 0) { throw 'Focused validation failed.' }

          Remove-Item '.\.github\issue-25' -Recurse -Force
          Get-ChildItem '.\.github' -Filter 'issue-25-payload.part-*' -File -ErrorAction SilentlyContinue | Remove-Item -Force
          git config user.name 'Hermes Local CI'
          git config user.email 'hermes-local-ci@localhost'
          git add --all
          git commit -m 'feat: instrument security scans with durable task progress'
          git push origin HEAD:agent/issue-25-security-scan-tasks
