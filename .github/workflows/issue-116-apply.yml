name: Apply issue 116 module payload

on:
  push:
    branches:
      - agent/fix-gpuless-hardware-snapshot
    paths:
      - '.github/workflows/issue-116-apply.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/issue-116-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == '' || github.head_ref == 'agent/fix-gpuless-hardware-snapshot'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-gpuless-hardware-snapshot

      - name: Rebuild module
        shell: bash
        run: |
          cat .github/issue-116/common-hermes.part-*.b64 |
            tr -d '\r\n' |
            base64 --decode > scripts/Common-Hermes.psm1
          rm -rf .github/issue-116

      - name: Commit module
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/Common-Hermes.psm1
          git add -u .github/issue-116
          git commit -m "fix: make hardware snapshot null-safe"
          git push
