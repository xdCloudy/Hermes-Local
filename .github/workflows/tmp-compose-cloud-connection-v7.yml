name: Temporary compose Cloud connection v7

on:
  push:
    branches:
      - agent/cloud-connection
    paths:
      - ".github/workflows/tmp-compose-cloud-connection-v7.yml"

permissions:
  contents: write

jobs:
  compose:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloud-connection
      - name: Compose Cloud source and fix Desktop ownership
        shell: python
        run: |
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-compose-cloud-connection-v6.yml').read_text(encoding='utf-8')
          start = '      - name: Run Cloud composition with UI ownership fix\n        shell: python\n        run: |\n'
          end = '      - name: Format and focused validation\n'
          script = textwrap.dedent(workflow.split(start, 1)[1].split(end, 1)[0])
          exec(compile(script, '<cloud-compose-v6>', 'exec'), {'__name__': '__main__'})

          bridge = Path('apps/desktop/src/cloud_bridge.rs')
          text = bridge.read_text(encoding='utf-8')
          old = 'use std::{path::Path, time::Duration};'
          new = 'use std::{path::Path, sync::{Arc, Mutex}, time::Duration};'
          if text.count(old) != 1:
              raise SystemExit(f'cloud_bridge import anchor count={text.count(old)}')
          text = text.replace(old, new)

          old = '''    let (sender, receiver) = tokio::sync::oneshot::channel::<String>();
              window
                  .webview
                  .evaluate_script_with_callback(&script, move |result| {
                      let _ = sender.send(result);
                  })'''.replace('              ', '')
          new = '''    let (sender, receiver) = tokio::sync::oneshot::channel::<String>();
              let sender = Arc::new(Mutex::new(Some(sender)));
              window
                  .webview
                  .evaluate_script_with_callback(&script, move |result| {
                      let Some(sender) = sender
                          .lock()
                          .ok()
                          .and_then(|mut sender| sender.take())
                      else {
                          return;
                      };
                      let _ = sender.send(result);
                  })'''.replace('              ', '')
          if text.count(old) != 1:
              raise SystemExit(f'oneshot callback anchor count={text.count(old)}')
          text = text.replace(old, new)

          old = '''    let initial_error = portal_result.err();
              let mut state = use_signal(move || CloudState {
                  portal_base_url: portal.clone(),'''.replace('              ', '')
          new = '''    let initial_error = portal_result.err();
              let initial_portal = portal.clone();
              let mut state = use_signal(move || CloudState {
                  portal_base_url: initial_portal,'''.replace('              ', '')
          if text.count(old) != 1:
              raise SystemExit(f'portal state anchor count={text.count(old)}')
          bridge.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          cloud = Path('crates/hermes-ui/src/cloud.rs')
          text = cloud.read_text(encoding='utf-8')
          old = 'const MAX_CLOUD_LABEL_BYTES: usize = 512;'
          new = '#[cfg(test)]\nconst MAX_CLOUD_LABEL_BYTES: usize = 512;'
          if text.count(old) != 1:
              raise SystemExit(f'label constant anchor count={text.count(old)}')
          text = text.replace(old, new)
          old = 'pub(crate) fn bounded_cloud_label(value: &str) -> String {'
          new = '#[cfg(test)]\npub(crate) fn bounded_cloud_label(value: &str) -> String {'
          if text.count(old) != 1:
              raise SystemExit(f'label helper anchor count={text.count(old)}')
          cloud.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
      - name: Format and focused validation
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "rustfmt failed" }
          cargo check -p hermes-core --locked
          if ($LASTEXITCODE -ne 0) { throw "hermes-core check failed" }
          cargo test -p hermes-desktop --locked cloud -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "hermes-desktop Cloud tests failed" }
          cargo test -p hermes-ui --locked cloud -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "hermes-ui Cloud tests failed" }
          cargo check -p hermes-local --bin hermes-local --locked
          if ($LASTEXITCODE -ne 0) { throw "Desktop Cloud composition failed" }
      - name: Commit composed source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/hermes-core/src/lib.rs crates/hermes-desktop/src/lib.rs crates/hermes-ui/src/lib.rs crates/hermes-ui/src/cloud.rs apps/desktop/src/main.rs apps/desktop/src/cloud_bridge.rs apps/desktop/src/local_gateway.rs apps/desktop/src/ssh_service.rs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "diff check failed" }
          git commit -m "feat(cn-06): port Hermes Cloud discovery and connection"
          if ($LASTEXITCODE -ne 0) { throw "Cloud source commit failed" }
          git push origin HEAD:agent/cloud-connection
          if ($LASTEXITCODE -ne 0) { throw "Cloud source push failed" }
