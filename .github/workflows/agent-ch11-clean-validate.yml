name: Agent CH-11 clean validation

on:
  push:
    branches:
      - agent/chat-attachments-a4-clean
    paths:
      - .github/workflows/agent-ch11-clean-validate.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply only validated CH-11 source paths
        shell: pwsh
        run: |
          git fetch origin agent/chat-attachments-a4
          git diff HEAD af53dff6c92d6d4ef85d1d44d43f20f166df3af2 -- crates/hermes-protocol/src/lib.rs crates/hermes-core/src/lib.rs crates/hermes-desktop/src/lib.rs crates/hermes-ui/src/chat.rs crates/hermes-ui/assets/app.css | Set-Content -Encoding utf8 ch11-clean.patch
          git apply --check ch11-clean.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ch11-clean.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format Rust
        run: cargo fmt --all
      - name: Guard architecture
        run: python scripts/ci/check_dioxus_rust_architecture.py
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Check shared UI for WebAssembly
        run: cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Verify whitespace
        run: git diff --check
      - name: Commit validated source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/hermes-protocol/src/lib.rs crates/hermes-core/src/lib.rs crates/hermes-desktop/src/lib.rs crates/hermes-ui/src/chat.rs crates/hermes-ui/assets/app.css
          git commit -m "feat: CH-11 native chat attachments"
          git push
