name: Windows lifecycle validation

on:
  pull_request:
    paths:
      - '.github/workflows/windows-lifecycle-validation.yml'
      - 'config/validation/windows-lifecycle-matrix.json'
      - 'scripts/ci/windows_lifecycle.py'
      - 'scripts/ci/Invoke-WindowsLifecycleScenario.ps1'
      - 'tests/test_windows_lifecycle.py'
      - 'docs/WINDOWS_LIFECYCLE_VALIDATION.md'
  workflow_dispatch:
    inputs:
      run_disposable:
        description: Build packages and exercise disposable hosted Windows scenarios
        required: true
        default: true
        type: boolean
      run_physical:
        description: Run trusted CPU-only and NVIDIA hardware lanes
        required: true
        default: false
        type: boolean
      stable_evaluation:
        description: Require every Stable scenario, including both physical hardware lanes
        required: true
        default: false
        type: boolean
      previous_installer_url:
        description: Optional previous-Stable NSIS installer URL for upgrade evidence
        required: false
        type: string
      previous_installer_sha256:
        description: Required SHA-256 when previous_installer_url is supplied
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-lifecycle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tooling-tests:
    name: Lifecycle tooling tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate matrix, Python and PowerShell tooling
        shell: pwsh
        run: |
          python -m py_compile '.\scripts\ci\windows_lifecycle.py' '.\tests\test_windows_lifecycle.py'
          python '.\scripts\ci\windows_lifecycle.py' validate
          python -m unittest '.\tests\test_windows_lifecycle.py' -v
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\ci\Invoke-WindowsLifecycleScenario.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            throw ($errors | ForEach-Object { $_.Message } | Out-String)
          }

  package-candidate:
    name: Build lifecycle candidate packages
    if: github.event_name == 'workflow_dispatch' && (inputs.run_disposable || inputs.run_physical)
    needs: tooling-tests
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Reconstruct, test and package the pinned candidate
        shell: pwsh
        run: |
          python '.\scripts\ci\compatibility.py' hermes-agent `
            --repository-root '.' `
            --work-dir '.\temp\windows-lifecycle\candidate' `
            --log-dir '.\artifacts\windows-lifecycle\package-logs' `
            --report '.\artifacts\windows-lifecycle\package-report.json' `
            --run-desktop-checks `
            --run-python-checks `
            --run-package-checks

      - name: Collect package artifacts
        shell: pwsh
        run: |
          $release = '.\temp\windows-lifecycle\candidate\hermes-agent\apps\desktop\release'
          $artifacts = @(Get-ChildItem -LiteralPath $release -File | Where-Object {
            $_.Name -like 'Hermes-Launcher-*-windows-x64-*'
          })
          if (@($artifacts | Where-Object Name -Like '*setup.exe').Count -ne 1) {
            throw 'Exactly one NSIS setup artifact is required.'
          }
          if (@($artifacts | Where-Object Name -Like '*portable.exe').Count -ne 1) {
            throw 'Exactly one portable artifact is required.'
          }
          $destination = '.\artifacts\windows-lifecycle\packages'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $artifacts | Copy-Item -Destination $destination
          Get-ChildItem -LiteralPath $destination -File | Get-FileHash -Algorithm SHA256 |
            Select-Object Path, Hash | ConvertTo-Json |
            Set-Content -LiteralPath (Join-Path $destination 'sha256.json') -Encoding utf8NoBOM

      - name: Upload candidate packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-lifecycle-packages
          path: |
            artifacts/windows-lifecycle/packages
            artifacts/windows-lifecycle/package-report.json
            artifacts/windows-lifecycle/package-logs
          if-no-files-found: error
          retention-days: 30

  hosted-scenarios:
    name: Disposable hosted Windows scenarios
    if: github.event_name == 'workflow_dispatch' && inputs.run_disposable
    needs: package-candidate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download candidate packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-lifecycle-packages
          path: downloaded/packages

      - name: Download immutable previous Stable installer
        if: inputs.previous_installer_url != ''
        shell: pwsh
        env:
          PREVIOUS_INSTALLER_URL: ${{ inputs.previous_installer_url }}
          PREVIOUS_INSTALLER_SHA256: ${{ inputs.previous_installer_sha256 }}
        run: |
          $uri = [Uri]$env:PREVIOUS_INSTALLER_URL
          if ($uri.Scheme -ne 'https') {
            throw 'previous_installer_url must use HTTPS.'
          }
          if ($env:PREVIOUS_INSTALLER_SHA256 -notmatch '^[a-fA-F0-9]{64}$') {
            throw 'previous_installer_sha256 must be a 64-character hexadecimal digest when a URL is supplied.'
          }
          Invoke-WebRequest -Uri $uri -OutFile '.\downloaded\previous-stable-setup.exe'
          $actual = (Get-FileHash -LiteralPath '.\downloaded\previous-stable-setup.exe' -Algorithm SHA256).Hash
          if ($actual -ne $env:PREVIOUS_INSTALLER_SHA256) {
            throw "Previous Stable installer SHA-256 mismatch: expected $env:PREVIOUS_INSTALLER_SHA256, got $actual"
          }

      - name: Exercise hosted scenario inventory
        id: scenarios
        continue-on-error: true
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          $matrix = Get-Content -Raw '.\config\validation\windows-lifecycle-matrix.json' | ConvertFrom-Json
          $failed = [Collections.Generic.List[string]]::new()
          foreach ($scenario in @($matrix.scenarios | Where-Object runnerClass -EQ 'hosted-windows')) {
            $arguments = @{
              Candidate = $env:CANDIDATE_SHA
              Scenario = $scenario.id
              EvidenceDirectory = '.\artifacts\windows-lifecycle\scenarios'
              PackageDirectory = '.\downloaded\packages'
              SandboxRoot = (Join-Path $env:RUNNER_TEMP "hermes-lifecycle-$($scenario.id)-$([guid]::NewGuid().ToString('N'))")
            }
            if (Test-Path -LiteralPath '.\downloaded\previous-stable-setup.exe') {
              $arguments.PreviousInstaller = '.\downloaded\previous-stable-setup.exe'
            }
            & '.\scripts\ci\Invoke-WindowsLifecycleScenario.ps1' @arguments
            if ($LASTEXITCODE -ne 0) {
              $failed.Add([string]$scenario.id)
            }
          }
          if ($failed.Count -gt 0) {
            throw "Hosted lifecycle failures: $($failed -join ', ')"
          }

      - name: Upload hosted scenario evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-lifecycle-hosted-scenarios
          path: artifacts/windows-lifecycle/scenarios
          if-no-files-found: error
          retention-days: 90

      - name: Enforce hosted scenario result
        if: steps.scenarios.outcome != 'success'
        shell: pwsh
        run: throw 'One or more hosted lifecycle scenarios failed. Inspect the retained evidence artifact.'

  physical-cpu:
    name: Trusted CPU-only lifecycle gate
    if: github.event_name == 'workflow_dispatch' && inputs.run_physical
    needs: package-candidate
    runs-on: [self-hosted, Windows, X64, hermes-lifecycle, cpu-only]
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download candidate packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-lifecycle-packages
          path: downloaded/packages
      - name: Run CPU-only package and runtime smoke
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          & '.\scripts\ci\Invoke-WindowsLifecycleScenario.ps1' `
            -Candidate $env:CANDIDATE_SHA `
            -Scenario physical-cpu `
            -EvidenceDirectory '.\artifacts\windows-lifecycle\physical-cpu' `
            -PackageDirectory '.\downloaded\packages' `
            -HardwareSmokeScript '.\Test-Hermes-Local.ps1' `
            -SandboxRoot (Join-Path $env:RUNNER_TEMP "hermes-lifecycle-cpu-$([guid]::NewGuid().ToString('N'))")
      - name: Upload CPU-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-lifecycle-physical-cpu-scenarios
          path: artifacts/windows-lifecycle/physical-cpu
          if-no-files-found: error
          retention-days: 90

  physical-nvidia:
    name: Trusted NVIDIA lifecycle gate
    if: github.event_name == 'workflow_dispatch' && inputs.run_physical
    needs: package-candidate
    runs-on: [self-hosted, Windows, X64, hermes-lifecycle, nvidia]
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download candidate packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-lifecycle-packages
          path: downloaded/packages
      - name: Run NVIDIA package and runtime smoke
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          & '.\scripts\ci\Invoke-WindowsLifecycleScenario.ps1' `
            -Candidate $env:CANDIDATE_SHA `
            -Scenario physical-nvidia `
            -EvidenceDirectory '.\artifacts\windows-lifecycle\physical-nvidia' `
            -PackageDirectory '.\downloaded\packages' `
            -HardwareSmokeScript '.\Test-Hermes-Local.ps1' `
            -SandboxRoot (Join-Path $env:RUNNER_TEMP "hermes-lifecycle-nvidia-$([guid]::NewGuid().ToString('N'))")
      - name: Upload NVIDIA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-lifecycle-physical-nvidia-scenarios
          path: artifacts/windows-lifecycle/physical-nvidia
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Publish lifecycle result
    if: always() && github.event_name == 'workflow_dispatch' && (inputs.run_disposable || inputs.run_physical)
    needs: [tooling-tests, package-candidate, hosted-scenarios, physical-cpu, physical-nvidia]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted reporting code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download scenario evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-lifecycle-*-scenarios
          path: downloaded
          merge-multiple: true
      - name: Aggregate and enforce lifecycle policy
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          STABLE_EVALUATION: ${{ inputs.stable_evaluation }}
        run: |
          $arguments = @(
            '.\scripts\ci\windows_lifecycle.py', 'aggregate',
            '--candidate', $env:CANDIDATE_SHA,
            '--workflow-run-id', '${{ github.run_id }}',
            '--evidence', 'downloaded/**/*.json',
            '--output', '.\artifacts\windows-lifecycle\aggregate\windows-lifecycle-report.json'
          )
          if ($env:STABLE_EVALUATION -eq 'true') { $arguments += '--stable' }
          python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Add lifecycle summary
        if: always()
        shell: pwsh
        run: |
          $path = '.\artifacts\windows-lifecycle\aggregate\windows-lifecycle-report.json'
          if (-not (Test-Path -LiteralPath $path)) { return }
          $report = Get-Content -Raw $path | ConvertFrom-Json
          @(
            '# Windows lifecycle validation', '',
            "**Status:** ``$($report.status)``", "**Candidate:** ``$($report.candidate)``", '',
            '| Passed | Failed | Skipped |', '|---:|---:|---:|',
            "| $($report.summary.passed) | $($report.summary.failed) | $($report.summary.skipped) |"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Upload aggregate lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-lifecycle-aggregate
          path: artifacts/windows-lifecycle/aggregate
          if-no-files-found: error
          retention-days: 90
