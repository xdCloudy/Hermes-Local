name: Dioxus Files one-shot wire

on:
  push:
    branches:
      - refactor/dioxus-rust-client

permissions:
  contents: write

jobs:
  wire-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wire Files component and remove one-shot workflow
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("crates/hermes-ui/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = '''simple_surface!(
              Files,
              "Workspace",
              "Files",
              "Browse and edit files inside a selected project root."
          );'''
          new = '''mod files;
          use files::Files;'''
          if old not in text:
              raise SystemExit("Files placeholder not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          '@ | python -
          cargo fmt --all
          git rm -- .github/workflows/dioxus-files-wire-once.yml
          git add -- crates/hermes-ui/src/lib.rs crates/hermes-ui/src/files.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(dioxus): wire Files workspace"
          git push origin HEAD:refactor/dioxus-rust-client
