name: Temporary compose Cloud connection v6

on:
  push:
    branches:
      - agent/cloud-connection
    paths:
      - ".github/workflows/tmp-compose-cloud-connection-v6.yml"

permissions:
  contents: write

jobs:
  compose:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloud-connection
      - name: Run Cloud composition with UI ownership fix
        shell: python
        run: |
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-compose-cloud-connection-v5.yml').read_text(encoding='utf-8')
          start = '      - name: Run structural Cloud composition\n        shell: python\n        run: |\n'
          end = '      - name: Format and focused validation\n'
          script = textwrap.dedent(workflow.split(start, 1)[1].split(end, 1)[0])
          exec(compile(script, '<cloud-compose-v5>', 'exec'), {'__name__': '__main__'})

          ui = Path('crates/hermes-ui/src/lib.rs')
          text = ui.read_text(encoding='utf-8')
          old = '    let cloud_state = (cloud.state)();\n    let current_profile = (settings.settings)()'
          new = '    let cloud_state = (cloud.state)();\n    let discover_org = cloud_state.selected_org.clone();\n    let current_profile = (settings.settings)()'
          if text.count(old) != 1:
              raise SystemExit(f'Cloud state anchor count={text.count(old)}')
          text = text.replace(old, new)
          old = 'onclick: move |_| cloud.discover.call(cloud_state.selected_org.clone())'
          new = 'onclick: move |_| cloud.discover.call(discover_org.clone())'
          if text.count(old) != 1:
              raise SystemExit(f'Cloud discover closure anchor count={text.count(old)}')
          ui.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
      - name: Format and focused validation
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "rustfmt failed" }
          cargo check -p hermes-core --locked
          if ($LASTEXITCODE -ne 0) { throw "hermes-core check failed" }
          cargo test -p hermes-desktop --locked cloud -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "hermes-desktop Cloud tests failed" }
          cargo test -p hermes-ui --locked cloud -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "hermes-ui Cloud tests failed" }
          cargo check -p hermes-local --bin hermes-local --locked
          if ($LASTEXITCODE -ne 0) { throw "Desktop Cloud composition failed" }
      - name: Commit composed source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/hermes-core/src/lib.rs crates/hermes-desktop/src/lib.rs crates/hermes-ui/src/lib.rs crates/hermes-ui/src/cloud.rs apps/desktop/src/main.rs apps/desktop/src/cloud_bridge.rs apps/desktop/src/local_gateway.rs apps/desktop/src/ssh_service.rs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "diff check failed" }
          git commit -m "feat(cn-06): port Hermes Cloud discovery and connection"
          if ($LASTEXITCODE -ne 0) { throw "Cloud source commit failed" }
          git push origin HEAD:agent/cloud-connection
          if ($LASTEXITCODE -ne 0) { throw "Cloud source push failed" }
