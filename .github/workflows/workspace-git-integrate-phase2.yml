name: Finalize validated Workspace Git tranche

on:
  push:
    branches:
      - goal-loop/workspace-git-tranche
    paths:
      - .github/workflows/workspace-git-integrate-phase2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal-loop/workspace-git-tranche
          fetch-depth: 0

      - name: Layer validated GT-07 discovery slice
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin goal-loop/gt07-repo-discovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --binary --output=gt07-disjoint.patch d161776102c9e7e05ee8ec7828fba4d0020882a2..612620595fd5aebe57c738d7d4007d31619996fc -- `
            apps/desktop/src/git_repo_scan_service.rs `
            crates/hermes-desktop/tests/git_repo_discovery_ui_contract.rs `
            crates/hermes-ui/src/lib.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --3way --index gt07-disjoint.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item gt07-disjoint.patch

          python scripts/ci/workspace_git_merge_gt07_shared.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -A
          git commit -m "feat(projects): add cancellable repository discovery"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff d161776102c9e7e05ee8ec7828fba4d0020882a2..HEAD --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate complete Workspace Git tranche
        shell: pwsh
        run: |
          python scripts/ci/check_dioxus_rust_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo test -p hermes-desktop --test git_status_parity --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_ship_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_review --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_discard_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_ship_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_branch_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_worktree_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_source_control_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-local git_repo_scan_service --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_repo_discovery_ui_contract --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo clippy --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish clean final tranche
        shell: pwsh
        run: |
          Remove-Item .github/workflows/workspace-git-integrate-phase2.yml
          Remove-Item scripts/ci/workspace_git_merge_gt07_shared.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): remove final Workspace Git integration helpers"
          git push origin HEAD:goal-loop/workspace-git-tranche
