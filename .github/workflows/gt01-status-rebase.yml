name: Rebase validated GT-01 status parity

on:
  push:
    branches:
      - goal-loop/gt01-status-parity-rebased
    paths:
      - .github/workflows/gt01-status-rebase.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebase:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal-loop/gt01-status-parity-rebased
          fetch-depth: 0

      - name: Replay only validated GT-01 product changes
        shell: pwsh
        run: |
          python scripts/ci/gt01_replay_product.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate integrated GT-01 status behavior
        shell: pwsh
        run: |
          python scripts/ci/check_dioxus_rust_architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p hermes-ui --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop --test git_status_parity --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p hermes-desktop parses_unborn_and_detached_porcelain_headers --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish clean GT-01 branch
        shell: pwsh
        run: |
          Remove-Item .github/workflows/gt01-status-rebase.yml
          Remove-Item scripts/ci/gt01_replay_product.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(git): handle unborn and detached status parity"
          git push origin HEAD:goal-loop/gt01-status-parity-rebased
