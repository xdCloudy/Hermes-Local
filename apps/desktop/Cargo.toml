[package]
name = "hermes-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
bundle = []

[dependencies]
async-stream.workspace = true
dioxus = { workspace = true, features = ["desktop", "launch"] }
hermes-core = { path = "../../crates/hermes-core" }
hermes-desktop = { path = "../../crates/hermes-desktop" }
hermes-protocol = { path = "../../crates/hermes-protocol" }
hermes-ui = { path = "../../crates/hermes-ui" }
open.workspace = true
portable-pty.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
rfd.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }
url.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["v1", "windows-native-keyring-store"] }

[lints]
workspace = true
